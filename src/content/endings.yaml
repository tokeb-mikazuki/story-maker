# 종료 사유 → 결산 첫머리 문장
사망: |
  당신은 쓰러졌고, 다시 일어나지 못했습니다. 이 도시에서 아주 흔한 일입니다.
노환: |
  당신은 늙어서 죽었습니다. 이 도시에서, 그건 거의 승리입니다.
청소: |
  4시 34분이 지나고 해가 떴을 때, 골목은 아주 깨끗했습니다. 당신이 있었다는 흔적조차.
금기: |
  당신은 도시의 금기를 어겼습니다. 머리는 맥락을 따지지 않습니다. 당신에 대한 기록은 그날로 정리되었습니다.
뒤틀림: |
  당신은 목소리를 받아들였고, 더 이상 사람의 모습이 아니게 되었습니다. 하나 협회는 당신에게 일련번호를 붙였습니다.
폐인: |
  당신은 침대에서 일어나지 않았습니다. 몸은 그 뒤로도 한동안 살아 있었지만, 이야기는 그날 끝났습니다.
실종: |
  당신은 사라졌습니다. 외곽으로 갔다는 사람도, 다른 구에서 다른 이름으로 산다는 사람도 있었습니다. 확인한 사람은 없습니다.
은퇴: |
  당신은 스스로 멈추었습니다. 도시는 당신 없이도 잘 굴러갔고, 당신은 그게 서운하지 않았습니다.
붕괴: |
  마음이 먼저 끝났습니다.
