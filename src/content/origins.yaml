# 출생 배경. 게임 시작 시 이 중 3개가 무작위로 제시된다.
# tags 규칙: "키=값" 또는 "키"(플래그). 거주 / 출신구 / 출신 / 가정 / 보호 는 엔진·이벤트가 참조한다.

- id: k_nest
  title: K사 둥지
  summary: 11구, 제약회사 연구원 부모 밑에서
  money: 2000000
  tags: [출신구=11구, 출신=둥지, 거주=둥지, 가정=깃털, 날개=K사]
  virtues: { 신중: 2 }
  abilities: { 학식: 1 }
  text: |
    당신은 11구, K사 둥지의 깨끗한 병원에서 태어났습니다.
    어머니는 K사 연구소의 연구원이고, 아버지는 같은 회사의 경비 부서에서 일합니다. 두 사람은 일주일에 70시간을 회사에 바치고, 그 대가로 길을 걷다 죽을 걱정 없는 삶을 삽니다.
    병실 창밖으로는 검문소 너머 11구 뒷골목의 지붕들이 보입니다. 부모님은 당신이 저쪽으로 넘어가는 일은 평생 없기를 바랍니다.

- id: t_worker
  title: T사 둥지
  summary: 20구, 하루가 짧은 공장 노동자의 집
  money: 100000
  tags: [출신구=20구, 출신=둥지, 거주=둥지, 가정=노동자, 날개=T사]
  virtues: { 자제: 2 }
  abilities: { 기술: 1 }
  text: |
    당신은 20구, T사 둥지의 회색 연립주택에서 태어났습니다.
    이곳에서는 시간이 돈입니다. 말 그대로요. 공장에서 일하는 부모님의 하루는 열 시간 남짓이라, 두 사람은 늘 남들보다 느리게 움직입니다. 당신의 울음소리가 부모님 귀에는 아주 빠르게 들렸을 겁니다.
    창밖 세상은 흑백 사진 같습니다. 색을 돌려받을 돈이 없는 집에서는, 아기의 첫 기억도 회색으로 시작합니다.

- id: b23
  title: 23구 뒷골목
  summary: W사 옆, '맛의 골목'의 식당 2층
  money: 150000
  tags: [출신구=23구, 출신=뒷골목, 거주=뒷골목, 가정=식당, 보호=엄지]
  virtues: { 용기: 2 }
  abilities: { 생존: 1 }
  text: |
    당신은 23구 뒷골목, 작은 국숫집 2층에서 태어났습니다.
    23구는 '맛의 골목'이라 불립니다. 이 동네에서는 맛을 위해서라면 무엇이든 재료가 될 수 있다는 소문이 돕니다. 당신의 부모님 가게는 그런 집이 아니라고, 부모님은 늘 손님들에게 강조합니다.
    가게는 매달 붉은 코트를 입은 사람들에게 돈을 냅니다. 그 대가로 이 골목의 다른 놈들은 가게를 건드리지 않습니다. 이 동네에서는 그게 평화입니다.

- id: b25
  title: 25구 뒷골목
  summary: 도시 최북단, 추운 빈민가
  money: 50000
  tags: [출신구=25구, 출신=뒷골목, 거주=뒷골목, 가정=빈민, 보호=없음]
  virtues: { 자제: 2 }
  abilities: { 생존: 1 }
  text: |
    당신은 25구 뒷골목에서 태어났습니다. 지도에서 가장 북쪽이고, 그래서 가장 추운 동네입니다.
    이곳 사람들은 대부분 가난합니다. 유흥 시설도 없고, 자랑할 만한 것도 없습니다. 대폿집의 파전이 맛있다는 것 정도를 빼면요.
    누구도 이 동네를 보호해 주지 않습니다. 보호받을 만한 돈이 없으니까요. 대신 이웃들은 서로의 문을 두드려 줄 정도의 정은 남아 있습니다.

- id: b4
  title: 4구 뒷골목
  summary: D사 옆, 평범한 빈민가
  money: 120000
  tags: [출신구=4구, 출신=뒷골목, 거주=뒷골목, 가정=소시민, 보호=검지]
  virtues: { 정의: 2 }
  abilities: { 화술: 1 }
  text: |
    당신은 4구 뒷골목, D사 둥지와 맞닿은 평범한 빈민가에서 태어났습니다.
    다른 뒷골목에 비하면 조용한 편입니다. 이 구역은 하얀 망토를 두른 사람들이 '보호'합니다. 돈은 받지 않습니다. 대신 가끔 쪽지가 옵니다. 쪽지에 적힌 대로만 하면 됩니다.
    어머니는 당신을 안고 그 쪽지를 오래 들여다봅니다. 이번 것은 간단했습니다. "아이의 이름을 세 번 거꾸로 불러라."

- id: hongwon
  title: 홍원 (8구)
  summary: 구룡채성 같은 거대 건축물의 테두리
  money: 100000
  tags: [출신구=8구, 출신=뒷골목, 거주=뒷골목, 가정=소시민, 보호=없음]
  virtues: { 신중: 2 }
  abilities: { 은신: 1 }
  text: |
    당신은 8구, '홍원'이라 불리는 거대한 건물의 바깥 테두리에서 태어났습니다.
    이곳의 하늘은 천장입니다. 건물들은 때때로 스스로 움직이고, 매달 한 번 종이 울리면 노래와 함께 모든 방이 다시 배치됩니다. 재적일이라고 합니다. 일한 만큼, 번 만큼 방이 주어집니다.
    당신이 태어난 다음 달, 부모님의 방은 반으로 줄었습니다. 그래도 바닥이 남아 있었으니 다행입니다.

- id: b14
  title: 14구 뒷골목
  summary: N사 옆, 공방 거리의 아이
  money: 200000
  tags: [출신구=14구, 출신=뒷골목, 거주=뒷골목, 가정=공방, 보호=중지]
  virtues: { 정의: 2 }
  abilities: { 기술: 1 }
  text: |
    당신은 14구 뒷골목의 공방 거리, 망치 소리가 끊이지 않는 작은 공방에서 태어났습니다.
    아버지는 해결사들에게 무기를 고쳐 주고, 어머니는 장부를 씁니다. 거리 이름은 버터 거리. 이 동네 길 이름은 다 먹을 것이라 배고플 때 길을 물으면 서럽습니다.
    공방은 보라색 문신을 한 사람들과 '가족'처럼 지냅니다. 가족에게 해를 끼치는 놈은 절대 잊지 않는 사람들이라, 이 거리에서 공방을 터는 놈은 없습니다.

- id: s19
  title: S사 19구 뒷골목
  summary: 대호수 옆 어촌, 초가집의 아이
  unlocked: false
  money: 30000
  tags: [출신구=19구, 출신=뒷골목, 거주=뒷골목, 가정=어부, 보호=없음]
  virtues: { 용기: 2 }
  abilities: { 생존: 1 }
  text: |
    당신은 19구 뒷골목, 대호수 가의 복층 초가집에서 태어났습니다.
    성벽 너머 S사 둥지에서는 살과 뼈의 대감들이 쌀을 쥐고 있다고들 합니다. 이쪽 사람들은 그물을 쥐고 삽니다.
