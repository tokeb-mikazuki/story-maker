# 984년 1월, 20세. 진로 결정.
# 직업 태그: 직업=깃털|해결사|조직원|공방견습|소시민|쥐
# 월급 태그는 매달 정산 시 수입으로 들어온다.

- id: adult.career
  kind: story
  fixed: true
  stage: adult
  date: ['984.01', '984.06']
  tone: neutral
  title: 984년
  text: |
    984년 1월. 당신은 스무 살이 되었습니다.
    백야와 흑주가 지나간 지 두 해. L사의 자리는 여전히 비어 있고, 12구에서는 손가락과 해결사들이 땅을 두고 싸우고 있다고 합니다. 사람이 괴물로 변했다는 소문은 이제 놀랍지도 않습니다.
    그래도 사람은 먹고살아야 합니다. 무엇으로 먹고살겠습니까?
  choices:
    - text: 날개에 입사한다.
      requires: { tag: 학력=둥지대학 }
      outcome:
        effects:
          - { addTag: 직업=깃털 }
          - { addTag: 직원등급=1 }
          - { addTag: 월급=3000000 }
          - { addTag: 거주=둥지 }
          - { sp: 5 }
        text: |
          입사 계약서는 열두 장이었습니다. 당신은 앞의 두 장을 꼼꼼히 읽고, 나머지는 서명란만 찾았습니다. 모두가 그렇게 합니다. 날개에 들어간다는 것만으로 감지덕지니까요.
          당신은 이제 '깃털'입니다. 1등급 직원. 주 70시간 근무, 둥지 거주권, 그리고 아직 읽지 않은 열 장.
    - text: 하나 협회에서 해결사 면허를 딴다.
      outcome:
        effects:
          - { addTag: 직업=해결사 }
          - { addTag: 해결사등급=9 }
          - { addTag: 월급=0 }
          - { addTag: 거주=뒷골목 }
          - { addTag: 실적=0 }
        text: |
          하나 협회 접수창구의 직원은 당신 얼굴을 보지도 않고 도장을 찍었습니다. 9급. FIN 번호가 적힌 등록증 한 장.
          아무도 고용해 주지 않아서, 당신은 뒷골목에 1인 사무소 간판을 걸었습니다. 9급 해결사가 둥지에 살 수는 없으니까요. 이제부터는 실적이 전부입니다.
    - text: 조직에 들어간다.
      requires: { any: [{ tag: 진로준비=조직 }, { tag: 인맥=동네조직 }, { ability: { 생존: 2 } }] }
      outcome:
        effects:
          - { addTag: 직업=조직원 }
          - { addTag: 조직서열=1 }
          - { addTag: 월급=500000 }
          - { addTag: 거주=뒷골목 }
          - { sin: 오만 }
        text: |
          당구장의 형들이 당신을 위층으로 데려갔습니다. 그곳에는 더 무서운 사람들이 있었고, 그 사람들 위에는 금색 휘장을 단 사람들이 있다고 합니다. 손가락이요.
          당신은 이제 '우리 꼬마'가 아니라 말단입니다.
    - text: 공방에 견습생으로 들어간다.
      requires: { ability: { 기술: 2 } }
      outcome:
        effects:
          - { addTag: 직업=공방견습 }
          - { addTag: 월급=900000 }
          - { addTag: 거주=뒷골목 }
          - { addTag: 숙련=0 }
        text: |
          공방 주인은 당신 손바닥의 굳은살을 보고 고개를 끄덕였습니다. "트레스 협회 장인 시험에 붙기 전까지는 네 이름으로 아무것도 못 판다. 알지?"
          망치 소리가 당신의 새 시계가 되었습니다.
    - text: 뒷골목에서 평범한 일자리를 구한다.
      outcome:
        effects:
          - { addTag: 직업=소시민 }
          - { addTag: 월급=700000 }
          - { addTag: 거주=뒷골목 }
        text: |
          반찬가게, 수리점, 샌드위치 가게. 대단한 일은 아니지만 매달 돈이 들어오고, 거주구역 등록비를 낼 수 있습니다. 밤에 문을 잠그고 잘 수 있다는 것. 뒷골목에서는 그게 중산층입니다.
