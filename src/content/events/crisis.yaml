# 정신이 −45에 도달했을 때 강제 발생. 엔진이 ID로 직접 호출한다(weight: 0).
# 백야(982) 이후: crisis.voice — 목소리 → 뒤틀림 또는 E.G.O
# 백야 이전:    crisis.breakdown — 일반적인 붕괴

- id: crisis.voice
  kind: crisis
  weight: 0
  tone: negative
  title: 목소리
  text: |
    모든 것이 무너져 내립니다. 붙잡고 있던 것이 손가락 사이로 빠져나갑니다.
    그때, 목소리가 들립니다. 아름답고, 따스하고, 어딘가 그리운 목소리.
    "많이 힘들었지. 이제 그만 참아도 돼. 남들 시선 따위 신경 쓰지 말고, 네가 원하는 대로 살아. 너만을 위해서. 너 자신을 사랑해도 돼."
    멀리서 종소리가 울리기 시작합니다.
  choices:
    - text: 목소리를 받아들인다.
      outcome:
        effects: [{ end: 뒤틀림 }]
        text: 종소리가 가까워집니다. 당신의 몸이, 당신이 오래 삼켜 온 것의 모양으로 바뀌기 시작합니다. 이상하게도 하나도 아프지 않습니다. 처음으로, 자유롭습니다.
    - text: "아니. 나는 내가 붙잡은 것을 놓지 않는다."
      requires: { all: [{ tag: 신념 }, { not: { tag: 상태:금이간마음 } }] }
      check: { virtue: 정의, difficulty: 3, bonus: 10 }
      success:
        effects: [{ sp: 45 }, { addTag: 신체:EGO }, { tagAdd: { key: 명성, value: 10 } }, { hpMax: 6 }, { ability: { 전투: 2 } }, { emotion: pos }]
        text: |
          당신은 목소리를 밀어냈습니다. 앞으로 겪을 고통과, 앞으로 짊어질 것들을 그대로 받아들이겠다고.
          종소리가 멎었습니다. 대신 당신의 손에, 당신의 마음을 닮은 무언가가 쥐어져 있었습니다. 무기인지, 갑옷인지, 아니면 다른 무엇인지. 사람들은 이것을 E.G.O라고, 혹은 '신비'라고 부릅니다.
          주위의 풍경이 잠시 당신의 마음처럼 일렁이다가 원래대로 돌아왔습니다.
      failure:
        effects: [{ sp: 20 }, { addTag: 상태:금이간마음 }, { emotion: neg }]
        text: 당신은 버텼습니다. 간신히. 종소리는 멀어졌지만 완전히 사라지지는 않았습니다. 마음에 금이 갔습니다. 다음에 그 목소리가 오면, 이번처럼 밀어낼 수 있을지 모르겠습니다.
    - text: 이를 악물고 아무것도 듣지 않는다.
      requires: { not: { tag: 상태:금이간마음 } }
      check: { virtue: 자제, difficulty: 4 }
      success:
        effects: [{ sp: 15 }, { addTag: 상태:금이간마음 }]
        text: 당신은 귀를 막고, 숫자를 셌습니다. 1973까지. 목소리는 사라졌습니다. 대가로 무언가가 금이 갔습니다.
      failure:
        effects: [{ end: 뒤틀림 }]
        text: 목소리는 귀를 막아도 들립니다. 원래 귀로 듣는 소리가 아니었으니까요.

- id: crisis.breakdown
  kind: crisis
  weight: 0
  tone: negative
  title: 무너짐
  text: |
    더는 버틸 수 없을 것 같습니다. 아침에 눈을 뜨는 것도, 숟가락을 드는 것도, 다음 날을 생각하는 것도.
    이 도시는 무너진 사람에게 친절하지 않습니다. 그래도, 무너진 사람은 매일 생깁니다.
  choices:
    - text: 누군가에게 손을 내민다.
      check: { ability: 화술, difficulty: 1, bonus: 10 }
      success:
        effects: [{ sp: 30 }, { emotion: pos }]
        text: 당신 손을 잡아 준 사람이 있었습니다. 대단한 말은 하지 않았습니다. 그저 옆에 있었습니다. 그것으로 충분한 날도 있습니다.
      failure:
        effects: [{ sp: 15 }, { hp: -2 }]
        text: 아무도 잡아 주지 않았습니다. 그래도 내밀었던 손을 거두며, 당신은 아직 무언가를 원한다는 걸 알았습니다. 그거면 하루는 더 버틸 수 있습니다.
    - text: 혼자 견딘다.
      check: { virtue: 자제, difficulty: 2 }
      success:
        effects: [{ sp: 20 }, { virtue: { 자제: 1 } }]
        text: 당신은 침대에서 일어나지 못한 채 며칠을 보냈습니다. 그리고 어느 날 아침, 일어났습니다. 이유는 모르겠습니다.
      failure:
        effects: [{ end: 폐인 }]
        text: 당신은 일어나지 않았습니다.
    - text: 모든 것을 두고 떠난다.
      outcome:
        effects: [{ end: 실종 }]
        text: 당신은 아무에게도 말하지 않고 집을 나섰습니다. 그리고 다시는 돌아오지 않았습니다.
