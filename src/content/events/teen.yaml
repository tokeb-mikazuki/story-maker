# 청소년기 (13~19세). 한 턴 = 1년. 977~983년.

- id: teen.path
  stage: teen
  age: [13, 14]
  once: true
  tone: neutral
  title: 갈림길
  text: |
    열세 살. 도시에서는 이 나이면 앞으로 무엇이 될지 대충 정해지기 시작합니다.
    둥지 대학에 들어가 날개에 입사하는 길. 몸을 단련해 면허를 따고 해결사가 되는 길. 손에 기술을 익혀 공방에 들어가는 길. 그리고 골목의 형들이 걸어간 길.
    무엇을 준비하시겠습니까?
  choices:
    - text: 입시를 준비한다.
      outcome:
        effects: [{ addTag: 진로준비=입시 }, { ability: { 학식: 1 } }]
        text: 당신은 책상 앞에 앉았습니다. 뒷골목 출신이라면 '입시촌'이라는 곳이 있습니다. 둥지에 가기 위해 시험을 준비하는 사람들이 모여 사는 마을. 그곳 사람들은 3시 13분에도 공부를 합니다. 거주구역 안에서요.
    - text: 몸을 단련한다.
      outcome:
        effects: [{ addTag: 진로준비=단련 }, { ability: { 전투: 1 } }]
        text: 당신은 동네 체육관에 다니기 시작했습니다. 관장은 은퇴한 6급 해결사입니다. "시술만 받으면 강해질 줄 알지? 아니야. 이 도시에서 제일 중요한 건 기량이다."
    - text: 공방에서 잔심부름을 시작한다.
      outcome:
        effects: [{ addTag: 진로준비=공방 }, { ability: { 기술: 1 } }]
        text: 기름 냄새와 쇳가루. 공방 주인은 당신에게 걸레부터 쥐여 주었습니다. "트레스 협회 시험 붙으려면 십 년은 닦아야 해."
    - text: 골목의 형들과 어울린다.
      outcome:
        effects: [{ addTag: 진로준비=조직 }, { ability: { 생존: 1 } }, { sin: 오만 }]
        text: 형들은 당신에게 담배와 욕과, 밤이 오기 전에 어디로 숨어야 하는지를 가르쳐 주었습니다. 셋 중 가장 쓸모 있는 건 마지막 것이었습니다.

- id: teen.lobotomy
  kind: story
  fixed: true
  stage: teen
  date: ['977.01', '981.12']
  tone: neutral
  title: 새로운 날개
  text: |
    요즘 도시에서 가장 많이 들리는 이름은 로보토미 코퍼레이션입니다. 연기 전쟁 뒤 L사의 자리를 차지한 에너지 회사.
    전 L사와 달리 에너지를 아주 후하게 판다고 합니다. 덕분에 W사의 워프 열차 표값이 내렸고, T사는 새 기술을 쏟아내고 있습니다. 거리의 광고판에는 이렇게 적혀 있습니다. "FACE THE FEAR, BUILD THE FUTURE."
    로보토미가 직원을 뽑는다는 소문도 있습니다. 입사 조건이 이상합니다. '마음에 상처가 있는 자'.
  choices:
    - text: 로보토미 입사 공고를 오려 둔다.
      outcome:
        effects: [{ addTag: 기록:로보토미_공고 }, { sp: 3 }]
        text: 날개 입사. 둥지. 연봉. 당신은 오려 둔 종이를 침대 밑에 넣어 두었습니다. 몇 년 뒤, 그 종이를 다시 꺼내 볼 일은 없을 겁니다. 그 회사가 더 이상 존재하지 않을 테니까요.
    - text: 에너지가 어디서 오는지 궁금해한다.
      outcome:
        effects: [{ virtue: { 신중: 2 } }, { ability: { 학식: 1 } }]
        text: 아무도 모릅니다. 아는 사람은 말하지 않습니다. 이 도시의 모든 특이점이 그렇습니다. 기업은 감추고, 사람들은 묻기를 포기했습니다. 지쳤거든요.
    - text: 관심 없다. 오늘 저녁이 더 중요하다.
      outcome:
        effects: [{ virtue: { 자제: 1 } }]
        text: 날개가 바뀌어도 당신 집 식탁은 바뀌지 않습니다. 적어도 지금은 그렇게 보입니다.

- id: teen.first_fight
  stage: teen
  age: [14, 18]
  once: true
  tone: negative
  title: 골목의 규칙
  text: |
    해 질 녘, 낯선 녀석 셋이 당신의 길을 막습니다. 조잡한 공방제 칼을 든 녀석이 웃습니다. "가진 거 다 내놔. 아니면 밤까지 여기 묶어 둘까?"
    밤까지 묶여 있다는 게 무슨 뜻인지, 이 도시 아이라면 모두 압니다.
  choices:
    - text: 싸운다.
      check: { ability: 전투, difficulty: 1 }
      success:
        effects: [{ ability: { 전투: 1 } }, { virtue: { 용기: 2 } }, { sp: 6 }, { sin: 분노 }]
        text: 칼을 든 녀석의 손목을 꺾자 나머지 둘이 도망쳤습니다. 당신 손은 한참 떨렸습니다. 무서워서였는지, 즐거워서였는지는 모르겠습니다.
      failure:
        effects: [{ hp: -4 }, { money: -20000 }, { sp: -6 }]
        text: 당신은 바닥에 쓰러졌고, 녀석들은 당신 주머니를 털어 갔습니다. 다행히 묶어 두지는 않았습니다. 귀찮았던 모양입니다.
    - text: 말로 구슬린다.
      check: { ability: 화술, difficulty: 2 }
      success:
        effects: [{ ability: { 화술: 1 } }, { sp: 3 }]
        text: "\"내가 누구 동생인지 알아?\" 당신이 지어낸 이름은 꽤 그럴듯했습니다. 녀석들은 슬금슬금 물러났습니다. 거짓말도 기술입니다."
      failure:
        effects: [{ hp: -3 }, { money: -20000 }]
        text: 녀석들은 당신의 말을 끝까지 들어 주지 않았습니다.
    - text: 가진 걸 내준다.
      outcome:
        effects: [{ money: -20000 }, { virtue: { 자제: 1 } }, { sp: -3 }]
        text: 돈은 또 벌면 됩니다. 이 도시에서 목숨은 그렇지 않습니다. 대체로는요.

- id: teen.cheap_tattoo
  stage: teen
  age: [15, 19]
  once: true
  tone: neutral
  when: { tag: 출신=뒷골목 }
  title: 싸구려 문신
  text: |
    골목 안쪽 지하 시술소. 간판에는 '강화 문신 — 학생 할인'이라고 적혀 있습니다.
    강화 문신은 오래전 망한 날개의 특이점이었는데, 특허가 풀린 뒤로는 아무나 새길 수 있게 되었습니다. 물감이 좋을수록 강해지고, 싸구려 물감이면 새긴 자리가 녹아내릴 수도 있다고 합니다.
    시술사가 바늘을 흔들어 보입니다. "오늘은 반값."
  choices:
    - text: 팔뚝에 새긴다. (10만 안)
      requires: { money: { gte: 100000 } }
      check: { ability: 생존, difficulty: 1 }
      success:
        effects: [{ money: -100000 }, { addTag: 신체:강화문신 }, { hpMax: 2 }, { ability: { 전투: 1 } }]
        text: 따끔한 통증이 사흘 갔고, 그 뒤로 당신은 전봇대도 흔들 수 있을 것 같았습니다. 실제로 흔들어 보지는 않았습니다.
      failure:
        effects: [{ money: -100000 }, { hp: -4 }, { sp: -8 }, { addTag: 기록:문신_부작용 }]
        text: 이틀째 밤, 문신 자리가 끓는 것처럼 뜨거워지더니 살이 물러지기 시작했습니다. 흉터만 남았습니다. 시술소는 다음 주에 간판을 바꿔 달았습니다.
    - text: 그냥 지나간다.
      outcome:
        effects: [{ virtue: { 신중: 1 } }]
        text: 문신이 있으면 조직에서 쉽게 나올 수 없다는 말을 들은 적이 있습니다. 당신은 아직 어디에도 묶이고 싶지 않습니다.

- id: teen.friend
  stage: teen
  age: [13, 19]
  once: true
  tone: positive
  title: 친구
  text: |
    같은 동네의 또래 하나가 당신 옆에 자주 앉습니다. 말이 많고, 잘 웃고, 꿈이 큰 아이입니다. "나는 언젠가 특색이 될 거야. 너는?"
  choices:
    - text: 같이 꿈을 이야기한다.
      outcome:
        effects: [{ addTag: 인맥=어린친구 }, { sp: 8 }, { emotion: pos }]
        text: 둘은 3시 13분이 되기 직전까지 이야기했습니다. 그리고 각자 집으로 뛰어갔습니다. 그런 밤이 몇 번 더 있었습니다.
    - text: 꿈 같은 건 없다고 말한다.
      outcome:
        effects: [{ addTag: 인맥=어린친구 }, { virtue: { 신중: 1 } }]
        text: 친구는 잠시 조용하더니 말했습니다. "그럼 내 거 같이 하자." 당신은 웃어 버렸습니다.

- id: teen.exam
  stage: teen
  age: [18, 19]
  once: true
  tone: neutral
  when: { any: [{ tag: 진로준비=입시 }, { tag: 학교=둥지 }] }
  title: 수능
  text: |
    오늘 하루가 당신의 남은 인생을 정합니다. 적어도 모두가 그렇게 말합니다.
    둥지 대학에 들어가지 못하면 날개 입사는 꿈도 꿀 수 없습니다. 시험장 창밖으로 뒷골목이 보이도록 일부러 배치했다는 소문이 있습니다.
  choices:
    - text: 펜을 든다.
      check: { ability: 학식, difficulty: 2, bonus: 5 }
      success:
        effects: [{ addTag: 학력=둥지대학 }, { sp: 12 }, { emotion: pos }]
        text: 합격 통지서에는 날개의 로고가 찍혀 있었습니다. 부모님은 울었습니다. 당신은 창밖의 뒷골목을 한참 바라보았습니다. 이제 저기로 떨어지지 않아도 된다고, 그렇게 믿기로 했습니다.
      failure:
        effects: [{ sp: -15 }, { emotion: neg }, { sin: 우울 }, { addTag: 기록:수능_낙방 }]
        text: 점수는 커트라인에 한참 못 미쳤습니다. 내년에 다시 볼 수도 있지만, 입시촌 방세가 그 '내년'을 허락할지는 모르겠습니다.

- id: teen.work
  stage: teen
  age: [15, 19]
  cooldown: 2
  weight: 8
  tone: neutral
  group: work
  title: 아르바이트
  text: |
    용돈을 벌어야 합니다. 햄햄팡팡에서 샌드위치를 싸는 일, 공방에서 부품을 나르는 일, 둥지 사람들의 짐을 들어 주는 일.
  choices:
    - text: 샌드위치 가게에서 일한다.
      outcome:
        effects: [{ money: 150000 }, { virtue: { 자제: 1 } }]
        text: 하루 종일 같은 샌드위치를 쌉니다. 손님 대부분은 해결사입니다. 그들은 늘 급하고, 늘 배가 고프고, 가끔은 다시 오지 않습니다.
    - text: 공방 짐꾼을 한다.
      outcome:
        effects: [{ money: 120000 }, { ability: { 기술: 1 } }]
        text: 무거운 쇳덩이를 나르며 어깨너머로 망치질을 훔쳐보았습니다.
    - text: 해결사 사무소 전단을 돌린다.
      outcome:
        effects: [{ money: 100000 }, { ability: { 화술: 1 } }]
        text: "'윤 사무소 — 고양이부터 무엇이든.' 전단을 받은 사람 중 누구도 전화하지 않았습니다. 당신은 전단 한 장을 몰래 간직했습니다."

- id: teen.white_nights
  kind: story
  fixed: true
  stage: teen
  date: ['982.01', '983.06']
  tone: neutral
  title: 백야
  text: |
    그날, 12구 한복판에서 빛기둥이 솟았습니다.
    사흘 동안 밤이 오지 않았습니다. 3시 13분에도 하늘은 하얗게 빛났고, 청소부들조차 나오지 않았습니다. 그 빛은 도시의 모든 사람에게 닿았습니다. 당신에게도요.
    빛 속에서 당신은 무언가를 보았습니다. 아주 오래 붙잡고 있던 것. 당신이 무엇을 위해 사는지에 대한, 흐릿한 대답.
    그리고 사흘의 어둠과 하루의 정적이 이어졌습니다. 그것이 끝났을 때, 로보토미 코퍼레이션은 사라지고 없었습니다.
  choices:
    - text: 빛 속에서 '가족'을 보았다.
      outcome:
        effects: [{ addTag: 신념=가족 }, { addTag: 기록:빛의씨앗 }, { emotion: pos }]
        text: 당신은 지켜야 할 얼굴들을 떠올렸습니다. 그 얼굴들이 당신을 붙잡아 줄 거라고, 그때는 믿었습니다.
    - text: 빛 속에서 '나 자신'을 보았다.
      outcome:
        effects: [{ addTag: 신념=나 }, { addTag: 기록:빛의씨앗 }, { sin: 오만 }]
        text: 아무도 당신을 대신 살아 주지 않습니다. 그러니 당신이 원하는 것을 원하면 됩니다. 이 생각이 나중에 당신을 구할지, 망칠지는 아직 모릅니다.
    - text: 빛 속에서 '정의'를 보았다.
      outcome:
        effects: [{ addTag: 신념=정의 }, { addTag: 기록:빛의씨앗 }, { virtue: { 정의: 2 } }]
        text: 창밖의 뒷골목, 3시 13분, 녹아 사라지던 것들. 당신은 그 모든 것이 '틀렸다'고 처음으로 분명하게 생각했습니다.
    - text: 아무것도 보지 못했다. 눈이 부셨을 뿐이다.
      outcome:
        effects: [{ addTag: 기록:빛의씨앗 }, { virtue: { 자제: 2 } }]
        text: 대부분의 사람이 그랬습니다. 빛이 지나간 뒤에도 도시는 그대로였습니다. 거의요.

- id: teen.pianist
  stage: teen
  date: ['982.04', '983.12']
  once: true
  tone: negative
  title: 피아노 소리
  text: |
    9구 뒷골목에서 무언가가 일어났다는 소문이 돕니다. 음악의 골목이라 불리던, 꽤 안전한 동네였는데.
    한 남자가 피아노가 되었다고 합니다. 사람과 피아노가 뒤섞인 무언가. 그 연주를 들은 사람들이 죽었습니다. 30만 명. 9구 주민의 8할이요.
    사람들은 이 현상을 '뒤틀림'이라고 부르기 시작했습니다. 백야 이후로, 사람이 괴물이 된다고.
  choices:
    - text: 뉴스를 끝까지 본다.
      outcome:
        effects: [{ fear: 3 }, { addTag: 기록:피아니스트_소식 }]
        text: 화면 속 9구는 아무도 치우지 않은 채 방치되어 있습니다. 재건하면 피아니스트를 숭배하는 미치광이들의 성지가 될 거라서, 라고 아나운서가 덤덤하게 말합니다.
    - text: 외면한다.
      outcome:
        effects: [{ fear: 1 }, { virtue: { 자제: 1 } }]
        text: 9구는 멀리 있습니다. 그렇게 생각하기로 했습니다. 도시 사람들 대부분이 그렇게 생각합니다.
