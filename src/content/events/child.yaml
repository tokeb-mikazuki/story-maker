# 유년기 (0~12세). 한 턴 = 2년. 고정 이벤트(fixed)는 그 턴에 먼저 나오고, 이어서 랜덤 하나.

- id: child.infancy
  stage: child
  age: [0, 1]
  once: true
  tone: neutral
  title: 첫 기억
  text: |
    당신의 가장 오래된 기억은 소리입니다.
    벽 너머에서 누군가 크게 다투는 소리. 무엇인가 깨지는 소리. 그리고 그 뒤에 찾아온, 지나치게 긴 정적.
    어린 당신은 그 정적 속에서 무엇을 했던가요?
  choices:
    - text: 더 크게 울었다. 누군가 와 주기를 바라며.
      outcome:
        effects: [{ virtue: { 용기: 2 } }]
        text: 어머니가 달려왔습니다. 울면 누군가 온다는 것. 당신이 도시에서 배운 첫 번째 거짓말이었습니다.
    - text: 숨을 죽이고 귀를 기울였다.
      outcome:
        effects: [{ virtue: { 신중: 2 } }]
        text: 정적은 오래 이어졌습니다. 당신은 소리가 끝난 자리에 남는 것들을 듣는 법을 그때 배웠습니다.
    - text: 손가락을 빨며 다시 잠들었다.
      outcome:
        effects: [{ virtue: { 자제: 2 } }]
        text: 아침이 오자 아무 일도 없었던 것처럼 보였습니다. 도시에서는 대부분의 일이 그렇습니다.
    - text: 벽을 작은 주먹으로 두드렸다.
      outcome:
        effects: [{ virtue: { 정의: 2 } }]
        text: 벽 너머가 조용해졌습니다. 당신 때문이었는지는 아무도 모릅니다. 당신은 그렇다고 믿기로 했습니다.

- id: child.first_night_back
  stage: child
  age: [3, 7]
  once: true
  tone: negative
  group: night
  when: { tag: 출신=뒷골목 }
  title: 3시 13분
  text: |
    그날 밤 당신은 이상하게 잠이 오지 않았습니다.
    벽시계가 3시 13분을 가리키자, 골목의 소리가 바뀌었습니다. 발소리. 아주 많은 발소리. 무언가를 끌고 가는 소리. 그리고 숫자를 세는 것 같은, 사람의 목소리 같지 않은 목소리.
    부모님은 이 시간에 절대 창문을 열지 말라고 했습니다. 이 집은 '거주구역'이라서, 문만 열지 않으면 안전하다고요.
  choices:
    - text: 커튼 틈으로 밖을 내다본다.
      outcome:
        effects: [{ fear: 3 }, { virtue: { 용기: 2 } }, { addTag: 기록:첫밤_목격 }]
        text: |
          보호복을 입은 키 큰 형체들이 파도처럼 골목을 쓸고 지나갑니다. 등에 멘 통에서 붉은 액체가 출렁입니다. 갈고리가 길가에 쓰러져 있던 무언가에 박히자, 그것은 녹아서 통 속으로 빨려 들어갑니다.
          형체 하나가 고개를 들어 당신의 창문을 봅니다. 그리고 아주 정중하게, 고개를 숙였습니다.
          아침이 되자 골목은 그 어느 때보다 깨끗했습니다.
    - text: 이불을 머리끝까지 뒤집어쓴다.
      outcome:
        effects: [{ fear: 1 }, { virtue: { 신중: 1 } }]
        text: 당신은 이불 속에서 숫자 세는 소리를 따라 셌습니다. 1973까지 세었을 때 소리가 멀어졌습니다. 그 숫자는 이상하게 오래 기억에 남았습니다.
    - text: 부모님 방으로 달려간다.
      outcome:
        effects: [{ sp: 3 }, { virtue: { 자제: 1 } }]
        text: 아버지는 깨어 있었습니다. 아무 말 없이 당신을 무릎에 앉히고, 창문 쪽을 등지게 했습니다. "청소부들이야. 우리 집엔 안 와." 아버지의 손은 떨리고 있었습니다.

- id: child.nest_window
  stage: child
  age: [3, 7]
  once: true
  tone: neutral
  group: night
  when: { tag: 출신=둥지 }
  title: 창밖의 쇼
  text: |
    둥지의 아파트는 높고, 거실 창은 넓습니다. 그 창으로 검문소 너머 뒷골목이 한눈에 보입니다.
    늦게 퇴근한 아버지는 캔맥주를 따고 창가에 앉습니다. 새벽 세 시가 넘으면 저 아래에서 '쇼'가 시작된다고 합니다. 쫓고 쫓기는 사람들. 불빛. 그리고 어둠 속에서 밀려오는 무언가.
    "누가 이길까?" 아버지가 당신에게 묻습니다.
  choices:
    - text: 함께 창밖을 구경한다.
      outcome:
        effects: [{ fear: 2 }, { sin: 오만 }, { addTag: 기록:첫밤_목격 }]
        text: 저 아래에서 한 사람이 넘어졌고, 다시 일어나지 못했습니다. 아버지는 "아이고" 하고 맥주를 한 모금 마셨습니다. 당신도 따라서 "아이고" 했습니다. 이상하게, 그게 하나도 슬프지 않았습니다.
    - text: 저 사람들은 왜 집에 안 가냐고 묻는다.
      outcome:
        effects: [{ virtue: { 정의: 2 } }]
        text: |
          아버지는 한참 대답하지 않았습니다. "집이 없으니까." 그리고 덧붙였습니다. "그러니까 너는 공부 열심히 해야 해. 저기로 떨어지지 않으려면."
          그날 이후 당신은 창밖을 볼 때마다 저 아래의 누군가를 셉니다.
    - text: 졸리다며 방으로 들어간다.
      outcome:
        effects: [{ virtue: { 자제: 1 } }]
        text: 방문을 닫아도 창은 남아 있습니다. 둥지의 모든 창이 그렇습니다. 일부러 그렇게 지어졌다고, 당신은 나중에 알게 됩니다.

- id: child.cat_fixer
  stage: child
  age: [5, 11]
  once: true
  tone: positive
  title: 고양이를 찾는 사람
  text: |
    골목 어귀에서 낡은 정장 차림의 젊은 사람이 쓰레기통을 뒤지고 있습니다. 허리에는 싸구려 칼이 매달려 있습니다.
    "꼬마야, 이렇게 생긴 고양이 못 봤니?" 그가 구겨진 사진을 내밉니다. 털이 세 가지 색인 고양이입니다. "밤 되기 전에 찾아야 하거든. 의뢰비가 걸려 있어서."
    해결사라고 합니다. 9급이요.
  choices:
    - text: 같이 찾아 주겠다고 한다.
      check: { ability: 은신, difficulty: 0 }
      success:
        effects: [{ addTag: 동경=해결사 }, { virtue: { 정의: 2 } }, { sp: 5 }]
        text: |
          고양이는 하수구 철망 아래에 웅크리고 있었습니다. 당신이 먼저 찾았습니다.
          해결사는 웃으며 의뢰비에서 동전 하나를 떼어 당신 손에 쥐여 주었습니다. "너, 소질 있다. 크면 면허 따러 와. 하나 협회로." 동전에는 마름모 안에 숫자 1이 새겨져 있었습니다.
      failure:
        effects: [{ addTag: 동경=해결사 }, { virtue: { 용기: 1 } }]
        text: 해가 질 때까지 찾지 못했습니다. 해결사는 한숨을 쉬고는 "밤엔 나도 무서워"라며 서둘러 사라졌습니다. 다음 날 아침, 고양이는 자기 발로 집에 돌아왔다고 합니다. 해결사가 의뢰비를 받았는지는 모르겠습니다.
    - text: 해결사가 뭐냐고 묻는다.
      outcome:
        effects: [{ ability: { 학식: 1 } }]
        text: |
          "돈 받고 뭐든 해 주는 사람. 고양이 찾기부터… 음, 나쁜 놈 잡기까지." 그는 잠시 망설였습니다. "등급이 있어. 9급부터 1급까지. 1급 중에서도 특별한 사람은 '색'을 받지. 붉은안개라든가."
          그 이름을 말할 때 그의 눈이 반짝였습니다.
    - text: 모른 척 지나간다.
      outcome:
        effects: [{ virtue: { 신중: 1 } }]
        text: 모르는 어른에게 말 걸지 말 것. 뒷골목 아이들이 가장 먼저 배우는 규칙입니다.

- id: child.school
  stage: child
  age: [6, 9]
  once: true
  tone: neutral
  title: 배움
  text: |
    학교에 갈 나이가 되었습니다.
    둥지의 아이들은 교복을 입고 학교에 갑니다. 뒷골목의 아이들은 등하굣길이 위험해서, 기숙사 학교에 들어가거나 집에서 가상 교실에 접속하는 온라인 학교를 다닙니다. 둘 다 할 수 없는 아이들은 그냥 일을 합니다.
    어떤 학교든, 이 도시의 학교는 수학과 함께 칼 쥐는 법도 가르칩니다.
  choices:
    - text: 둥지의 학교에 다닌다.
      requires: { tag: 출신=둥지 }
      outcome:
        effects: [{ ability: { 학식: 1 } }, { addTag: 학교=둥지 }]
        text: 당신의 학교는 입시가 전부입니다. 둥지 대학에 가야 날개에 들어갈 수 있고, 날개에 들어가야 둥지에 남을 수 있으니까요. 선생님은 매일 아침 창밖의 뒷골목을 가리키며 말합니다. "저기 가기 싫으면 공부해."
    - text: 온라인 학교에 접속한다.
      requires: { tag: 출신=뒷골목 }
      outcome:
        effects: [{ ability: { 학식: 1 } }, { addTag: 학교=온라인 }]
        text: 낡은 단말기 너머의 교실은 늘 끊깁니다. 그래도 화면 속에서는 아무도 칼을 맞지 않습니다. 당신은 가상 교실의 창가 자리를 좋아했습니다. 창밖 풍경이 둥지처럼 그려져 있었거든요.
    - text: 학교 대신 집안일을 돕는다.
      outcome:
        effects: [{ ability: { 생존: 1 } }, { money: 30000 }, { addTag: 학교=없음 }]
        text: 당신은 일찍 돈 세는 법을 배웠습니다. 하루에 얼마가 들어오고, 얼마가 나가는지. 그리고 그 차이가 얼마나 작은지.

- id: child.errand_gang
  stage: child
  age: [8, 12]
  once: true
  tone: negative
  when: { tag: 출신=뒷골목 }
  title: 심부름
  text: |
    골목 끝 당구장에 모이는 형들이 당신을 불렀습니다. 팔뚝에 문신이 있는 형들입니다.
    "꼬마, 이거 저기 세탁소에 좀 갖다 줘. 열어 보지 말고." 종이로 싼 작은 꾸러미. 심부름 값으로 지폐 한 장을 흔들어 보입니다.
  choices:
    - text: 꾸러미를 받아 든다.
      check: { ability: 생존, difficulty: 1 }
      success:
        effects: [{ money: 50000 }, { addTag: 인맥=동네조직 }, { sin: 탐식 }]
        text: 세탁소 주인은 아무 말 없이 꾸러미를 받고 문을 닫았습니다. 형들은 약속대로 돈을 주었고, 그 뒤로 당신을 "우리 꼬마"라고 불렀습니다. 골목에서 그 호칭은 생각보다 많은 것을 막아 줍니다.
      failure:
        effects: [{ hp: -3 }, { fear: 2 }, { addTag: 인맥=동네조직 }]
        text: 세탁소 앞에서 다른 조직 놈들이 당신을 낚아챘습니다. 꾸러미는 빼앗겼고, 당신은 얻어맞았습니다. 형들은 당신을 탓하지 않았습니다. 대신 그날 밤 3시 13분 이후로, 그 놈들은 골목에서 보이지 않았습니다.
    - text: 거절한다.
      outcome:
        effects: [{ virtue: { 정의: 2 } }]
        text: 형들은 어깨를 으쓱했습니다. "그래, 너 같은 애도 하나쯤은 있어야지." 그 말이 칭찬이었는지는 모르겠습니다.
    - text: 꾸러미를 몰래 열어 본다.
      check: { ability: 은신, difficulty: 1 }
      success:
        effects: [{ virtue: { 신중: 2 } }, { addTag: 기록:꾸러미를_열어봄 }]
        text: 안에는 사람의 손가락 하나가 들어 있었습니다. 깨끗하게 잘린, 반지를 낀 약지. 당신은 다시 싸서 세탁소에 갖다 주었고, 이 일을 평생 아무에게도 말하지 않았습니다.
      failure:
        effects: [{ hp: -2 }, { sp: -8 }]
        text: 뒤에서 누가 당신의 손목을 잡았습니다. "열어 보지 말랬지." 형 중 하나였습니다. 그는 당신 손등을 담뱃불로 지졌습니다. 흉터는 오래갔습니다.

- id: child.t_factory
  stage: child
  age: [10, 12]
  once: true
  tone: negative
  when: { tag: 출신구=20구 }
  title: 공장의 아이
  text: |
    T사 둥지의 아이들은 나이가 차면 공장으로 갑니다. 당신 차례가 왔습니다.
    회중시계를 하나 받았습니다. 이게 이제 당신의 신분증이고 지갑입니다. 시곗바늘은 다른 사람들 것보다 느리게 돌아갑니다. 법이 보장하는 최소한의 하루는 네 시간. 여덟 시간을 자고 나면 이틀이 지나 있습니다.
  choices:
    - text: 시키는 대로 일한다.
      outcome:
        effects: [{ virtue: { 자제: 2 } }, { ability: { 기술: 1 } }, { sp: -5 }]
        text: 당신은 톱니바퀴를 닦습니다. 빠르게 움직이는 감독관의 말은 녹음기로 늦춰 들어야 알아들을 수 있습니다. "게으르군." 그가 그렇게 말했다는 걸, 당신은 사흘 뒤에 알았습니다.
    - text: 쉬는 시간에 몰래 무언가를 만든다.
      check: { ability: 기술, difficulty: 1 }
      success:
        effects: [{ ability: { 기술: 1 } }, { virtue: { 정의: 1 } }, { addTag: 기록:몰래_발명 }]
        text: 버려진 부품으로 작은 태엽 새를 만들었습니다. 무허가 발명은 T사의 금기라서, 당신은 그 새를 아무에게도 보여 주지 않았습니다. 새는 당신의 시간보다 빠르게 날갯짓했습니다.
      failure:
        effects: [{ hp: -2 }, { sp: -6 }]
        text: 징수직 직원에게 들켰습니다. 높은 실크햇을 쓴 그는 당신이 만들던 것을 밟아 부수고, 당신의 시계에서 하루치 시간을 뽑아 갔습니다.

- id: child.reshuffle
  stage: child
  age: [2, 12]
  cooldown: 2
  tone: negative
  when: { tag: 출신구=8구 }
  title: 재적일
  text: |
    종이 울립니다. 홍원 전체가 몸을 떨기 시작합니다.
    "모든 것은 하루아침에 이뤄지는 조립…" 노래가 흘러나오고, 건물들이 레일을 타고 미끄러집니다. 이번 달 부모님의 노동은 얼마로 평가되었을까요. 방이 넓어질까요, 좁아질까요, 아니면.
  choices:
    - text: 부모님 손을 꽉 잡는다.
      check: { virtue: 자제, difficulty: 1 }
      success:
        effects: [{ sp: 4 }]
        text: 방은 조금 좁아졌지만 바닥은 남았습니다. 옆집이 있던 자리는 허공이 되었습니다. 노래는 이렇게 끝납니다. "부디 모든 걸 너무 꽉 움켜쥐고 있지 마시게."
      failure:
        effects: [{ hp: -2 }, { fear: 3 }]
        text: 방 한쪽 벽이 통째로 밀려 나갔습니다. 당신은 굴러떨어질 뻔했고, 아버지가 당신의 옷깃을 붙잡았습니다. 아래층 어딘가에서 비명이 들렸다가 멎었습니다.
    - text: 다른 방으로 몰래 숨어든다.
      check: { ability: 은신, difficulty: 2 }
      success:
        effects: [{ ability: { 은신: 1 } }, { sin: 탐식 }]
        text: 재배치가 끝났을 때 당신은 원래보다 넓은 방의 구석에 있었습니다. 주인 없는 방이었습니다. 한동안은요.
      failure:
        effects: [{ hp: -3 }, { fear: 2 }]
        text: 숨어든 방이 그대로 밀려 사라졌습니다. 당신은 간신히 기어 나왔습니다. 계산은 정교합니다. 홍원은 자격 없는 사람에게 방을 주지 않습니다.

- id: child.smoke_war_back
  kind: story
  fixed: true
  stage: child
  date: ['971.06', '973.12']
  when: { tag: 출신=뒷골목 }
  tone: negative
  title: 연기
  text: |
    12구 쪽 하늘에 연기가 낍니다. 사람 냄새가 나는 연기라고들 합니다.
    날개들끼리 전쟁이 났다고 합니다. 에너지 회사 L사와, 그걸 무너뜨리려는 쪽. 어느 날 아버지가 반들반들한 서류를 들고 들어왔습니다. 해결사로 전쟁에 참여하면, 끝나고 나서 둥지에 살 수 있는 '이주권'을 준다고 합니다. I사와 K사가요.
    "이번 한 번만 다녀오면 너희는 저 위에서 살 수 있어."
  choices:
    - text: 가지 말라고 매달린다.
      check: { ability: 화술, difficulty: 2 }
      success:
        effects: [{ sp: 5 }, { virtue: { 정의: 1 } }, { addTag: 기록:부모_연기전쟁_불참 }]
        text: 아버지는 서류를 오래 바라보다가, 결국 서랍에 넣었습니다. 몇 년 뒤 당신은 알게 됩니다. 전쟁이 끝난 뒤 I사와 K사는 '날개 전쟁 참전자는 우리 둥지에 이주할 수 없다'는 규정을 만들었다는 것을.
      failure:
        effects: [{ fear: 3 }, { addTag: 기록:부모_연기전쟁_전사 }, { addTag: 신념=가족 }]
        text: 아버지는 떠났고, 돌아오지 않았습니다. 이주권도 오지 않았습니다. 전쟁이 끝난 뒤 I사와 K사는 '날개 전쟁 참전자는 우리 둥지에 이주할 수 없다'는 규정을 만들었습니다. 죽은 사람에게는 상관없는 규정이었지만요.
    - text: 잘 다녀오라고 말한다.
      outcome:
        effects: [{ virtue: { 용기: 2 } }, { addTag: 기록:부모_연기전쟁_귀환 }, { sp: -8 }]
        text: |
          아버지는 반년 뒤에 돌아왔습니다. 무엇을 보았는지는 기억하지 못했습니다. 회사가 기억을 지워 주었다고 합니다. 하지만 그는 밤마다 토하며 깨어났습니다. 기억은 지워도 감정은 남는다고, 의사가 말했습니다.
          이주권은 오지 않았습니다. 전쟁 참전자는 받지 않는다는 규정이 생겼으니까요.

- id: child.smoke_war_nest
  kind: story
  fixed: true
  stage: child
  date: ['971.06', '973.12']
  when: { tag: 출신=둥지 }
  tone: neutral
  title: 뉴스
  text: |
    저녁 뉴스는 매일 같은 이야기를 합니다. 날개 전쟁. 12구의 L사가 무너지고 있다고. 화면 속 하늘은 연기로 뿌옇습니다.
    "우리랑은 상관없어." 어머니가 채널을 돌립니다. 다음 채널에서는 보살 치킨 광고가 나옵니다. 다리가 여섯 개 달린 닭이 웃고 있습니다.
  choices:
    - text: 뉴스를 계속 보여 달라고 한다.
      outcome:
        effects: [{ ability: { 학식: 1 } }, { fear: 1 }, { addTag: 기록:연기전쟁_뉴스 }]
        text: 전쟁이 끝나자 '연기 규제'라는 법이 생겼다고 합니다. L사의 자리는 처음 듣는 이름의 회사가 차지했습니다. 로보토미 코퍼레이션. "공포에 직면하여 미래를 창조하라." 광고 문구가 멋있다고 당신은 생각했습니다.
    - text: 치킨이 먹고 싶다고 조른다.
      outcome:
        effects: [{ sp: 6 }, { sin: 탐식 }]
        text: 그날 저녁은 보살 치킨이었습니다. 다리 여섯 개를 두고 형제들과 싸울 필요가 없었습니다. 둥지에서는 그런 것이 행복입니다.

- id: child.index_note
  stage: child
  age: [6, 12]
  once: true
  tone: negative
  when: { tag: 보호=검지 }
  title: 첫 번째 쪽지
  text: |
    현관문 틈에 쪽지가 꽂혀 있습니다. 하얀 종이에 푸른 인장. 이번에는 어머니가 아니라 당신 이름이 적혀 있습니다.
    「옆집 아이의 신발 한 짝을 지붕 위에 올려 두어라.」
    어머니가 얼굴이 하얘진 채 말합니다. "하라는 대로 하렴. 그러면 저 사람들이 우리를 지켜 줘."
  choices:
    - text: 쪽지대로 한다.
      outcome:
        effects: [{ virtue: { 자제: 1 } }, { sin: 질투 }, { addTag: 기록:지령수행 }]
        text: 옆집 아이는 한쪽 신발로 하루 종일 울며 다녔습니다. 다음 날, 그 집 현관에도 쪽지가 꽂혔습니다. 무슨 내용이었는지는 모릅니다. 그 집은 그 주에 이사를 갔습니다.
    - text: 쪽지를 찢어 버린다.
      check: { virtue: 정의, difficulty: 2 }
      success:
        effects: [{ virtue: { 정의: 2 } }, { addTag: 기록:지령거부 }]
        text: 아무 일도 일어나지 않았습니다. 그게 더 무서웠습니다. 어머니는 한 달 내내 밤에 문을 세 번씩 확인했습니다. 지령은 수행하지 않아도 벌이 오지 않을 때가 있고, 수행해도 벌이 올 때가 있다고 합니다.
      failure:
        effects: [{ hp: -4 }, { fear: 4 }, { addTag: 기록:지령거부 }]
        text: 사흘 뒤 하얀 망토를 두른 사람이 찾아왔습니다. 그는 아주 정중하게, 당신의 왼손 새끼손가락을 부러뜨렸습니다. "지령은 아이에게도 평등합니다." 그리고 떠났습니다.

- id: child.street_game
  stage: child
  age: [4, 12]
  cooldown: 2
  weight: 8
  tone: positive
  group: play
  title: 골목 놀이
  text: |
    오늘은 해가 길고, 아이들이 모였습니다. 누군가 나무 막대기를 칼처럼 들고 외칩니다. "난 붉은안개다!"
  choices:
    - text: 칼싸움에 끼어든다.
      check: { virtue: 용기, difficulty: 1 }
      success:
        effects: [{ ability: { 전투: 1 } }, { sp: 3 }]
        text: 당신이 이겼습니다. 아이들이 당신을 '특색'이라고 불러 주었습니다. 오늘만큼은요.
      failure:
        effects: [{ hp: -1 }, { sp: 2 }]
        text: 막대기에 이마를 맞았습니다. 아팠지만 웃었습니다. 도시에서 이렇게 아프고도 웃을 수 있는 날은 많지 않습니다.
    - text: 숨바꼭질을 하자고 한다.
      outcome:
        effects: [{ ability: { 은신: 1 } }, { sp: 3 }]
        text: 아무도 당신을 찾지 못했습니다. 해가 질 무렵 당신이 스스로 나왔을 때, 아이들은 이미 집에 가고 없었습니다. 잘 숨는 것과 혼자가 되는 것은 생각보다 가깝습니다.
    - text: 구석에서 땅바닥에 그림을 그린다.
      outcome:
        effects: [{ ability: { 예술: 1 } }, { sp: 2 }]
        text: 당신은 분필로 커다란 새를 그렸습니다. 날개가 둥지를 감싸 안고 있는 그림이었습니다. 다음 날 비가 와서 지워졌습니다.

- id: child.hungry_winter
  stage: child
  age: [4, 12]
  cooldown: 3
  weight: 6
  tone: negative
  when: { tag: 출신=뒷골목 }
  title: 배고픈 계절
  text: |
    이번 달은 가게 장사가 안 됐습니다. 식탁에 오르는 것이 점점 줄어듭니다. 부모님은 배가 부르다며 숟가락을 일찍 내려놓습니다.
  choices:
    - text: 내 몫을 동생에게, 혹은 부모님에게 덜어 준다.
      outcome:
        effects: [{ hp: -1 }, { virtue: { 정의: 1 } }, { emotion: pos }]
        text: 배는 고팠지만 잠은 잘 왔습니다. 그런 밤도 있습니다.
    - text: 시장에서 먹을 것을 슬쩍한다.
      check: { ability: 은신, difficulty: 1 }
      success:
        effects: [{ ability: { 생존: 1 } }, { sin: 탐식 }]
        text: 빵 두 개. 아무도 몰랐습니다. 혹은 알고도 모른 척해 주었는지도 모릅니다.
      failure:
        effects: [{ hp: -2 }, { sp: -5 }]
        text: 가게 주인에게 붙잡혀 실컷 맞았습니다. 그래도 빵 하나는 끝까지 놓지 않았습니다.
