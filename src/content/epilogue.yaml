# 인생 결산: 조건이 맞는 단락만, order 순서대로 조립된다(서울 2033 '정착 엔딩' 방식).
# 단락 안의 각 줄도 개별 조건을 가질 수 있다.

- id: origin
  order: 10
  lines:
    - when: { tag: 출신=둥지 }
      text: 당신은 {구} 둥지에서 태어났습니다. 창밖의 뒷골목을 내려다보며 자랐습니다.
    - when: { tag: 출신=뒷골목 }
      text: 당신은 {구} 뒷골목에서 태어났습니다. 3시 13분이 무엇인지 말보다 먼저 배웠습니다.
    - when: { tag: 기록:부모_연기전쟁_전사 }
      text: 아버지는 연기 전쟁에서 돌아오지 않았고, 약속된 이주권도 오지 않았습니다.
    - when: { tag: 기록:부모_연기전쟁_귀환 }
      text: 연기 전쟁에서 돌아온 아버지는 끝내 무엇을 보았는지 기억하지 못했습니다. 밤마다 토하며 깨던 그 소리를, 당신은 대신 기억합니다.

- id: white_nights
  order: 20
  when: { tag: 기록:빛의씨앗 }
  lines:
    - when: { tag: 신념=가족 }
      text: 백야의 빛 속에서 당신은 가족을 보았습니다.
    - when: { tag: 신념=나 }
      text: 백야의 빛 속에서 당신은 당신 자신을 보았습니다.
    - when: { tag: 신념=정의 }
      text: 백야의 빛 속에서 당신은 이 도시가 틀렸다는 것을 보았습니다.
    - when: { not: { tag: 신념 } }
      text: 백야의 빛 속에서 당신은 아무것도 보지 못했습니다. 대부분의 사람처럼요.
    - when: { tag: 신체:EGO }
      text: 그리고 무너지던 날, 그 빛은 당신의 손에 E.G.O로 돌아왔습니다.

- id: career_feather
  order: 30
  when: { any: [{ tag: 직업=깃털 }] }
  lines:
    - text: 당신은 날개의 깃털로 살았습니다.
    - when: { tagNum: { key: 직원등급, gte: 3 } }
      text: '{거주}에서, 3등급 이상까지 올라간 깃털은 많지 않습니다. 당신은 알아도 되는 비밀과 알고 싶지 않은 비밀을 모두 품고 살았습니다.'
    - when: { tag: 기록:계약서_독해 }
      text: 계약서의 마지막 장을 끝까지 읽은 몇 안 되는 직원이었습니다. 읽었다고 달라진 건 없었지만요.

- id: career_fixer
  order: 30
  when: { tag: 직업=해결사 }
  lines:
    - when: { tagNum: { key: 해결사등급, gte: 7 } }
      text: 당신은 저등급 해결사로 남았습니다. 고양이를 찾고, 전단을 돌리고, 밤이 오기 전에 집에 가려 애쓰는 해결사였습니다.
    - when: { tagNum: { key: 해결사등급, gte: 4, lte: 6 } }
      text: 당신은 쓸 만한 해결사였습니다. 둥지에서도 이름을 아는 사람이 몇은 있었습니다.
    - when: { tagNum: { key: 해결사등급, gte: 1, lte: 3 } }
      text: 당신은 강자였습니다. 뒷골목의 밤에 누군가를 지켜 줄 수 있는 몇 안 되는 사람 중 하나였습니다.
    - when: { tag: 동경=해결사 }
      text: 어릴 적 골목에서 고양이를 찾던 그 해결사처럼. 그가 쥐여 준 동전은 끝까지 당신 주머니에 있었습니다.
    - when: { tag: 기록:라만차_생존 }
      text: 라만차랜드에서 살아 돌아온 해결사라는 이야기는, 술집에서 몇 번이고 다시 불렸습니다.

- id: career_gang
  order: 30
  when: { tag: 직업=조직원 }
  lines:
    - text: 당신은 조직에서 살았습니다.
    - when: { tagNum: { key: 조직서열, gte: 3 } }
      text: 끝내는 금색 휘장을 단 사람들과 같은 테이블에 앉게 되었습니다.
    - when: { sinTop: 분노 }
      text: 당신이 받아 낸 돈만큼, 당신을 원망하는 사람도 늘었습니다.

- id: career_workshop
  order: 30
  when: { any: [{ tag: 직업=공방견습 }, { tag: 직업=공방장인 }] }
  lines:
    - when: { tag: 직업=공방장인 }
      text: 당신은 장인이 되었습니다. 당신이 만든 무기를 든 사람들이, 당신이 모르는 골목에서 살아남았습니다.
    - when: { tag: 직업=공방견습 }
      text: 당신은 끝내 장인 시험에 붙지 못했습니다. 그래도 공방의 망치 소리는 당신 손에서 났습니다.

- id: career_civilian
  order: 30
  when: { tag: 직업=소시민 }
  lines:
    - text: 당신은 평범하게 살았습니다. 이 도시에서 평범하게 산다는 것이 얼마나 어려운지, 아는 사람은 압니다.

- id: night
  order: 40
  lines:
    - when: { tag: 기록:밤을_버팀 }
      text: 당신은 뒷골목의 밤을 거리에서 끝까지 버텨 낸 적이 있습니다. 그 아침의 햇빛을 평생 잊지 못했습니다.
    - when: { tag: 기록:뒤틀림_해소 }
      text: 당신은 뒤틀리던 사람을 말로 붙잡아 돌려놓은 적이 있습니다. 그 가게의 국물 맛을, 당신은 오래 기억했습니다.
    - when: { tag: 기록:지령거부 }
      text: 당신은 검지의 지령을 거부한 적이 있습니다. 그 대가가 무엇이었든.
    - when: { tag: 상태:중지장부 }
      text: 중지의 장부에는 아직도 당신의 이름이 지워지지 않은 채 남아 있습니다. 중지는 잊지 않습니다.

- id: friend
  order: 50
  when: { tag: 인맥=어린친구 }
  lines:
    - when: { tag: 기록:친구와_술 }
      text: 특색이 되겠다던 옛 친구와는 3시 13분 전까지 함께 마신 밤이 있었습니다. 그 친구가 정말 색을 받았는지는, 결산서에 적히지 않습니다.
    - when: { not: { tag: 기록:친구와_술 } }
      text: 특색이 되겠다던 옛 친구가 어떻게 되었는지, 당신은 끝내 묻지 못했습니다.

- id: cameo
  order: 60
  when: { tag: 기록:버스_목격 }
  lines:
    - text: 984년 어느 날, 당신은 시계 머리를 한 사람이 탄 시끄러운 버스를 본 적이 있습니다. 그 버스가 도시에서 무슨 일을 하고 다녔는지, 당신은 소문으로만 들었습니다.

- id: funeral
  order: 90
  lines:
    - when: { all: [{ tag: 거주=둥지 }, { money: { gte: 5000000 } }] }
      text: 장례식이 열렸습니다. 둥지에서도 장례식을 치를 수 있는 집은 많지 않습니다.
    - when: { not: { tag: 거주=둥지 } }
      text: 장례식은 없었습니다. 뒷골목의 관례대로, 그날 밤 청소부들이 당신을 정중하게 데려갔습니다.
    - when: { all: [{ tag: 거주=둥지 }, { money: { lte: 4999999 } }] }
      text: 장례식을 치를 돈은 없었습니다. 회사는 조화 하나를 보냈습니다.
