"…기사에 쓰려던 건데, 어느새 개인 소장용이 되어 버렸네요. 가져가요. 저한텐 이제 복사본이 있으니까."`,choices:[{text:`사진을 소중히 받는다`,outcome:{text:`봉투를 조심스럽게 가방에 넣었습니다. 서현이 눈을 피하며 카메라 렌즈를 닦았습니다. "…취재가 아니었다는 건, 비밀이에요."`,do:[U(`서현호감`,3),G(`마음전하기`,{양:1})]}},{text:`"나도 서현 사진 한 장 찍어도 돼요?" 하고 묻는다`,outcome:{text:`서현이 놀란 얼굴로 한참 말이 없었습니다. "…기자는 찍는 쪽인데." 하지만 카메라를 내려놓고 포즈를 잡았습니다. 어색한 미소가 한 장에 담겼습니다.`,do:[U(`서현호감`,3),U(`센스`,1),G(`마음전하기`,{양:1})]}}]},{id:`seohyeon_deadline`,title:`마감 지옥`,pool:`인연`,once:!0,group:`seohyeon`,when:`서현호감 >= 5`,text:`신문부실 불이 새벽까지 꺼지지 않았습니다. 마감 하루 전. 서현이 책상에 엎어져 헤드라인을 쓰다 말고 잠들어 있었습니다. 주변에는 교정 종이가 눈처럼 쌓여 있습니다.
인쇄소에 넘길 기사는 반도 쓰이지 않았습니다.`,record:{text:`신문부 마감을 도왔다`,importance:3},choices:[{text:`조용히 기사 교정을 돕는다`,check:{skill:`성실`,difficulty:3},success:{text:`아침 해가 뜰 때까지 교정을 마쳤습니다. 서현이 눈을 뜨고 완성된 원고를 보더니 울먹였습니다. "…이거 누가 한 거예요?" "…저요." "…고마워요, 진짜."`,do:[U(`서현호감`,3),U(`성실`,1),U(`기운`,-2),G(`마음전하기`,{양:1})]},failure:{text:`교정 중에 잉크를 쏟았습니다. 원고가 얼룩졌고 서현이 눈을 뜨자마자 비명을 질렀습니다. 그래도 서현은 웃으며 같이 다시 썼습니다.`,do:[U(`서현호감`,2),U(`기운`,-2)]}},{text:`서현이 깰 때까지 곁에서 담요를 덮어 준다`,outcome:{text:`서현이 눈을 뜨자 어깨에 담요가 덮여 있었습니다. 한참 동안 서현이 말없이 담요 끝을 만졌습니다. "…이건 기사에 안 쓸게요. 절대로."`,do:[U(`서현호감`,3),U(`다정`,1),G(`마음전하기`,{양:1})]}}]},{id:`seohyeon_secret`,title:`서현의 수첩`,pool:`인연`,once:!0,group:`seohyeon`,when:`서현호감 >= 6`,text:`서현이 수첩을 뒤적이다 문득 멈췄습니다. 그리고 수첩을 접어 가슴께로 끌어안았습니다.
"…이 수첩, 사실 기사용이 아니에요." 서현이 고개를 숙인 채 말했습니다. "취재를 핑계로 쓰는 개인 일기예요. 거기에… 당신 이름이 자주 나와요. 읽으면 안 돼요."`,choices:[{text:`"안 읽을게요. 약속"`,outcome:{text:`서현이 고개를 들고 아주 작게 웃었습니다. "…고마워요." 수첩을 소중히 가방에 넣었습니다. 이 약속은 영원히 지켜질 것입니다.`,do:[U(`서현호감`,3),U(`진심`,1),G(`마음전하기`,{양:2})]}},{text:`"그럼 내가 쓴 일기도 보여 줄까요?"`,outcome:{text:`서현의 눈이 둥그레졌다가 곧 웃음이 터졌습니다. "…그건 진짜 특종인데요?" 하지만 둘 다 어느새 귀까지 붉어져 있었습니다.`,do:[U(`서현호감`,3),U(`센스`,1),G(`마음전하기`,{양:1})]}}]},{id:`jihoon_ramen`,title:`지훈의 컵라면 철학`,pool:`인연`,once:!0,group:`jihoon`,when:`지훈우정 >= 2`,text:`야자 시간, 편의점 앞 벤치. 지훈이 컵라면 뚜껑을 닫고 3분을 기다리며 철학을 시작했습니다.
"야, 연애라는 게 컵라면 같다고 생각 안 해? 기다려야 맛있는데 기다릴 때가 제일 불안해."
의외로 와닿는 말입니다. 지훈은 이미 다 먹고 국물까지 마시는 중이었습니다.`,choices:[{text:`"너 연애해 봤냐?" 하고 묻는다`,outcome:{text:`"…나? 이론 전문이야." 지훈이 아무렇지 않게 대답했지만 귓불이 빨갰습니다. 이 녀석에게도 사연이 있을 것 같습니다.`,do:[U(`지훈우정`,2),U(`센스`,1)]}},{text:`"너한테 배울 게 있네"라고 인정한다`,outcome:{text:`지훈이 어깨를 으쓱하며 컵라면 하나를 더 내밀었습니다. "인정하는 놈한테는 사 준다." 뜨거운 국물이 의외로 따뜻했습니다.`,do:[U(`지훈우정`,2),U(`기운`,2),U(`용돈`,-2)]}}]},{id:`jihoon_secret`,title:`지훈의 비밀 노트`,pool:`인연`,once:!0,group:`jihoon`,when:`지훈우정 >= 4`,text:`지훈이 가방에서 수첩 하나를 꺼냈습니다. 표지에는 「연애 상담 사례집」이라 적혀 있었습니다. 펼치자 당신의 이름이 붙은 페이지가 열두 개나 있었습니다.
"…야, 이건 비밀인데. 나 사실 네 연애가 제일 궁금했어. 혼자 즐기는 거 아니야. 응원하는 거야."`,choices:[{text:`수첩을 보고 크게 웃는다`,outcome:{text:`지훈과 같이 웃다가 눈물이 나왔습니다. 이 녀석은 정말 오래갈 친구입니다. 수첩 맨 뒷장에는 이렇게 적혀 있었습니다. 「가장 좋은 상담자는 언제나 당신 곁에.」`,do:[U(`지훈우정`,2),U(`자신감`,2)]}},{text:`"…너 정말 좋은 놈이다" 라고 말해 버린다`,outcome:{text:`지훈이 순간 얼어붙었다가 고개를 돌렸습니다. "…아, 아니, 갑자기 뭐냐 그런 소리를." 귀가 새빨갰습니다. 컵라면 두 개는 당신이 샀습니다.`,do:[U(`지훈우정`,3),G(`마음전하기`,{양:1}),U(`용돈`,-2)]}}]},{id:`maru_kitten`,title:`마루가 데려온 손님`,pool:`인연`,once:!0,group:`maru`,when:`마루 >= 3`,text:`아침에 교문을 지나는데 마루가 화단 쪽에서 야옹하고 울었습니다. 따라가 보니 담벼락 아래 상자 안에 새끼 고양이가 세 마리 웅크리고 있었습니다. 마루가 당신을 올려다보았습니다. 눈빛이 분명 부탁하고 있었습니다.
"…마루, 너 엄마였어?"`,record:{text:`마루의 새끼 고양이를 발견했다`,importance:4},choices:[{text:`서윤과 학생회에 도움을 청한다`,requires:`서윤호감 >= 2`,hidden:!0,outcome:{text:`서윤이 상자를 보고 한참 말이 없더니 낮게 말했습니다. "…학생회 예산으로 처리 가능한 범위입니다." 그리고 쪼그려 앉아 새끼 고양이를 쓰다듬었습니다. 얼굴이 풀려 있었습니다.`,do:[U(`서윤호감`,3),U(`마루`,2),W(`서윤의비밀`),Lc(`고양이간식`,2)]}},{text:`직접 학교 근처 보호소를 알아본다`,check:{skill:`성실`,difficulty:3},success:{text:`하루 종일 전화를 돌린 끝에 입양처를 찾았습니다. 마루는 새끼들이 떠나는 날 이상하게 조용히 당신 곁에 앉아 있었습니다.`,do:[U(`마루`,2),U(`성실`,1),U(`자신감`,2)]},failure:{text:`보호소 자리가 없어 결국 학교 한쪽에 임시 집을 만들어 주었습니다. 모두가 돌아가며 밥을 챙기게 되었습니다. 의외로 학교 분위기가 따뜻해졌습니다.`,do:[U(`마루`,1),U(`지훈우정`,1),U(`기운`,-1)]}},{text:`지훈에게 맡기고 일단 안정시킨다`,outcome:{text:`"야 이게 무슨 일이냐." 지훈이 놀라면서도 상자를 받아 안았습니다. 지훈의 의외의 다정함을 처음 본 날이었습니다.`,do:[U(`지훈우정`,2),U(`마루`,1)]}}]}],gl=[{id:`lunch_war`,title:`급식실 전쟁`,pool:`일상`,once:!0,group:`food`,text:`4교시 종이 울리자마자 교실 문이 폭발하듯 열렸습니다. 오늘 급식은 돈가스. 2학년 3반은 매주 돈가스 날마다 하위권입니다. 앞줄 지훈이 신발끈을 조이며 말했습니다. "오늘은 승리한다."`,choices:[{text:`지훈과 함께 전력 질주한다`,check:{skill:`배짱`,difficulty:2},success:{text:`복도에서 서윤의 "뛰지 마세요!" 소리가 들렸지만 이미 늦었습니다. 맨 앞줄 돈가스를 쟁취했고 지훈이 포효했습니다.`,do:[U(`지훈우정`,1),U(`기운`,2),G(`들킴`,{소문량:0,벌점량:1})]},failure:{text:`복도 모퉁이에서 풍기위원과 정면충돌했습니다. 서윤의 수첩이 하늘을 날았습니다. "…벌점입니다." 돈가스는 마지막 한 조각만 남았습니다.`,do:[U(`서윤호감`,1),G(`들킴`,{소문량:1,벌점량:1}),U(`기운`,-1)]}},{text:`느긋하게 걸어가서 마지막 줄에 선다`,outcome:{text:`남은 건 야채 카레였습니다. 의외로 맛있었고, 옆자리에서 누군가 말없이 단무지를 나눠 주었습니다.`,do:[U(`기운`,1),U(`성실`,1)]}},{text:`도시락을 꺼내 조용히 먹는다`,requires:`item('도시락') > 0`,hidden:!0,outcome:{text:`엄마표 도시락 뚜껑을 열자 계란말이가 반겨 주었습니다. 소란한 급식실 한쪽에서 혼자 평화로웠습니다.`,do:[Lc(`도시락`,-1),U(`기운`,3),U(`자신감`,1)]}}]},{id:`homework_cat`,title:`숙제를 먹은 고양이`,pool:`일상`,once:!0,text:`아침, 교실 창문 너머로 마루가 가만히 앉아 있었습니다. 그런데 입에 물고 있는 건 분명 당신이 어젯밤 밤새워 쓴 숙제 노트입니다. 마루는 의기양양하게 꼬리를 흔들었습니다.
"…야, 그거 숙제야." 지훈이 소리를 낮췄습니다.`,choices:[{text:`고양이간식으로 협상한다`,requires:`item('고양이간식') > 0`,hidden:!0,outcome:{text:`봉지를 흔들자 마루가 노트를 툭 내려놓고 달려왔습니다. 노트는 침 자국이 났지만 읽을 수는 있었습니다. 마루가 손바닥에 머리를 비볐습니다.`,do:[Lc(`고양이간식`,-1),U(`마루`,2),U(`자신감`,1)]}},{text:`달려가서 노트를 뺏는다`,check:{skill:`센스`,difficulty:2},success:{text:`마루가 돌아서는 순간 낚아챘습니다. 서윤이 마침 현장을 목격하고 한 마디 했습니다. "…고양이에게 학습 자료를 노출하는 건 규정 위반입니다." 하지만 입가가 아주 약간 올라가 있었습니다.`,do:[U(`서윤호감`,1),U(`마루`,1)]},failure:{text:`마루가 담장 위로 올라가 노트를 몇 장 찢었습니다. 담임에게 "고양이가 먹었어요"라고 말했지만 믿지 않았습니다.`,do:[U(`성적`,-1),U(`마루`,1)]}},{text:`"고양이가 먹었다"고 담임에게 정직하게 말한다`,outcome:{text:`담임이 한참 쳐다보다가 말했습니다. "…선생님도 어릴 때 개가 숙제를 먹었다고 했는데 믿어 주지 않았어요." 한 번은 봐주기로 했습니다.`,do:[U(`성실`,1),U(`자신감`,1)]}}]},{id:`bus_nap`,title:`종점의 낮잠`,pool:`일상`,once:!0,text:`하교 버스 안, 따뜻한 햇살과 흔들리는 의자. 눈을 감았다 뜨니 창밖 풍경이 낯설었습니다. 종점입니다. 운전기사님이 백미러로 쳐다보았습니다. "학생, 내려요."`,choices:[{text:`택시를 탄다 (용돈 5)`,outcome:{text:`택시 기사님이 교복 이름표를 보고 물었습니다. "청화고? 거기 연애 금지령 있다던데?" 어디서든 소문은 빠릅니다.`,do:[U(`용돈`,-5),U(`기운`,1)]}},{text:`걸어서 돌아온다`,outcome:{text:`한 시간을 걸었습니다. 노을이 길었고 다리가 아팠지만 기분은 이상하게 가벼웠습니다.`,do:[U(`기운`,-1),U(`성실`,1),U(`자신감`,1)]}},{text:`지훈에게 SOS 문자를 보낸다`,outcome:{text:`"야 너 어디냐" "종점" "…진짜냐" 지훈이 자전거로 달려왔습니다. 뒷좌석에 앉아 돌아오는 길에 아무 말 없이 웃었습니다.`,do:[U(`지훈우정`,2)]}}]},{id:`group_chat`,title:`단톡방 오발송`,pool:`일상`,once:!0,text:`밤 11시. 단톡방에 메시지를 쓰다 말고 엄지가 미끄러졌습니다. 보낸 메시지가 화면에 떠 있습니다. 「오늘 그 사람 진짜 귀여웠다ㅋㅋ」 반 전체 단톡방입니다. 읽음 표시가 순식간에 수십 개로 늘어납니다.`,choices:[{text:`삭제를 누른다`,check:{skill:`센스`,difficulty:2},success:{text:`삭제는 늦었지만 지훈이 재빨리 다른 얘기로 화제를 돌렸습니다. 읽은 사람이 많았지만 아무도 묻지 않았습니다.`,do:[U(`지훈우정`,1),U(`소문`,0)]},failure:{text:`"누구요?" 단톡방이 순식간에 폭발했습니다. 새벽 2시까지 추리극이 이어졌습니다.`,do:[G(`들킴`,{소문량:2,벌점량:0}),U(`기운`,-1)]}},{text:`"고양이 얘기였어요"라고 해명한다`,outcome:{text:`"…마루?" "마루였구나." 누군가 마루 사진을 올렸습니다. 어느새 단톡방이 고양이 사진 잔치가 되었습니다.`,do:[U(`마루`,1),U(`소문`,0)]}},{text:`핸드폰을 던지고 잔다`,outcome:{text:`이불을 뒤집어쓰고 눈을 감았습니다. 아침에 일어나서 확인하니 읽씹 천지였고, 아무도 아무 말도 하지 않았습니다. 그게 더 무서웠습니다.`,do:[U(`기운`,1),U(`자신감`,-1),G(`들킴`,{소문량:1,벌점량:0})]}}]},{id:`convenience`,title:`편의점 신상 컵라면`,pool:`일상`,once:!0,group:`food`,text:`하교길 편의점에 새 컵라면이 입고되었습니다. 포장에는 「매운맛 5단계 도전!」이라 적혀 있습니다. 지훈이 이미 한 개를 들고 있습니다. "야, 이거 먹고 쓰러지면 구급차 불러 줘."`,choices:[{text:`5단계에 도전한다`,check:{skill:`배짱`,difficulty:3},success:{text:`눈물과 콧물이 흘렀지만 다 먹었습니다. 편의점 아르바이트 형이 박수를 쳤고 지훈이 사진을 찍었습니다. 이걸로 한 학기 영웅입니다.`,do:[U(`배짱`,1),U(`지훈우정`,1),U(`기운`,-1),U(`용돈`,-2)]},failure:{text:`한 입에 쓰러졌습니다. 우유를 세 통 마셨습니다. 지훈이 말했습니다. "…그래도 용기는 인정."`,do:[U(`기운`,-2),U(`지훈우정`,1),U(`용돈`,-3)]}},{text:`순한 맛으로 안전하게`,outcome:{text:`순한 맛 컵라면을 먹으며 지훈의 도전을 구경했습니다. 구급차를 부를 필요는 없었지만 우유는 사 줬습니다.`,do:[U(`기운`,1),U(`용돈`,-2),U(`지훈우정`,1)]}}]},{id:`pop_quiz`,title:`불시 퀴즈`,pool:`일상`,once:!0,group:`study`,text:`수학 시간, 담임이 칠판에 한 문제를 쓰고 돌아섰습니다. "오늘은 깜짝 퀴즈입니다. 맞춘 사람은 보너스 간식, 틀린 사람은 칠판 청소."
교실이 얼어붙었습니다.`,choices:[{text:`손을 들고 도전한다`,check:{skill:`성실`,difficulty:3,bonus:`성적`},success:{text:`풀이가 한 번에 떠올랐습니다. 담임이 박수를 쳤습니다. 간식으로 초콜릿 한 개를 받았습니다.`,do:[U(`성적`,1),U(`자신감`,1),Lc(`초콜릿`,1)]},failure:{text:`답을 쓰다가 부호를 하나 틀렸습니다. 칠판 청소를 하다가 유나가 웃으며 도와주었습니다.`,do:[U(`자신감`,-1),U(`유나호감`,1)]}},{text:`고개를 숙이고 조용히 있는다`,outcome:{text:`다행히 지목되지 않았습니다. 지목된 지훈이 칠판 앞에서 표정이 굳은 채 서 있는 모습을 지켜보았습니다.`,do:[U(`기운`,1)]}}]},{id:`vending`,title:`자판기의 선물`,pool:`일상`,once:!0,text:`복도 자판기에 동전을 넣고 버튼을 눌렀는데, 덜컹 소리와 함께 캔 두 개가 굴러떨어졌습니다. 에너지 드링크 두 개. 주변에는 아무도 없습니다. 이게 운일까요, 시험일까요?`,choices:[{text:`둘 다 챙긴다`,outcome:{text:`캔 두 개를 가방에 넣었습니다. 뒤에서 서윤의 발소리가 들려서 가슴이 철렁했지만 서윤은 그냥 지나갔습니다.`,do:[Lc(`에너지드링크`,2)]}},{text:`하나를 지나가던 친구에게 준다`,outcome:{text:`마침 지나가던 하준이 캔을 받고 씩 웃었습니다. "야, 너 의외로 쿨하네." 캔을 부딪치며 건배했습니다.`,do:[Lc(`에너지드링크`,1),U(`하준호감`,1),U(`다정`,1)]}},{text:`자판기에 붙은 연락처로 신고한다`,outcome:{text:`관리자가 와서 확인했고 감사의 의미로 쿠폰을 한 장 주었습니다. 의외로 책임감 있는 학생이 되었습니다.`,do:[U(`성실`,1),U(`용돈`,2)]}}]},{id:`dodgeball`,title:`체육 시간, 피구`,pool:`일상`,once:!0,text:`체육 수업은 피구. 상대 팀 에이스가 공을 쥐고 이쪽을 노려보고 있습니다. 같은 팀의 지훈은 이미 아웃되어 바닥에 누워 있습니다. 당신 혼자 남았습니다.`,choices:[{text:`정면으로 공을 받아낸다`,check:{skill:`배짱`,difficulty:3},success:{text:`공이 손바닥에 쿵 박혔고 손이 얼얼했지만 꼭 쥐었습니다. 운동장이 환호로 가득 찼습니다. 멀리서 서현의 카메라가 번쩍였습니다.`,do:[U(`배짱`,1),U(`자신감`,2),U(`소문`,1)]},failure:{text:`공은 얼굴로 날아왔습니다. 눈앞이 하얘졌다가 코끝이 얼얼했습니다. 서윤이 달려와 얼음주머니를 건넸습니다. "…경미한 사고로 판단됩니다."`,do:[U(`기운`,-1),U(`서윤호감`,1),U(`자신감`,-1)]}},{text:`요리조리 피하며 시간을 번다`,outcome:{text:`발이 빨라졌습니다. 공이 쏜살같이 스쳐 갔고 끝내 한 번도 맞지 않았습니다. 종이 울리자 지훈이 일어나 소리쳤습니다. "우리 팀 승리!"`,do:[U(`센스`,1),U(`지훈우정`,1)]}}]},{id:`rooftop_nap`,title:`옥상의 낮잠`,pool:`일상`,once:!0,text:`점심시간 옥상 문이 의외로 열려 있었습니다. 따뜻한 햇살과 바람. 난간 아래 그늘에서 마루가 몸을 말고 자고 있었습니다.`,choices:[{text:`옆에 누워 같이 낮잠을 잔다`,outcome:{text:`눈을 떴을 때 5교시가 시작되고 있었습니다. 마루는 어느새 사라졌고 가슴 위에 따뜻한 발자국만 남아 있었습니다.`,do:[U(`기운`,3),U(`마루`,1),U(`성적`,-1)]}},{text:`마루에게 간식을 준다`,requires:`item('고양이간식') > 0`,hidden:!0,outcome:{text:`간식 봉지가 바스락거리자 마루가 눈을 번쩍 떴습니다. 먹고 나서 무릎 위로 올라왔습니다. 한참을 그대로 앉아 있었습니다.`,do:[Lc(`고양이간식`,-1),U(`마루`,2),U(`자신감`,1)]}},{text:`조용히 돌아선다`,outcome:{text:`고양이의 낮잠을 방해하고 싶지 않았습니다. 발소리를 죽이고 계단을 내려오는 길에 마음이 따뜻했습니다.`,do:[U(`다정`,1)]}}]},{id:`bread_battle`,title:`매점 빵 쟁탈전`,pool:`일상`,once:!0,group:`food`,text:`매점 한정 판매 크림빵. 점심시간 전교생이 몰려드는 금단의 빵입니다. 오늘은 지훈이 미리 줄을 서 놓았다는데 어디에도 보이지 않습니다.`,choices:[{text:`인파를 뚫고 들어간다`,check:{skill:`배짱`,difficulty:3},success:{text:`인파 사이를 헤치고 마지막 크림빵을 낚아챘습니다. 멀리서 하준이 엄지를 치켜들었고, 유나가 손뼉을 쳤습니다.`,do:[U(`기운`,2),U(`자신감`,1),U(`용돈`,-1)]},failure:{text:`떠밀려 구석까지 밀렸습니다. 빈손으로 나오니 지훈이 빵을 두 개 들고 있었습니다. "야, 너 어디 갔었냐?"`,do:[U(`기운`,-1),U(`지훈우정`,1)]}},{text:`그냥 지켜보다 지훈에게 하나 얻는다`,outcome:{text:`지훈이 어디선가 크림빵을 하나 흔들며 나타났습니다. "이건 비밀인데 매점 아주머니랑 내가 좀 알아." 이 녀석은 정체를 모르겠습니다.`,do:[U(`지훈우정`,2),U(`기운`,1)]}}]},{id:`exam_rumor`,title:`출제 범위 소문`,pool:`일상`,once:!0,group:`study`,text:`복도에 이상한 소문이 돌고 있습니다. "이번 시험, 2단원 마지막 문제가 그대로 나온대." 누구의 정보인지는 아무도 모릅니다. 정보통 서현이 수첩을 흔들며 다가왔습니다.`,choices:[{text:`소문을 믿고 2단원만 판다`,check:{chance:50},success:{text:`소문이 맞았습니다! 시험지 마지막 문제가 정확히 낯익었습니다. 서현이 뒤에서 윙크를 했습니다.`,do:[U(`성적`,2),U(`서현호감`,1)]},failure:{text:`소문은 틀렸습니다. 다른 단원이 대부분이었고, 서현은 어색하게 웃으며 도망쳤습니다.`,do:[U(`성적`,-1),U(`서현호감`,-1)]}},{text:`"정공법이다" 전 범위를 공부한다`,outcome:{text:`소문과 상관없이 책상 앞에 앉았습니다. 힘들었지만 마음이 편했습니다.`,do:[U(`성적`,1),U(`성실`,1),U(`기운`,-1)]}}]},{id:`cafeteria_vote`,title:`급식 메뉴 투표`,pool:`일상`,once:!0,text:`학생회에서 급식 메뉴 투표를 한다고 합니다. 투표함 앞에 서윤이 서서 팔짱을 끼고 지켜보고 있습니다. "…공정한 투표를 위해 순찰합니다."
후보는 돈가스, 떡볶이, 마라탕, 비빔밥.`,choices:[{text:`마라탕에 투표한다 (서윤에게 보인다)`,outcome:{text:`서윤의 눈썹이 아주 약간 올라갔습니다. "…개인 취향은 존중합니다." 나중에 서윤의 급식판에 마라탕이 올라 있는 모습이 보였습니다.`,do:[U(`서윤호감`,1),U(`센스`,1)]}},{text:`떡볶이에 투표한다 (친구들과 이야기하며)`,outcome:{text:`지훈이 옆에서 소리쳤습니다. "떡볶이는 진리다!" 투표함이 가득 차는 동안 함께 웃었습니다.`,do:[U(`지훈우정`,1),U(`기운`,1)]}},{text:`고양이용 메뉴를 건의한다`,outcome:{text:`"…고양이용 메뉴는 학교 급식 범위에 포함되지 않습니다." 서윤이 수첩에 적으면서 이상하게 오래 쳐다보았습니다. 다음 날 급식실 앞에 고양이 간식 한 봉지가 놓여 있었습니다.`,do:[U(`마루`,1),U(`서윤호감`,1),Lc(`고양이간식`,1)]}}]},{id:`photo_day`,title:`단체 사진 촬영일`,pool:`일상`,once:!0,text:`운동장에 반 전체가 모였습니다. 사진사 아저씨가 외쳤습니다. "자, 줄 맞춰서! 이쪽 보세요! 하나, 둘—" 그 순간 마루가 앞줄 한가운데로 걸어 나와 앉았습니다.
"…이건 찍어도 되는 건가요." 담임이 눈을 감았습니다.`,choices:[{text:`마루 옆에 같이 앉는다`,outcome:{text:`사진 속에는 반 전체와 한가운데 앉은 고양이, 그리고 그 옆에서 활짝 웃는 당신이 담겼습니다. 서현이 그 사진을 교지 표지로 쓰겠다고 했습니다.`,do:[U(`마루`,1),U(`자신감`,1),U(`서현호감`,1)]}},{text:`마루를 안아서 옆으로 옮긴다`,check:{skill:`센스`,difficulty:2},success:{text:`마루가 순순히 안겼고 모두가 환호했습니다. 사진 속 당신은 고양이를 안고 있었고 마루의 얼굴이 가장 크게 나왔습니다.`,do:[U(`마루`,2),U(`자신감`,1)]},failure:{text:`마루가 발톱을 세웠습니다. 사진 속 당신은 눈을 감고 비명을 지르는 얼굴이었습니다. 오래 남을 사진입니다.`,do:[U(`자신감`,-1),U(`지훈우정`,1)]}}]},{id:`library_noise`,title:`도서관의 소음`,pool:`일상`,once:!0,text:`도서관 서가 사이에서 삑 소리가 났습니다. 핸드폰 알람이 터진 모양인데, 소리의 주인이 서가 뒤에서 허둥대고 있습니다. 사서 선생님의 시선이 서서히 이쪽으로 향합니다.`,choices:[{text:`대신 자기 핸드폰이라고 나선다`,outcome:{text:`"죄송합니다, 제 거예요!" 사서 선생님의 차가운 시선이 당신에게 꽂혔습니다. 서가 뒤에서 누군가 숨을 크게 내쉬는 소리가 들렸습니다. 나중에 쪽지가 도착했습니다. 「고마워. 이 빚은 갚을게.」`,do:[U(`다정`,1),U(`자신감`,1),U(`벌점`,0),U(`태오호감`,1)]}},{text:`모른 척한다`,outcome:{text:`서가 뒤의 누군가가 알아서 알람을 껐습니다. 도서관은 다시 조용해졌습니다.`,do:[U(`기운`,1)]}}]}],_l=[{id:`late_morning`,title:`늦잠의 대가`,pool:`사건`,once:!0,tone:`negative`,text:`눈을 떴을 때 시계는 8시 12분이었습니다. 등교 마감은 8시 30분. 교복을 거꾸로 입을 뻔했지만 가까스로 뛰쳐나갔습니다. 교문이 보이는 순간 마지막 불행이 눈앞에 나타났습니다. 서윤이 시계를 보며 서 있습니다.`,choices:[{text:`전력 질주해서 슬라이딩한다`,check:{skill:`배짱`,difficulty:3},success:{text:`교문이 닫히기 1초 전에 미끄러져 들어갔습니다. 서윤이 스톱워치를 들고 말했습니다. "…29분 59초. 인정합니다." 숨을 몰아쉬는데 서윤의 입가가 아주 약하게 올라갔습니다.`,do:[U(`서윤호감`,1),U(`배짱`,1),U(`기운`,-1)]},failure:{text:`"1분 초과입니다." 서윤이 수첩을 펼쳤습니다. 벌점이 한 점 올라갔고 이마에는 땀이 흥건했습니다.`,do:[G(`들킴`,{소문량:0,벌점량:1}),U(`기운`,-1)]}},{text:`솔직하게 사과한다`,outcome:{text:`"…기상 알람 설정은 학생의 기본 책임입니다." 서윤이 아주 잠깐 말을 멈췄습니다. "…이번은 구두 경고로 하겠습니다."`,do:[U(`서윤호감`,1),U(`성실`,1)]}}]},{id:`phone_confiscated`,title:`휴대폰 압수`,pool:`사건`,once:!0,tone:`negative`,text:`수업 중에 진동이 울렸습니다. 담임의 눈이 칠판에서 이쪽으로 서서히 돌아왔습니다. "…{$이름}. 휴대폰 제출."
화면에는 읽지 않은 메시지가 떠 있었습니다. 누구의 메시지인지는 모르는 게 좋습니다.`,choices:[{text:`순순히 제출한다`,outcome:{text:`담임이 휴대폰을 서랍에 넣고 열쇠를 돌렸습니다. 방과 후에 되찾을 때까지 어쩐지 마음이 허전했습니다.`,do:[U(`성실`,1),U(`기운`,1)]}},{text:`"배터리가 없어요"라고 변명한다`,check:{skill:`센스`,difficulty:3},success:{text:`담임이 한참 쳐다보다가 화면을 확인했습니다. 정말 방전되어 있었습니다. 어젯밤 충전을 잊은 것이 이렇게 도움이 될 줄은.`,do:[U(`센스`,1),U(`자신감`,1)]},failure:{text:`"그렇다면 이 진동은 무엇입니까." 휴대폰은 학급 압수함에 들어갔고, 알림은 계속 울렸습니다.`,do:[U(`자신감`,-1),G(`들킴`,{소문량:1,벌점량:0})]}}]},{id:`love_letter`,title:`신발장의 편지`,pool:`사건`,once:!0,when:`주 >= 4`,text:`신발장 문을 열자 흰 봉투 하나가 툭 떨어졌습니다. 겉면에는 이름이 없습니다. 안에는 짧은 한 줄이 적혀 있었습니다.
「오늘 방과 후, 옥상에서.」
필체는 반듯한 것도 같고, 들뜬 것도 같고, 장난 같은 것도 같습니다. 누구의 것인지 알 수 없습니다.`,choices:[{text:`옥상에 올라가 본다`,outcome:{text:`옥상 난간에 앉아 있던 건 마루였습니다. 고양이 목에 쪽지가 하나 걸려 있었습니다. 「아무도 안 올 줄 알았지?」 서현이 건물 모퉁이에서 카메라를 들고 숨어 있었습니다. 몰래카메라였습니다.`,do:[U(`서현호감`,1),U(`마루`,1),G(`들킴`,{소문량:1,벌점량:0})]}},{text:`쪽지를 서윤에게 가져가 신고한다`,outcome:{text:`"…신고 감사합니다. 다만 편지 자체는 규정 위반이 아닙니다." 서윤이 편지를 읽다가 귀 끝이 붉어졌습니다. "…이 필체는 제가 아닙니다. 오해하지 마십시오."`,do:[U(`서윤호감`,1),U(`성실`,1)]}},{text:`아무 일도 없던 것처럼 가방에 넣는다`,outcome:{text:`집에 돌아와서 편지를 다시 꺼내 보았습니다. 이상하게 마음에 걸렸습니다. 서랍 속에 넣고 잠글 때까지 한참 고민했습니다.`,do:[U(`자신감`,1),Rc(`짝사랑`)]}}]},{id:`cold_wave`,title:`감기 유행`,pool:`사건`,once:!0,tone:`negative`,text:`교실에 기침 소리가 번졌습니다. 주변 책상마다 마스크가 한 겹씩 늘었고, 지훈이 코를 훌쩍이며 속삭였습니다. "야, 나 열 있는 것 같아." 당신의 목도 간질거리기 시작했습니다.`,choices:[{text:`핫팩을 꺼내 몸을 녹인다`,requires:`item('핫팩') > 0`,hidden:!0,outcome:{text:`주머니 속 핫팩이 따뜻했습니다. 감기 기운이 사라진 것 같았습니다. 옆자리 지훈에게도 한 장 나눠 주었습니다.`,do:[Lc(`핫팩`,-1),U(`지훈우정`,1),U(`기운`,1)]}},{text:`마스크를 쓰고 버틴다`,check:{skill:`성실`,difficulty:3},success:{text:`마스크 속에서 숨을 가다듬고 수업에 집중했습니다. 하교 때까지 버텼고 감기는 지나갔습니다.`,do:[U(`성실`,1),U(`기운`,-1)]},failure:{text:`다음 날 눈을 뜨자 목이 쉬어 있었습니다. 감기에 걸렸습니다.`,do:[Rc(`감기`)]}},{text:`조퇴하고 집에서 쉰다`,outcome:{text:`이불 속에서 푹 잤습니다. 일어나자 열이 내려 있었고 누군가 문 앞에 죽 한 통을 두고 간 흔적이 있었습니다.`,do:[U(`기운`,3),U(`성적`,-1),U(`다정`,1)]}}]},{id:`cat_in_office`,title:`교무실에 나타난 고양이`,pool:`사건`,once:!0,text:`점심시간 교무실에서 비명이 터졌습니다. 마루가 책상 위를 가로지르며 교감 선생님의 서류를 쏟았습니다. 모두가 마루를 잡으려고 하는데 마루는 오직 당신 쪽으로만 시선을 돌렸습니다.
"…학생, 이 고양이 아는 사이죠?"`,choices:[{text:`이름을 불러 마루를 데려온다`,check:{skill:`다정`,difficulty:2,bonus:`마루 * 5`},success:{text:`"마루야!" 한 번 부르자 마루가 서류 더미에서 뛰어내려 품에 안겼습니다. 교감 선생님이 헛기침을 했습니다. "…이 정도면 공식 보호자로 인정할 수밖에."`,do:[U(`마루`,2),U(`자신감`,2),W(`마루보호자`)]},failure:{text:`마루는 다른 책상 위로 뛰어올랐고, 결국 서윤이 직접 잡았습니다. 서윤이 고양이를 안고 있는 장면을 모두가 목격했습니다. 서윤은 얼굴이 새빨갰습니다.`,do:[U(`서윤호감`,2),U(`마루`,1),G(`들킴`,{소문량:1,벌점량:0})]}},{text:`모른 척한다`,outcome:{text:`마루가 슬픈 눈으로 이쪽을 쳐다보았습니다. 결국 서윤이 마루를 안고 나가는 모습이 보였습니다. 어쩐지 죄책감이 남았습니다.`,do:[U(`마루`,-1),U(`서윤호감`,1)]}}]},{id:`broadcast_prank`,title:`방송 장난`,pool:`사건`,once:!0,when:`하준호감 >= 1`,text:`점심 방송에서 하준의 목소리가 울렸습니다. "오늘의 사연입니다. 2학년 3반 {$이름}님께, 익명의 팬이 신청곡을 보냈습니다."
교실 전체가 돌아봅니다. 지훈이 얼굴을 손으로 가렸습니다. 곡 제목은 어릴 때 둘이 같이 부르던 동요였습니다.`,choices:[{text:`방송실로 달려가서 항의한다`,outcome:{text:`방송실 문을 열자 하준이 헤드셋을 쓴 채 박수를 치며 맞이했습니다. "야, 어땠어? 완벽한 방송이었지?" 당신은 한숨을 쉬며 마이크를 빼앗았습니다. 그 모습이 다음 방송에도 나갔습니다.`,do:[U(`하준호감`,1),G(`들킴`,{소문량:1,벌점량:0}),U(`자신감`,1)]}},{text:`장난에 맞장구를 쳐서 되받아친다`,check:{skill:`센스`,difficulty:3},success:{text:`교실 창문에서 소리쳤습니다. "신청곡 감사합니다. 다음엔 제 사연도 부탁합니다!" 교실이 웃음바다가 되었고 방송실의 하준이 크게 웃는 소리가 스피커로 들렸습니다.`,do:[U(`하준호감`,2),U(`센스`,1),U(`자신감`,1)]},failure:{text:`대답이 꼬여 결국 교실 전체의 웃음거리가 되었습니다. 하준이 방송으로 사과했지만 이미 늦었습니다.`,do:[U(`하준호감`,1),G(`들킴`,{소문량:1,벌점량:0}),U(`자신감`,-1)]}}]},{id:`lost_wallet`,title:`사라진 지갑`,pool:`사건`,once:!0,tone:`negative`,text:`하교 직전 가방을 열었는데 지갑이 없습니다. 오늘 아침에는 분명 있었는데. 교실, 복도, 매점까지 뒤졌지만 보이지 않습니다. 지훈이 말했습니다. "마지막으로 본 게 어디야?"`,choices:[{text:`쓰레기통과 분실물 보관함을 뒤진다`,check:{skill:`성실`,difficulty:3},success:{text:`분실물 보관함 맨 밑에서 지갑을 찾았습니다. 서윤이 습득자 이름 칸에 서명한 흔적이 있었습니다. 서윤은 모른 척 순찰 중이었습니다.`,do:[U(`서윤호감`,1),U(`성실`,1)]},failure:{text:`지갑은 끝내 나오지 않았습니다. 학교 앞에서 컵라면 하나 값밖에 안 남았습니다.`,do:[U(`용돈`,-10),U(`자신감`,-1)]}},{text:`포기하고 지훈에게 얻어먹는다`,outcome:{text:`"야, 오늘은 내가 산다." 지훈이 편의점에서 컵라면 두 개를 계산했습니다. 이 우정은 영원할 것 같습니다.`,do:[U(`지훈우정`,2),U(`용돈`,-3)]}}]},{id:`sneak_photo`,title:`찍힌 사진`,pool:`사건`,once:!0,when:`서현호감 >= 1`,text:`쉬는 시간, 교실 문 앞에서 카메라 셔터 소리가 났습니다. 서현이 급히 카메라를 가방에 넣었습니다. "아, 아무것도 안 찍었어요!" 손에 든 필름은 방금 당신을 향해 있던 것이 분명합니다.`,choices:[{text:`사진을 보여 달라고 한다`,outcome:{text:`서현이 마지못해 카메라를 내밀었습니다. 화면 속 당신은 졸린 얼굴로 책상에 엎드려 있었는데, 의외로 평화로워 보였습니다. "…이건 기사에 안 써요. 개인 소장용이에요." 서현이 작게 덧붙였습니다.`,do:[U(`서현호감`,2),U(`자신감`,1)]}},{text:`그냥 지나간다`,outcome:{text:`모른 척 교실을 나갔습니다. 서현이 뒤에서 안도의 숨을 쉬는 소리가 들렸습니다.`,do:[U(`서현호감`,1)]}},{text:`카메라를 낚아채 화면을 확인한다`,check:{skill:`센스`,difficulty:3},success:{text:`카메라 속에는 당신의 사진이 수십 장이었습니다. 서현이 새빨개져서 외쳤습니다. "취재 대상이니까요! 취재!" 취재 치고는 너무 많은 숫자입니다.`,do:[U(`서현호감`,2),U(`자신감`,2)]},failure:{text:`카메라를 떨어뜨렸고 렌즈에 금이 갔습니다. 서현의 얼굴이 하얘졌습니다. 용돈으로 수리비를 일부 내기로 했습니다.`,do:[U(`서현호감`,-1),U(`용돈`,-5)]}}]}],vl=e=>`clamp(${e} * 9 + 진심 * 3 + 자신감 * 2 - 소문 * 3 - 허세 * 3 - 벌점 * 2 - 10, 5, 95)`,yl=e=>`clamp(${e} * 8 + 다정 * 4 + 진심 * 2 - 소문 * 2 - 허세 * 2, 5, 90)`,bl=(e,t,n,r,i,a,o,s,c)=>({id:`confess_${e}`,title:r,text:i,choices:[{text:`숨기지 않고 마음을 말한다`,check:{chance:vl(t)},success:{text:a,do:[Bc(`${r} — 마음을 전했다`,5),Vc(n)]},failure:{text:o,goto:`confess_fail`}},{text:`초콜릿을 건네며 돌려 말한다`,requires:`item('초콜릿') > 0`,requiresText:`건넬 초콜릿이 필요하다`,check:{chance:yl(t)},success:{text:s,do:[Lc(`초콜릿`,-1,!0),Bc(`${r} — 초콜릿과 함께 마음을 전했다`,5),Vc(n)]},failure:{text:c,do:[Lc(`초콜릿`,-1,!0)],goto:`confess_fail`}},{text:`역시 말하지 못하고 웃어넘긴다`,outcome:{text:`입 안까지 올라왔던 말이 도로 삼켜졌습니다. "…아니에요, 아무것도." 웃음으로 얼버무린 순간 둘 사이로 바람이 지나갔습니다.`,do:[U(`허세`,1)],goto:`confess_fail`}}]}),xl=[{id:`festival_gate`,title:`문화제 아침`,pool:`주요`,fixed:!0,priority:100,when:`주 >= 24`,text:`문화제 당일. 운동장에는 등불이 늘어서고, 교정 곳곳에 포스터가 휘날립니다. 가슴이 두근거리는 소리가 벚꽃이 지고 낙엽이 쌓인 가을 하늘까지 닿을 것 같습니다.
오늘, 모든 것이 결정됩니다.`,record:{text:`문화제 날이 밝았다`,importance:5},choices:[{text:`교문을 향해 걸어간다`,outcome:{do:[Uc(`소문 >= 7`,[Hc(`scandal_start`)],[Uc(`성적 <= 2`,[Hc(`remedial_end`)],[Uc(`((서윤호감 >= 7) ? 1 : 0) + ((하준호감 >= 7) ? 1 : 0) + ((유나호감 >= 7) ? 1 : 0) + ((태오호감 >= 7) ? 1 : 0) + ((서현호감 >= 7) ? 1 : 0) >= 2 and 허세 >= 2 and 소문 >= 4`,[Hc(`chaos_start`)],[Hc(`festival`)])])])]}}]},{id:`festival`,title:`문화제, 마지막 밤`,text:`{image roof}
불꽃이 오르고, 운동장에 등불이 켜지고, 방송에서 하준의 낮은 목소리가 흘러나옵니다. 문화제 마지막 밤. 이 밤이 지나면 누구도 오늘 이전으로 돌아갈 수 없습니다.
옥상으로 올라가는 계단 앞에서 가슴이 쿵쿵 뜁니다. 누구를 찾으러 가시겠어요?`,choices:[{text:`서윤을 찾아간다 — 완장을 푼 풍기 부회장`,outcome:{goto:`confess_seoyun`}},{text:`하준을 찾아간다 — 마이크를 내려놓은 소꿉친구`,outcome:{goto:`confess_hajun`}},{text:`유나를 찾아간다 — 커튼콜이 끝난 무대 위`,outcome:{goto:`confess_yuna`}},{text:`태오를 찾아간다 — 도서관 창가 자리`,outcome:{goto:`confess_taeo`}},{text:`다른 길을 간다`,outcome:{text:`발걸음이 한곳으로 정해지지 않습니다. 계단 중간에서 잠시 멈췄습니다.`,choices:[{text:`서현을 찾아간다 — 카메라를 내려놓은 기자`,outcome:{goto:`confess_seohyeon`}},{text:`지훈과 편의점에서 컵라면을 먹는다`,outcome:{text:`"야, 여기 있었냐." 지훈이 의자를 빼 주었습니다. 컵라면에 물을 붓는 동안 아무도 아무 말도 하지 않았습니다.`,do:[Uc(`지훈우정 >= 4`,[Vc(`best_friend`)],[Vc(`friends`)])]}},{text:`옥상 난간에서 마루와 불꽃놀이를 본다`,outcome:{text:`옥상 문을 열자 난간 위에 마루가 앉아 있었습니다. 마루가 당신을 보더니 짧게 야옹, 하고 말했습니다.`,do:[Uc(`마루 >= 4`,[Vc(`maru`)],[Vc(`friends`)])]}},{text:`혼자 옥상에 올라가 불꽃을 본다`,outcome:{text:`혼자 올라간 옥상에서 운동장의 등불이 파도처럼 흔들렸습니다. 아무도 오지 않았고, 조금도 쓸쓸하지 않았습니다.`,do:[Uc(`자신감 >= 6`,[Vc(`solo`)],[Hc(`confess_fail`)])]}},{text:`마이크를 잡고 무대에 올라 연설을 한다`,requires:`진심 >= 6 and 서윤호감 >= 5 and 벌점 <= 2`,hidden:!0,outcome:{text:`객석 맨 앞줄의 서윤과 눈이 마주쳤습니다. 서윤이 아주 작게 고개를 끄덕였습니다. 하준이 마이크를 건넸습니다. "…해 봐. 방송은 내가 켜 둘게."`,goto:`repeal_speech`}}]}}]},bl(`seoyun`,`서윤호감`,`seoyun_love`,`옥상의 서윤`,`옥상 문 앞에서 서윤이 완장을 풀어 손에 쥐고 서 있었습니다. 자는 가방에 넣어 두었는지 보이지 않습니다. 등을 보이고 난간 너머의 불꽃을 보고 있습니다.
"…오셨습니까." 서윤이 돌아보지 않고 말했습니다. "오늘은 순찰이 아닙니다. 사적인 시간입니다. 그러니까… 규정상 문제는 없습니다."
귀 끝이 불꽃보다 붉었습니다.`,`"…저도입니다." 서윤이 완장을 쥔 손을 떨며 돌아섰습니다. "저도, 어느 순간부터 규칙을 어기고 있었습니다. 풍기위원이 이렇게 어기면 안 되는데."`,`"…죄송합니다." 서윤이 눈을 피했습니다. "저는… 아직 규칙 밖으로 나갈 준비가 안 됐습니다." 불꽃이 터졌고, 서윤의 어깨가 아주 조금 떨렸습니다.`,`초콜릿을 받은 서윤이 한참 포장지를 쳐다보다 낮게 말했습니다. "…고양이 모양이 아닌데도 마음에 듭니다." 그리고 처음으로 소리 내어 웃었습니다.`,`초콜릿을 받은 서윤이 굳은 얼굴로 말했습니다. "…풍기 위반 물품입니다. 몰수합니다." 몰수한 초콜릿을 쥐고 서윤은 자리를 떠났습니다.`),bl(`hajun`,`하준호감`,`hajun_love`,`옥상의 하준`,`옥상 난간 위에 하준이 걸터앉아 있었습니다. 헤드셋은 목에 걸렸고, 마이크는 바닥에 내려놓았습니다. 아래 운동장에서는 불꽃이 올랐다 잦아듭니다.
"…야, 왔네." 하준이 웃으려다 말았습니다. "나 말이야, 오늘 방송 마이크 켜 놓은 채로 내려왔다? 사고인 척하려고. 근데 네가 오면 끌 생각이었어."
난간 위에서 다리를 흔들던 하준이 문득 진지한 눈을 했습니다.`,`"…아, 진짜?" 하준이 난간에서 내려왔습니다. 웃음이 터졌다가 이내 가라앉았습니다. "나 지금 방송 켜 둔 채인데. 어떡하지. 아까 한 말, 다 퍼졌다." 그리고 손을 내밀었습니다. "그래도 취소는 안 할래."`,`"야…" 하준이 웃으려다 입꼬리를 내렸습니다. "…미안. 나, 우리가 계속 소꿉친구일 줄 알았거든." 목소리가 처음으로 장난이 아니었습니다.`,`초콜릿 포장을 뜯던 하준이 갑자기 웃음을 터뜨렸습니다. "이거 어릴 때 우리가 같이 먹던 거네. 기억하고 있었어?" 눈이 약간 젖어 있었습니다.`,`하준이 초콜릿을 받아 들고 웃었습니다. "고맙다, 친구." 그 한마디가 어쩐지 오래 귀에 남았습니다.`),bl(`yuna`,`유나호감`,`yuna_love`,`무대 위의 유나`,`텅 빈 소극장 무대 위에 유나가 홀로 서 있었습니다. 객석 조명은 꺼졌고, 스포트라이트 한 줄기만 그녀를 비춥니다. 왕관 핀이 반짝였습니다.
"…오셨군요." 유나가 대사 없이 말했습니다. "오늘 공연은 끝났어요. 그런데 아직 주연의 대사가 남아 있어요."
왕관 핀을 만지작거리던 유나의 손이 가볍게 떨렸습니다. 처음으로 연기 같지 않았습니다.`,`유나의 눈이 별처럼 빛나다가 이내 젖었습니다. "…이건 대본에 없어요. 이건 진짜예요." 무대 위에서 유나가 두 팔을 벌렸다가 처음으로 천천히 내렸습니다.`,`유나가 한 걸음 물러섰습니다. "…이건 저도 처음이라 어떻게 연기해야 할지 모르겠어요." 작게 웃었지만 눈은 웃지 않았습니다. "죄송해요. 오늘은 커튼콜을 못 하겠어요."`,`초콜릿을 받은 유나가 두 손으로 품에 안았습니다. "이건 소품이 아니라 선물이네요!" 그러고는 대본을 접고 처음으로 연기가 아닌 눈물을 흘렸습니다.`,`"감동적인 소품이에요!" 유나가 초콜릿을 높이 들었다가 무대 아래로 내려왔습니다. 눈이 약간 어두웠습니다. "…다음 공연에서 써도 될까요?"`),bl(`taeo`,`태오호감`,`taeo_love`,`도서관의 태오`,`도서관 가장 안쪽 창가에 스탠드 불빛이 하나. 태오가 책을 펼쳐 놓고 있었지만 페이지는 한참 넘어가지 않았습니다. 창밖으로 불꽃이 올랐다 사라집니다.
"…문화제 안 가고." 태오가 작게 말했습니다. "…나는 여기가 편해서. 하지만 네가 오면 얘기가 달라지지."
책 위에 은색 책갈피가 놓여 있었습니다.`,`태오가 책을 천천히 덮었습니다. 안경 너머의 눈이 흔들렸습니다. "…그건 내가 먼저 말하고 싶었는데." 어색하게 웃었습니다. 처음 보는 표정이었습니다.`,`태오가 한참 침묵했습니다. "…미안. 나는 졸업을 앞두고 있고, 아직… 말을 고르지 못하겠어." 책갈피를 쥔 손이 아주 조금 떨렸습니다.`,`초콜릿을 받은 태오가 한참 포장지를 쳐다보다 책갈피를 내밀었습니다. "…교환." 뒷면의 작은 글씨가 이번에는 또렷하게 읽혔습니다.`,`"…고마워." 태오가 초콜릿을 책 사이에 끼워 넣었습니다. 그리고 다시 책을 펼쳤습니다. 아무 말도 하지 않았지만 책장은 한참 넘어가지 않았습니다.`),bl(`seohyeon`,`서현호감`,`seohyeon_love`,`신문부실의 서현`,`신문부실 불은 켜져 있었고, 서현이 책상 위에 카메라를 내려놓고 앉아 있었습니다. 벽의 사진들이 불빛에 일렁입니다. 서현은 수첩의 마지막 장을 펼쳐 두고 있었습니다.
"…취재는 끝났어요. 이제 기사만 쓰면 되는데." 서현이 펜을 돌렸습니다. "…아직 헤드라인이 안 정해졌어요. 사실 정해져 있는데, 쓰기가 겁이 나서."
수첩에는 당신 이름이 적혀 있었습니다.`,`서현의 펜이 멈췄습니다. 곧 눈이 둥그레졌다가 웃음이 터졌습니다. "…특종이다, 이건." 그리고 카메라를 내려놓은 채 말했습니다. "찍지 않을게요. 이건 기억에만 남길게요."`,`"…그렇군요." 서현이 수첩을 덮었습니다. "미안해요. 취재원은 취재원으로 남기고 싶었는데, 제가 선을 넘었네요." 웃음이 어딘가 어색했습니다.`,`초콜릿을 받은 서현이 한참 포장을 살폈습니다. "…이건 증거물로 보관할게요." 그리고 활짝 웃었습니다. "기사 제목, 정했어요."`,`"…고마워요, 취재 협조." 서현이 초콜릿을 받아 수첩에 끼웠습니다. 눈이 약간 아쉬운 듯 흔들렸습니다.`),{id:`confess_fail`,title:`문화제의 뒤편`,text:`마음이 닿지 못한 걸까요, 아니면 제 속도가 달랐던 걸까요. 문화제의 소란이 점점 멀어졌습니다. 계단 아래서 누군가 컵라면 두 개를 들고 올라오는 소리가 들렸습니다.
"야, 아직 안 갔냐?" 지훈이 아무렇지 않은 얼굴로 한 개를 내밀었습니다. 발치에서 마루가 당신 다리에 몸을 비볐습니다.`,record:{text:`마음은 닿지 못했지만, 곁에는 사람이 남았다`,importance:4},choices:[{text:`컵라면을 받아 들고 같이 앉는다`,outcome:{text:`말없이 라면을 먹었습니다. 옥상 위로 마지막 불꽃이 올랐습니다. 눈물이 조금 났는데 라면이 매워서라고 하기로 했습니다.`,do:[Uc(`지훈우정 >= 4`,[Vc(`best_friend`)],[Vc(`friends`)])]}},{text:`"괜찮아." 웃으며 고개를 든다`,outcome:{text:`"괜찮아. 진짜로." 입 밖으로 소리 내어 말하자 조금은 그렇게 느껴졌습니다. 마루가 무릎 위로 올라왔습니다.`,do:[Uc(`마루 >= 3`,[Vc(`maru`)],[Uc(`자신감 >= 6`,[Vc(`solo`)],[Vc(`afterglow`)])])]}},{text:`아무 말 없이 계단을 내려간다`,outcome:{text:`혼자 계단을 내려오는 소리가 크게 울렸습니다. 문화제의 소란이 다시 다가왔고, 지금은 그것도 나쁘지 않았습니다.`,do:[Vc(`afterglow`)]}}]},{id:`repeal_speech`,title:`연애 금지령, 마이크 앞에서`,text:`무대 위 마이크 앞. 운동장 전체의 시선이 쏟아집니다. 조명이 눈을 찌르고 마이크가 손에서 떨립니다. 맨 앞줄의 서윤이 완장을 쥔 채 서 있습니다.
준비한 원고는 없습니다. 말해야 할 것은 이미 가슴에 있습니다.`,record:{text:`문화제 무대에서 연애 금지령을 이야기했다`,importance:5},choices:[{text:`"규칙은 마음을 막으려는 게 아니라 지키려는 거라고 생각합니다"`,check:{chance:`clamp(진심 * 6 + 서윤호감 * 4 + 자신감 * 3 - 소문 * 2 - 벌점 * 3, 10, 92)`},success:{text:`마이크를 타고 목소리가 운동장 끝까지 닿았습니다. 정적이 한동안 이어졌고, 가장 먼저 박수를 친 사람은 교장 선생님이었습니다.`,do:[Bc(`연애 금지령이 폐지되었다`,5),Vc(`repeal`)]},failure:{text:`문장 중간에서 목소리가 갈라졌습니다. 마이크가 하울링을 냈고, 방송실의 하준이 황급히 볼륨을 줄였습니다. 어색한 박수가 몇 번 나왔습니다.`,goto:`speech_flop`}},{text:`긴장해서 아무 말도 못 하고 내려온다`,outcome:{text:`입은 벌어졌는데 목소리는 나오지 않았습니다. 운동장에 길고 긴 정적이 흘렀습니다. 마루가 무대 위를 가로질러 지나갔습니다.`,goto:`speech_flop`}}]},{id:`speech_flop`,title:`마이크가 꺼지고`,text:`무대에서 내려오자 서윤이 다가왔습니다. 완장을 풀어 손에 쥔 채. 표정은 읽히지 않았지만 귀는 붉었습니다.
"…용기는 인정합니다. 원고 없는 연설은 규정 위반입니다만."

"연애 금지령은 소풍에도 적용됩니다." 서윤이 순찰 중이었고, 그 뒤로 하준이 방송 장비를 끌고 따라다니고, 유나는 벚나무 아래서 독백을 하고, 태오는 나무 그늘에 책을 펼쳤고, 서현은 모든 장면을 찍고 있습니다.
도시락을 누구와 나눌까요?`,record:{text:`소풍에서 도시락을 나눠 먹었다`,importance:3},choices:[{text:`서윤과 — 순찰 중에 지친 부회장`,outcome:{text:`"…이건 규정상 간식 제공 행위입니다." 서윤은 말과 달리 계란말이를 정확히 세 번 집어 먹었습니다. 마지막 한 조각을 양보하자 "…감사합니다"가 아주 작게 나왔습니다.`,do:[U(`서윤호감`,2),U(`기운`,1),W(`소풍`,`서윤`)]}},{text:`하준과 — 방송 장비 옆에서`,outcome:{text:`마이크 끈을 목에 건 채 하준이 도시락을 받아 들었습니다. "야, 이거 우리 엄마 레시피랑 똑같은데?" 아마 같은 엄마들이 같은 레시피를 돌려 쓴 모양입니다. 소꿉친구 특권입니다.`,do:[U(`하준호감`,2),U(`기운`,1),W(`소풍`,`하준`)]}},{text:`유나와 — 벚나무 아래의 독백 중`,outcome:{text:`"이 도시락은 고귀하군요!" 유나가 도시락을 두 손으로 받들었습니다. 소시지 문어를 보고 감동해서 한참 울다가, 결국 다 먹었습니다.`,do:[U(`유나호감`,2),U(`기운`,1),W(`소풍`,`유나`)]}},{text:`태오 선배와 — 나무 그늘 아래 책 한 권`,outcome:{text:`말없이 도시락을 나눴습니다. 태오는 주먹밥을 한 번 베어 물고 "…맛있다"라고 낮게 말했습니다. 그 한마디를 온종일 곱씹게 됩니다.`,do:[U(`태오호감`,2),U(`기운`,1),W(`소풍`,`태오`)]}},{text:`혼자 조용히 — 아니, 마루가 와 있다`,outcome:{text:`무릎 위에 올라온 마루에게 소시지를 나눠 주었습니다. 서현의 카메라가 멀리서 찍는 소리가 들렸지만, 이 순간만은 모르는 척하기로 했습니다.`,do:[U(`마루`,2),U(`기운`,2),U(`자신감`,1)]}}]}],wl=[{id:`rainy_day`,title:`비 오는 하굣길`,pool:`주요`,fixed:!0,priority:10,when:`주 >= 11`,text:`하교 시간에 갑자기 쏟아진 장대비. 신발장 앞에 사람들이 줄줄이 서서 하늘만 보고 있습니다. 가방 속에는 투명 비닐우산이 하나뿐.
"비 오는 날의 우산은 법적으로 공공재입니다." 아무 말이나 하는 지훈이 이미 어디론가 달려갔습니다.
신발장 건너편에서 누군가와 눈이 마주쳤습니다.`,record:{text:`비 오는 하굣길, 우산 하나`,importance:4},choices:[{text:`용기를 내어 누군가에게 우산을 같이 쓰자고 한다`,outcome:{text:`우산을 펴 들고 입구에 서 있습니다. 주변을 둘러보니…`,choices:[{text:`서윤에게 — 우산이 없는 듯 서 있는 부회장`,requires:`서윤호감 >= 3`,hidden:!0,outcome:{text:`{image rain}
"…풍기위원이 사적으로 우산을 쓰는 건 규정에 없습니다." 서윤은 입으로는 그렇게 말하면서 우산 안으로 반 발짝 들어왔습니다. 어깨가 닿았습니다. 비 소리 때문에 심장 소리가 안 들리길 바랐습니다. 골목 끝에서 하준이 마루를 안고 지나가다 둘을 보고 슬쩍 길을 돌아갔습니다.`,do:[U(`서윤호감`,3),G(`마음전하기`,{양:1}),W(`우산`,`서윤`),Rc(`설렘`),G(`들킴`,{소문량:1,벌점량:0})]}},{text:`하준에게 — 방송 장비를 끌어안고 서 있는 소꿉친구`,requires:`하준호감 >= 3`,hidden:!0,outcome:{text:`"야, 이거 완전 영화 같은데?" 하준이 우산 반쪽 아래로 들어와 장비 가방을 가슴에 안았습니다. 말은 늘 가볍지만, 우산을 쥔 당신 손 위에 하준의 손이 잠깐 얹혀 있었습니다. 둘 다 모른 척했습니다.`,do:[U(`하준호감`,3),G(`마음전하기`,{양:1}),W(`우산`,`하준`),Rc(`설렘`)]}},{text:`유나에게 — 비를 맞으며 독백하는 중`,requires:`유나호감 >= 3`,hidden:!0,outcome:{text:`"이 비는 우리의 만남을 위한 서곡이에요!" 유나가 우산 속으로 뛰어들며 외쳤습니다. 흠뻑 젖은 머리카락에서 보랏빛 물방울이 떨어졌습니다. 가는 내내 쉬지 않고 이야기하다가, 집 앞에서 문득 조용해졌습니다. "…오늘은 대사가 필요 없었네요."`,do:[U(`유나호감`,3),G(`마음전하기`,{양:1}),W(`우산`,`유나`),Rc(`설렘`)]}},{text:`태오에게 — 도서관 앞에서 책을 가슴에 품고 있는 선배`,requires:`태오호감 >= 3`,hidden:!0,outcome:{text:`"…책이 젖는데." 태오가 말없이 우산 아래로 들어오며 책을 가방 안쪽으로 밀어 넣었습니다. 우산 손잡이를 그가 슬쩍 가져가 당신 쪽으로 기울였습니다. 정작 본인 어깨는 다 젖었습니다.`,do:[U(`태오호감`,3),G(`마음전하기`,{양:1}),W(`우산`,`태오`),Rc(`설렘`)]}},{text:`우산을 마루에게 양보하고 먼저 가라고 한다`,outcome:{text:`마루는 의아한 눈으로 당신을 보더니 우산 아래 쪼그려 앉았습니다. 당신은 그 옆에서 같이 비를 피했습니다. 한참 뒤 지훈이 우산 두 개를 들고 돌아와서 말했습니다. "너 뭐 하냐 진짜."`,do:[U(`마루`,2),U(`지훈우정`,1),U(`자신감`,1)]}}]}},{text:`혼자 비를 맞으며 달린다`,outcome:{text:`교문까지 전력 질주. 신발이 철벅거리고 교복이 몸에 달라붙었지만, 이상하게 시원했습니다. 다음 날 아침 눈을 뜨자 코가 막혀 있었습니다.`,do:[U(`기운`,-1),U(`배짱`,1),Rc(`감기`)]}},{text:`그냥 신발장 앞에서 비가 그칠 때까지 기다린다`,outcome:{text:`한참 서 있자 비가 약해졌습니다. 그 동안 옆에서 누군가가 같은 하늘을 올려다보고 있었습니다. 말을 걸지 못한 채 비가 그쳤습니다.`,do:[U(`자신감`,-1),U(`기운`,1)]}}]},{id:`rumor_week`,title:`교지 속보`,pool:`주요`,fixed:!0,priority:5,when:`주 >= 12`,text:`《청화 속보》 제12호가 복도에 나붙었습니다. 서현의 필체가 대문짝만 하게 박혀 있습니다.
{if 소문 >= 5}〈교내 의문의 커플 후보, 한 명이 아니다?〉 — 이름은 가렸지만 누가 봐도 {$이름}입니다.{elif 소문 >= 2}〈풍기 부회장이 최근 특정 학생 주변에서 자주 목격된다〉 — 어째서인지 모두가 당신을 쳐다봅니다.{else}〈이번 주 교내는 평화로웠다〉 — 의외로 기사가 없는 것도 기사입니다.{/if}
서현이 신문 뒤에서 얼굴을 반쯤 내밀었습니다. "반응 궁금해서요. 취재의 마무리는 독자의 얼굴이거든요."`,choices:[{text:`정정 기사를 요청한다`,check:{skill:`센스`,difficulty:3},success:{text:`"…정정은 안 하지만, 후속 기사는 쓸 수 있어요." 서현이 눈을 반짝였습니다. 다음 호에는 훈훈한 미담이 실렸습니다.`,do:[U(`소문`,-2),U(`서현호감`,1)]},failure:{text:`"정정 기사를 쓰려면 먼저 사건의 정확한 경위가…" 서현의 인터뷰가 세 시간 이어졌습니다. 기사는 더 길어졌습니다.`,do:[U(`소문`,1),U(`기운`,-1)]}},{text:`"그래서 다음 호엔 뭐 써요?" 오히려 흥미를 보인다`,outcome:{text:`서현이 놀란 눈으로 수첩을 닫았습니다. "…진짜 이상한 사람이네요." 처음으로 기자가 아니라 한 명의 친구 같은 웃음이었습니다.`,do:[U(`서현호감`,2),U(`센스`,1),U(`자신감`,1)]}},{text:`서현과 거래를 한다 (소문을 줄이는 대신 특종 협조)`,requires:`서현호감 >= 3`,requiresText:`서현과 어느 정도 친해져야 거래할 수 있다`,outcome:{text:`"좋아요. 다음 취재는 단독으로, 그리고 독점으로." 둘은 악수를 했습니다. 이 거래는 언젠가 반드시 청구됩니다.`,do:[U(`소문`,-3),U(`서현호감`,1),W(`서현의약속`)]}},{text:`지훈에게 상담을 요청한다`,outcome:{text:`"야, 이건 내 전문이다." 지훈이 진지하게 팔짱을 꼈습니다. 지훈의 조언은 세 가지였습니다. 해명하지 마라, 표정 관리해라, 그리고 컵라면을 사 달라. 마지막이 가장 합리적이었습니다.`,do:[U(`지훈우정`,2),U(`소문`,-1),U(`용돈`,-2)]}}]},{id:`council_help`,title:`서윤의 부탁`,pool:`주요`,fixed:!0,priority:5,when:`주 >= 13`,text:`방과 후, 학생회실 문이 빼꼼 열렸습니다. 서윤이 서류 더미 뒤에서 고개를 들었습니다.
"…일손이 부족합니다. 풍기 순찰 일정표 정리인데. 시간이 되면…"
말끝이 흐려졌습니다. 평소의 서윤답지 않게 시선이 서류에 고정되어 있습니다. 책상 한쪽에는 작은 고양이 스티커가 붙은 서류철이 있었고, 서윤은 그걸 재빨리 손으로 덮었습니다.`,record:`서윤의 학생회실에서 일을 도왔다`,choices:[{text:`두말없이 돕는다`,check:{skill:`성실`,difficulty:3},success:{text:`서류는 의외로 빨리 정리됐습니다. 서윤이 마지막 서류에 도장을 찍고 작게 말했습니다. "…고맙습니다. 간식은 서랍에 있으니 드세요." 서랍을 열자 고양이 모양 쿠키가 들어 있었습니다.`,do:[U(`서윤호감`,3),U(`성적`,1),Lc(`풍기면제권`,1)]},failure:{text:`서류 순서를 완전히 뒤섞었습니다. 서윤은 눈을 감고 심호흡을 한 뒤 조용히 말했습니다. "…괜찮습니다. 처음부터 다시 하면 됩니다." 괜찮지 않은 얼굴입니다.`,do:[U(`서윤호감`,1),U(`기운`,-1)]}},{text:`"고양이 스티커 예쁜데요?" 라고 해 버린다`,outcome:{text:`서윤의 얼굴이 순식간에 새빨개졌습니다. "…아, 아닙니다. 그건 사적 물품입니다. 보지 않은 겁니다." 하지만 귀가 빨갛게 익은 채로 한참 말이 없었습니다.`,do:[U(`서윤호감`,3),G(`마음전하기`,{양:1}),W(`서윤의비밀`)]}},{text:`"오늘은 바빠서요" 정중히 거절한다`,outcome:{text:`"…알겠습니다." 서윤은 서류를 다시 쌓았습니다. 문을 닫는 순간 안에서 작게 한숨 쉬는 소리가 들렸습니다. 어쩐지 발이 무겁습니다.`,do:[U(`서윤호감`,-1),U(`기운`,1)]}},{text:`지훈을 대신 보낸다`,outcome:{text:`지훈이 학생회실에서 곧바로 비명과 함께 돌아왔습니다. "야, 거기 서류가 산이야." 하지만 서윤은 지훈의 신속함을 의외로 높이 샀습니다.`,do:[U(`지훈우정`,1),U(`서윤호감`,1),U(`기운`,1)]}}]},{id:`finals`,title:`기말고사`,pool:`주요`,fixed:!0,priority:10,when:`주 >= 14`,text:`기말고사 주간. 중간고사 때와는 비교도 안 되게 일이 많았던 학기였습니다. 그래도 모두가 어떻게든 시험지 앞에 앉았습니다.
서윤은 복도에 순찰 중이고, 하준은 방송실에서 응원송을 틀다 걸렸고, 유나는 연극 대사 대신 수학 공식을 외우고 있으며, 태오는 시험 전날에도 평소와 같은 속도로 책장을 넘기고 있습니다.`,record:{text:`기말고사를 치렀다`,importance:3},choices:[{text:`꾸준히 쌓아 온 걸로 정면 승부`,check:{skill:`성실`,difficulty:3,bonus:`성적 * 3`},success:{text:`시험지가 낯익었습니다. 몇 주 전에 풀었던 문제와 같은 유형이었습니다. 손이 저절로 움직였습니다.`,do:[U(`성적`,2),U(`자신감`,1)]},failure:{text:`어느 지점부터 문제가 낯설었습니다. 한 문제에 15분을 쓰고 나서야 정신을 차렸습니다.`,do:[U(`성적`,-1),U(`자신감`,-1)]}},{text:`친구들과 스터디 그룹을 연다`,outcome:{text:`지훈이 사회를 보고, 누군가가 필기를 돌리고, 누군가가 간식을 가져왔습니다. 공부는 3할, 수다는 7할이었지만 의외로 머리에 남았습니다.`,do:[U(`성적`,1),U(`지훈우정`,1),U(`기운`,-1)]}},{text:`서윤에게 시험 직전 요점 정리를 부탁한다`,requires:`서윤호감 >= 4`,requiresText:`서윤과 꽤 친해져야 부탁할 수 있다`,outcome:{text:`"…한 번만 설명합니다." 서윤은 15분 만에 세 단원을 압축했습니다. 설명은 엄격했지만 마지막에 형광펜으로 별을 하나 그려 주었습니다.`,do:[U(`성적`,2),U(`서윤호감`,1)]}},{text:`"될 대로 되라" 푹 잔다`,outcome:{text:`이상하게 마음이 편했습니다. 시험지는 어렵지 않았고, 기억이 안 나는 부분은 그냥 찍었습니다. 결과는 나중에 알게 되겠지요.`,do:[U(`기운`,3),U(`성적`,0),U(`자신감`,1)]}}]},{id:`summer_plan`,title:`여름방학 계획`,pool:`주요`,fixed:!0,priority:10,when:`주 >= 15`,text:`종업식 날 교실에는 방학 계획으로 시끌벅적합니다. 지훈이 칠판에 각자의 방학 계획을 적어 내려가고 있었습니다. 여러분의 방학은 어떻게 흘러가야 할까요?
연애 금지령은 방학에도 유효하냐는 질문에 담임이 짧게 답했습니다. "방학은 학교 밖입니다. 하지만 선생님은 학교 밖에도 있습니다."`,record:{text:`여름방학 계획을 세웠다`,importance:3},choices:[{text:`방송부 해변 캠프 — 하준의 장비 담당`,outcome:{text:`캠프 신청서에 이름을 쓰는 순간, 하준이 뒤에서 어깨를 쳤습니다. "너 와 줘서 다행이다. 솔직히 혼자서는 좀 막막했거든." 처음 보는 약한 얼굴이었습니다.`,do:[W(`방학`,`캠프`),U(`하준호감`,1)]}},{text:`연극부 합숙 — 유나의 상대역`,outcome:{text:`"당연히 와 줄 거라고 믿었어요!" 유나가 대본을 건넸습니다. 첫 장에 이미 당신 이름과 상대역 1이라는 글자가 적혀 있었습니다.`,do:[W(`방학`,`합숙`),U(`유나호감`,1)]}},{text:`도서관 알바 — 태오 선배의 옆자리`,outcome:{text:`"…책 정리, 일당 있어요. 옆에서 하면 됩니다." 태오는 서류를 건네며 아주 약간 고개를 숙였습니다. 용돈과 함께 한적한 여름이 될 것 같습니다.`,do:[W(`방학`,`알바`),U(`태오호감`,1),U(`용돈`,5)]}},{text:`신문부 취재 여행 — 서현의 특종 사냥`,outcome:{text:`"이번 방학에는 진짜 특종을 잡을 거예요. 같이 가요, 파트너!" 서현이 지도 위에 빨간 펜으로 동그라미를 쳤습니다. 이 사람과 가면 방학이 조용할 리 없습니다.`,do:[W(`방학`,`취재`),U(`서현호감`,1)]}},{text:`학생회 봉사 활동 — 서윤의 순찰 보조`,outcome:{text:`"…방학에도 학교에는 질서가 필요합니다." 서윤이 순찰 일정표를 건넸습니다. 일정표 맨 아래에 작은 글씨로 「간식 포함」이라고 적혀 있었습니다.`,do:[W(`방학`,`봉사`),U(`서윤호감`,1),U(`성실`,1)]}}]},{id:`summer_trip`,title:`여름방학의 한가운데`,pool:`주요`,fixed:!0,priority:10,when:`주 >= 16`,text:`매미 소리가 쏟아지는 8월 어느 날, 방학 일정이 한창입니다.
{if has('방학', '캠프')}파도 소리 속에서 하준이 마이크 케이블과 씨름하고 있습니다. "야, 이 선 좀 잡아 봐. 아니, 거기 말고 그 옆."{elif has('방학', '합숙')}산속 수련원 강당에서 유나가 대본을 흔들며 외치고 있습니다. "한 번만 더! 이번엔 눈물이 필요해요!"{elif has('방학', '알바')}한적한 도서관 서고. 에어컨 소리와 책장 넘기는 소리만 이어집니다. 태오가 낮게 말합니다. "…점심, 먹을래요?"{elif has('방학', '취재')}낡은 시골 마을. 서현이 지도와 카메라를 들고 앞서 걷습니다. "특종은 늘 이런 곳에 있다니까요!"{else}텅 빈 학교 복도를 서윤이 순찰하고 있습니다. 뒤에서 걷는 당신에게 한 번도 돌아보지 않고 말합니다. "…발소리가 일정하네요. 좋습니다."{/if}`,record:{text:`여름방학, 한가운데서`,importance:3},choices:[{text:`하준을 도와 마이크 케이블을 정리한다`,requires:`has('방학', '캠프')`,hidden:!0,check:{skill:`성실`,difficulty:3},success:{text:`밤새 선 정리를 마치고 해변에 앉았습니다. 하준이 이어폰 한쪽을 건넸습니다. 파도 소리와 함께 처음 듣는 곡이 흘러나왔습니다. "…우리 둘만 아는 걸로 하자."`,do:[U(`하준호감`,3),G(`마음전하기`,{양:1}),U(`기운`,-1)]},failure:{text:`케이블이 엉켜 방송 장비 하나가 바다에 빠졌습니다. 하준은 처음엔 놀랐다가 이내 폭소했습니다. "아, 이것도 추억이다!" 장비값은 둘이 나눴습니다.`,do:[U(`하준호감`,1),U(`용돈`,-4)]}},{text:`유나의 대사 연습 상대가 되어 준다`,requires:`has('방학', '합숙')`,hidden:!0,check:{skill:`센스`,difficulty:3},success:{text:`"그대가 떠난 이 밤이…" 대사 중간에 눈을 마주친 순간, 유나가 대사를 잊고 가만히 웃었습니다. 객석 조명이 꺼지고 처음으로 둘만 남았습니다.`,do:[U(`유나호감`,3),G(`마음전하기`,{양:1}),U(`센스`,1)]},failure:{text:`대사를 하나씩 놓쳤습니다. 유나가 그걸 전부 애드리브로 받아 주었습니다. "이건 코미디로 바꿀게요!" 연극은 의외로 훌륭해졌습니다.`,do:[U(`유나호감`,1),U(`자신감`,-1)]}},{text:`태오 선배와 점심을 먹고 서고를 정리한다`,requires:`has('방학', '알바')`,hidden:!0,outcome:{text:`말은 거의 없었지만 책 정리는 이상할 정도로 잘 맞았습니다. 해 질 녘 서가 사이로 오렌지빛이 들어왔고, 태오가 낮게 말했습니다. "…여름이 길어졌으면 하네요."`,do:[U(`태오호감`,3),U(`용돈`,4),U(`성적`,1)]}},{text:`서현과 오래된 마을의 단서를 쫓는다`,requires:`has('방학', '취재')`,hidden:!0,check:{skill:`배짱`,difficulty:3},success:{text:`폐교 도서관에서 이상한 낙서를 찾았고, 서현의 눈이 반짝였습니다. 돌아오는 길에 서현이 말했습니다. "취재원은 많았는데, 파트너는 처음이에요."`,do:[U(`서현호감`,3),G(`마음전하기`,{양:1}),U(`배짱`,1)]},failure:{text:`길을 잃어 산속에서 헤맸습니다. 해 질 녘 둘이 같이 앉아 라면을 끓여 먹었습니다. 특종은 놓쳤지만 이상하게 즐거운 밤이었습니다.`,do:[U(`서현호감`,1),U(`기운`,-1)]}},{text:`서윤의 순찰을 돕는다`,requires:`has('방학', '봉사')`,hidden:!0,outcome:{text:`낮에는 순찰, 저녁에는 서류 정리. 서윤은 한 번도 불평하지 않았지만 해 질 녘 옥상에서 슬쩍 말했습니다. "…누군가와 이렇게 오래 걸은 건 처음입니다."`,do:[U(`서윤호감`,3),G(`마음전하기`,{양:1}),U(`성실`,1)]}}]},{id:`summer_fireworks`,title:`여름 불꽃놀이`,pool:`주요`,fixed:!0,priority:10,when:`주 >= 17`,text:`방학의 마지막 주말, 강변에서 불꽃놀이가 열렸습니다. 사람들 사이를 걷다 보니 어느새 아는 얼굴들이 곳곳에 보입니다.
{if 최애 == '서윤호감' and 서윤호감 >= 3}서윤이 평소와 다른 사복 차림으로 혼자 서 있습니다. 완장도 자도 없습니다.{elif 최애 == '하준호감' and 하준호감 >= 3}하준이 장비도 없이 빈손으로 돌 위에 앉아 있습니다.{elif 최애 == '유나호감' and 유나호감 >= 3}유나가 젖은 눈으로 하늘을 올려다보며 조용히 서 있습니다.{elif 최애 == '태오호감' and 태오호감 >= 3}태오가 한 손에 책을 들고 난간에 기대어 있습니다.{elif 최애 == '서현호감' and 서현호감 >= 3}서현이 카메라를 내려놓고 멍하니 하늘을 보고 있습니다.{else}어디를 둘러봐도 가까운 얼굴은 없습니다. 지훈이 멀리서 컵라면을 들고 손을 흔듭니다.{/if}`,record:{text:`여름 불꽃놀이를 보았다`,importance:4},choices:[{text:`가장 가까운 사람 곁에 가서 선다`,requires:`인기 >= 3`,requiresText:`마음이 가는 사람이 있어야 한다`,outcome:{text:`말없이 옆에 섰습니다. 불꽃이 터질 때마다 서로의 옆얼굴이 환해졌다 어두워졌습니다. 마지막 불꽃이 올랐을 때, 상대가 작게 말했습니다. "…올해 불꽃은 좀 다르네."`,do:[{do:`if`,cond:`최애 == '서윤호감'`,then:[U(`서윤호감`,2)]},{do:`if`,cond:`최애 == '하준호감'`,then:[U(`하준호감`,2)]},{do:`if`,cond:`최애 == '유나호감'`,then:[U(`유나호감`,2)]},{do:`if`,cond:`최애 == '태오호감'`,then:[U(`태오호감`,2)]},{do:`if`,cond:`최애 == '서현호감'`,then:[U(`서현호감`,2)]},G(`마음전하기`,{양:1}),Rc(`설렘`)]}},{text:`지훈과 컵라면을 먹으며 본다`,outcome:{text:`"야, 불꽃놀이는 이게 제맛이지." 불꽃이 올랐고, 컵라면 국물이 번졌고, 지훈이 아무렇지 않게 말했습니다. "내년에도 이러자." 이상하게 마음이 따뜻했습니다.`,do:[U(`지훈우정`,2),U(`기운`,2),U(`자신감`,1)]}},{text:`혼자 한쪽 구석에서 조용히 본다`,outcome:{text:`혼자였지만 외롭지 않았습니다. 마루가 다가와 발치에 앉았습니다. 불꽃놀이를 같이 본 고양이는 처음입니다.`,do:[U(`마루`,1),U(`자신감`,1),U(`기운`,1)]}}]},{id:`second_term`,title:`2학기 개학`,pool:`주요`,fixed:!0,priority:10,when:`주 >= 18`,text:`2학기 개학날. 교문은 같고 사람들은 조금씩 변했습니다.
서윤은 학생회장 출마를 선언했고, 하준은 방송부 부장이 되었고, 유나는 문화제 연극의 주연으로 발탁됐고, 태오는 입시 때문에 도서관에서 보내는 시간이 늘었고, 서현은 여름 취재 기사로 교내 신문상을 받았습니다.
"…다들 열심히 사네." 지훈의 중얼거림에 누군가 답했습니다. "너도 해, 이 정도는."

mary:`"무슨 일이 일어나는지"를 한 줄씩 쌓아 만드는 명령입니다. 위에서 아래로 차례로 실행됩니다.`,parts:[{title:`다루는 법`,items:[[(0,p.jsx)(J,{children:`＋ 블록 추가`}),`목록 끝의 버튼. 누르면 블록 종류가 설명과 함께 나옵니다.`],[(0,p.jsx)(J,{children:`⠿ 손잡이`}),`블록 왼쪽 점을 잡고 끌면 순서를 바꾸거나 "조건" 블록 안팎으로 옮길 수 있습니다.`],[(0,p.jsx)(J,{children:`⋯ 메뉴`}),`블록에 마우스를 올리면 오른쪽 위에 나옵니다. 위로·아래로, 조건으로 감싸기, 감싸기 풀기, 복제, 삭제. 상태·아이템 블록은 "세부 칸 보기"로 지속 턴·겹침·알림 끄기를 꺼냅니다.`],[(0,p.jsx)(J,{children:`맨 위 갈색 띠`}),`자동 규칙·상태·출신에서 "새 게임을 시작할 때, 언제든 아래를 합니다"처럼 이 블록들이 언제 실행되는지 알려 주는 머리 블록.`]]},{title:`흐름`,items:[[(0,p.jsx)(J,{children:`조건`}),`조건이 맞을 때만 안쪽 블록을 실행합니다. "＋ 아니면"으로 안 맞을 때 할 일도 넣습니다.`],[(0,p.jsx)(J,{children:`확률로 고르기`}),`"확률 [50] %" 갈래 여럿 중 하나만 실행합니다. 합계가 100이 아니면 비율대로 나눕니다.`],[(0,p.jsx)(J,{children:`판정`}),`"성공 확률은 [60] %" 또는 "기본 [30]%에 [용기] 1마다 [10]%씩"으로 굴려 성공/실패 갈래 중 하나를 실행합니다.`]]},{title:`자료`,items:[[(0,p.jsx)(J,{children:`변수 더하기`}),`"[체력] [+1 ▲▼]". +3, -2처럼 부호를 붙여 적거나 ▲▼(키보드 위아래 화살표도 됨)로 1씩 바꿉니다. "힘 * 2" 같은 수식도 적을 수 있습니다. 최솟값·최댓값을 넘지 않게 자동으로 맞춥니다.`],[(0,p.jsx)(J,{children:`변수 정하기`}),`변수를 특정 값으로 바꿉니다.`],[(0,p.jsx)(J,{children:`태그 붙이기 / 떼기`}),`변수를 따로 만들지 않고 "부상", "직업=어부" 같은 표시를 붙이거나 뗍니다(→ 태그).`],[(0,p.jsx)(J,{children:`임시 값`}),(0,p.jsxs)(p.Fragment,{children:[`이 블록 묶음 안에서만 쓰는 값. `,(0,p.jsx)(q,{children:`$이름`}),`으로 읽습니다.`]})]]},{title:`글·그림`,items:[[(0,p.jsx)(J,{children:`본문 추가`}),`결과 화면에 문단을 덧붙입니다.`],[(0,p.jsx)(J,{children:`알림`}),`결과 화면 아래에 작은 알림을 띄웁니다(예: "체력 -1").`],[(0,p.jsx)(J,{children:`인생표 기록`}),`엔딩 화면 인생표에 한 줄 남깁니다.`]]},{title:`소지품`,items:[[(0,p.jsx)(J,{children:`아이템 얻기/잃기`}),`"[아이템] [+1 ▲▼] 개". +는 얻기, -는 잃기.`],[(0,p.jsx)(J,{children:`상태 걸기/풀기`}),`부상·축복 같은 상태를 겁니다. 지속 턴과 겹침 수는 ⋯ 메뉴의 "세부 칸 보기"에서 정합니다(비우면 상태에 정한 기본값).`],[(0,p.jsx)(J,{children:`도전과제 달성`}),`도전과제를 바로 달성시킵니다.`]]},{title:`진행`,items:[[(0,p.jsx)(J,{children:`이벤트로 이동`}),`결과 화면 다음에 볼 이벤트를 정합니다.`],[(0,p.jsx)(J,{children:`스크립트 실행`}),`미리 만든 블록 묶음을 실행합니다(→ 스크립트).`],[(0,p.jsx)(J,{children:`시간 흘리기`}),`턴과 별개로 시간을 더 흘립니다.`],[(0,p.jsx)(J,{children:`턴 넘기기`}),`이번 턴의 남은 일을 건너뛰고 턴을 n번 넘깁니다. "평온하게 몇 년이 흘렀다"에 씁니다.`],[(0,p.jsx)(J,{children:`엔딩`}),`게임을 그 엔딩으로 바로 끝냅니다.`]]},{tip:`바로 위아래 "조건" 블록의 조건이 같으면 "위와 같은 조건 · 합치기" 버튼이 나옵니다. 위 블록이 조건에 쓰인 값을 바꾸면 합친 뒤 결과가 달라질 수 있으니 확인하고 누르세요.`}]},{id:`conditions`,group:`블록과 조건`,title:`조건`,summary:`"언제"를 정하는 칸. 이벤트 등장, 선택 가능 여부, 조건 블록, 자동 규칙, 엔딩, 도전과제에 모두 같은 방식으로 씁니다.`,parts:[{title:`만드는 법`,steps:[`빈 조건 칸을 누르고 종류를 고릅니다(변수 비교, 태그가 있음, 아이템을 가지고 있음 …).`,`나타난 칸에서 대상과 값을 고칩니다. 예: [체력] [≥] [3].`,`조건을 더 붙이려면 조건 끝의 ＋를 누릅니다. 사이의 "그리고/또는"을 바꿀 수 있습니다.`]},{title:`조건 종류`,items:[[(0,p.jsx)(J,{children:`변수 비교`}),`체력 ≥ 3, 돈 = 0처럼 값을 비교합니다. 오른쪽에 다른 변수나 수식도 쓸 수 있습니다.`],[(0,p.jsx)(J,{children:`나이 비교`}),`현재 나이를 비교합니다(인생형).`],[(0,p.jsx)(J,{children:`태그가 있음`}),`그 태그가 붙어 있나. "= 값"을 붙이면 값까지 같아야 합니다.`],[(0,p.jsx)(J,{children:`아이템을 가지고 있음`}),`1개 이상 있나.`],[(0,p.jsx)(J,{children:`상태에 걸려 있음`}),`그 상태에 걸려 있나.`],[(0,p.jsx)(J,{children:`이벤트를 겪었음`}),`그 이벤트를 본 적 있나.`],[(0,p.jsx)(J,{children:`확률`}),`정한 %의 확률로 맞습니다. 확인할 때마다 새로 굴립니다.`],[(0,p.jsx)(J,{children:`도전과제를 달성함`}),`이전 판까지 포함해 달성했나.`],[(0,p.jsx)(J,{children:`참 / 거짓`}),`항상 맞음 / 절대 안 맞음. 잠시 꺼 둘 때 씁니다.`],[(0,p.jsx)(J,{children:`수식 직접 쓰기`}),`블록으로 안 되는 복잡한 조건을 글로 씁니다(→ 수식과 함수).`]]},{title:`조건 블록의 작은 버튼`,items:[[(0,p.jsx)(J,{children:`＋`}),`조건을 하나 더 잇습니다.`],[(0,p.jsx)(J,{children:`¬`}),`반대로 만듭니다("~이 아님").`],[(0,p.jsx)(J,{children:`✕`}),`그 조건을 뺍니다.`],[(0,p.jsx)(J,{children:`ƒ / ◇`}),`조건 칸 오른쪽. 수식으로 보기 ↔ 블록으로 보기. 어느 쪽에서 고쳐도 같은 조건입니다.`]]},{note:`조건 칸이 비어 있으면 "항상"으로 봅니다. 단, 자동 규칙의 "항상 감시"는 조건이 꼭 있어야 합니다.`}]},{id:`grouping`,group:`블록과 조건`,title:`묶어 보기`,summary:`목록을 비슷한 조건끼리 모아 보여 주는 기능입니다. 보기만 바뀌고 실제 순서는 그대로입니다.`,parts:[{items:[[(0,p.jsx)(J,{children:`조건별`}),`조건에 처음 나오는 대상(변수·태그·아이템…)이 같은 것끼리 묶습니다. 예: 체력에 관한 규칙은 "체력" 아래로.`],[(0,p.jsx)(J,{children:`시점 › 조건`}),`자동 규칙을 "언제"로 먼저 나누고 그 안에서 조건별로 묶습니다.`],[(0,p.jsx)(J,{children:`단계 › 조건`}),`이벤트를 단계(나이 범위)로 나누고 그 안에서 조건별로.`],[(0,p.jsx)(J,{children:`순서대로`}),`묶지 않고 실제 순서대로. 순서를 바꾸려면 이 보기로 돌아옵니다.`]]},{tip:`묶음 제목을 누르면 접고 펼칩니다. 항목이 7개 이상일 때 나타납니다.`}]},{id:`variables`,group:`규칙`,title:`변수`,screen:`variables`,summary:`체력·돈·호감도처럼 게임 동안 바뀌는 값입니다.`,parts:[{items:[[(0,p.jsx)(J,{children:`이름`}),(0,p.jsxs)(p.Fragment,{children:[`조건과 수식에서 부르는 이름. 예: `,(0,p.jsx)(q,{children:`체력 >= 3`}),`. 바꾸면 쓰던 곳도 함께 바뀝니다.`]})],[(0,p.jsx)(J,{children:`종류`}),`수치(숫자), 문자(글자), 참/거짓 중 하나.`],[(0,p.jsx)(J,{children:`시작값`}),`게임을 시작할 때의 값.`],[(0,p.jsx)(J,{children:`최솟값 / 최댓값`}),`이 범위를 벗어나지 않게 자동으로 맞춥니다. 최댓값에 다른 변수(최대체력)를 써도 됩니다.`],[(0,p.jsx)(J,{children:`상태창 표시`}),`플레이 화면 위 상태창에 숨김 / 숫자 / 막대 / 글자로 보여 줍니다. 막대는 최댓값이 있어야 합니다.`],[(0,p.jsx)(J,{children:`화면에 보일 이름`}),`ID와 다른 이름을 보여 주고 싶을 때.`],[(0,p.jsx)(J,{children:`값이 바뀌면 알림`}),`결과 화면에 "체력 -1" 같은 알림을 자동으로 띄웁니다.`]]},{title:`세부 설정`,items:[[(0,p.jsx)(J,{children:`계산으로 정해지는 변수`}),`다른 값으로 매번 계산됩니다(예: 전투력 = 힘 + 민첩). 블록으로 직접 바꿀 수 없습니다.`],[(0,p.jsx)(J,{children:`다음 판에도 유지`}),`게임을 새로 시작해도 값이 남습니다. 누적 플레이 수, 해금 같은 데 씁니다.`],[(0,p.jsx)(J,{children:`무작위 시작값`}),`최소·최대 두 칸을 채우면 시작할 때마다 그 사이에서 뽑은 값으로 시작합니다. 예: 3부터 8 사이.`],[(0,p.jsx)(J,{children:`구간별 문구`}),`상태창에 값을 말로 보여 줍니다. 「값이 ○ 이하이면 문구」를 작은 값부터 차례로 적으면 처음 맞는 문구가 보입니다. 예: 그림자 0 이하 ‘없음’, 2 이하 ‘희미함’. 상태창 표시를 「글자」로 하면 값 대신 이 문구만 나옵니다(숫자·막대는 옆에 덧붙음). 비워 둔 문구는 그 구간에서 아무것도 보이지 않습니다.`],[(0,p.jsx)(J,{children:`그룹`}),`여러 변수를 같은 이름으로 묶어 두면, 그중 가장 높은 것을 조건에서 찾을 수 있습니다.`]]}]},{id:`tags`,group:`규칙`,title:`태그`,summary:`미리 만들어 두지 않아도 되는 가벼운 표시. "부상", "직업=어부"처럼 붙였다 뗐다 합니다.`,parts:[{what:`변수는 변수 화면에서 미리 만들어야 하지만, 태그는 블록에서 이름을 적는 순간 생깁니다. "이런 일이 있었다"는 기록이 많을 때 편합니다.`},{items:[[(0,p.jsx)(J,{children:`붙이기`}),`표시만 붙입니다. 예: "첫사랑".`],[(0,p.jsx)(J,{children:`값 넣기`}),`값을 함께 넣습니다. 예: 직업 = 어부.`],[(0,p.jsx)(J,{children:`숫자 더하기`}),`숫자를 쌓습니다. 예: 명성 +1.`],[(0,p.jsx)(J,{children:`떼기`}),`태그를 없앱니다. "(으)로 시작하는 것 모두 떼기"로 "기록:"으로 시작하는 태그를 한꺼번에 뗄 수 있습니다.`]]},{example:(0,p.jsxs)(p.Fragment,{children:[`조건 "태그가 있음 [직업] = [어부]" → 직업이 어부일 때만. 본문에서 `,(0,p.jsx)(q,{children:`{tag('직업')}`}),`로 값을 넣을 수 있습니다.`]})}]},{id:`inventory`,group:`규칙`,title:`인벤토리 (아이템 · 상태 · 기타)`,screen:`inventory`,summary:`플레이어가 가지거나 걸리는 모든 것을 한 목록에서 만들고, 종류와 "가지고 있는 동안의 효과"를 정합니다.`,parts:[{what:`＋ 요소로 하나 만든 뒤 설정 맨 위의 「종류」에서 아이템·상태·기타 중에 고릅니다. 종류는 나중에 바꿀 수 있습니다. 목록은 종류별로 묶여 보입니다.`},{title:`종류`,items:[[(0,p.jsx)(J,{children:`아이템`}),`개수가 있는 소지품. 소지품 창에 보이고, 플레이어가 직접 쓰게 할 수 있습니다(사용 조건·1개 소모·사용 효과).`],[(0,p.jsx)(J,{children:`상태`}),`부상·감기·축복처럼 한동안 이어지는 효과. 성격(이로움/해로움), 지속 턴, 최대 중첩이 있고, 지속 턴이 다 되면 저절로 풀립니다.`],[(0,p.jsx)(J,{children:`기타`}),`화면에 드러나지 않는 표식. 소지품 창에 보이지 않고, 가지고 있는 동안의 효과만 조용히 적용합니다. 호감·칭호처럼 "있기만 해도 효과가 있는 것"에 씁니다.`]]},{title:`가지고 있는 동안의 효과 (모든 종류 공통)`,items:[[(0,p.jsx)(J,{children:`시간이 흐를 때마다 (상태)`}),`상태 전용(「세부 설정」 안). 시간 단위(년·월·일)가 하나 지날 때마다 실행할 블록. 턴 끝 효과와 달리 한 턴에 시간이 여러 단위 흐르면 그만큼 여러 번 실행됩니다. 아이템·기타로 바꾸면 없어집니다.`],[(0,p.jsx)(J,{children:`변수 보정`}),`가지고 있는 동안 변수를 읽을 때만 더해지는 값. 예: 부적을 가지면 행운 +1. 원래 값은 그대로이고, 잃으면 사라집니다. 상태는 겹친 수만큼 곱해집니다.`],[(0,p.jsx)(J,{children:`매 턴 끝에`}),`가지고 있는(걸려 있는) 동안 턴이 끝날 때마다 실행할 블록. 예: 중독이면 체력 -1, 금화 주머니가 있으면 이자 +5. 아이템은 개수와 상관없이 한 번 실행됩니다.`],[(0,p.jsx)(J,{children:`처음 가지게 될 때 / 걸릴 때`}),`없던 것이 처음 생기는 순간 한 번 실행할 블록(「세부 설정」 안). 이미 가진 것을 더 얻을 때는 실행되지 않습니다.`],[(0,p.jsx)(J,{children:`모두 잃을 때 / 풀릴 때`}),`하나도 없게 되는 순간(상태는 지속 턴이 다 되어 풀리는 순간) 한 번 실행할 블록.`]]},{title:`종류별 칸`,items:[[(0,p.jsx)(J,{children:`최대 소지 수`}),`아이템·기타: 이보다 많이 가질 수 없습니다.`],[(0,p.jsx)(J,{children:`지속 턴 / 최대 중첩 / 성격`}),`상태 전용.`],[(0,p.jsx)(J,{children:`플레이어가 직접 사용할 수 있음`}),`아이템 전용. 켜면 소지품 창에 「사용」 버튼이 생깁니다.`],[(0,p.jsx)(J,{children:`소지품 창에 숨김 / 상태창에 숨김`}),`효과는 그대로 두고 화면에서만 감춥니다. 「기타」는 처음부터 숨겨져 있습니다.`]]},{title:`종류를 바꾸면`,items:[[(0,p.jsx)(J,{children:`아이템 ↔ 기타`}),`표시만 바뀝니다. 설정은 그대로 남습니다.`],[(0,p.jsx)(J,{children:`아이템/기타 ↔ 상태`}),`다른 목록으로 옮겨 담습니다. 이름·설명·변수 보정·매 턴 끝 효과는 가져가고, 「처음 가질 때」는 「걸릴 때」로, 「모두 잃을 때」는 「풀릴 때」로 옮겨집니다. 지속 턴·최대 중첩·사용 설정처럼 그 종류에만 있는 값은 없어집니다.`]]},{title:`플레이 화면에서는`,items:[[(0,p.jsx)(J,{children:`인벤토리 창`}),`플레이 화면 위쪽 버튼 하나로 열립니다. 창 안에서 「아이템」 쪽과 「상태」 쪽을 넘겨 보며 각각 확인합니다(‹ › 또는 탭). 둘 중 하나만 있는 작품에서는 쪽 나눔 없이 그 쪽만 보입니다. 「기타」와 숨김 요소는 나오지 않습니다. 이름은 진행 방식 › 플레이 화면 용어에서 바꿉니다.`]]},{note:`아이템과 상태는 조건·블록에서 쓰는 방식이 다릅니다("가지고 있음" ↔ "걸려 있음"). 아이템↔상태로 바꾸면 그것을
