 가려운`,text:`당신은 성광회 수도원에서 빛의 교리를 외우며 컸습니다. 어느 밤 어떤 질문을 했고, 다음 날 아침 문이 닫혔습니다. 낙인은 쇄골 아래에 남았습니다.`,do:[H(`이성`,1),H(`교단`,2),U(`출신`,`'수련사제'`),ec(`성수병`,1,!0),ec(`낙인`,1,!0)]},{id:`beyond`,title:`재 너머에서 온 사람`,summary:`(해금) 한 번 이 도시를 지나간 이의 후손`,unlock:`achieved('반달의점원')`,text:`당신은 연기 천장 너머, 아직 해가 있다는 땅에서 왔습니다. 도시 사람들은 당신의 발밑을 한 번씩 훔쳐봅니다. 그림자가 너무 선명하다는 듯이.`,do:[H(`감정`,2),U(`출신`,`'재너머'`),ec(`손등불`,1,!0)]}]},events:[{id:`arrive`,title:`반쪽 달`,text:`재가 내립니다. 하늘 대신 도시를 덮은 연기 천장 아래로, 눈송이 같은 재가 가스등 불빛을 가로질러 떨어집니다. 아슈렐에서는 이것을 '낮'이라고 부릅니다.

{if has('출신', '쥐굴')}하수로의 비릿한 냄새가 여기까지 따라옵니다.{elif has('출신', '몰락귀족')}가문의 문장이 박힌 외투 깃이 재에 젖어 무겁습니다.{elif has('출신', '수련사제')}쇄골 아래 낙인이 이 도시의 습기에 가렵습니다.{else}지나가는 사람마다 당신의 발밑을 흘끔 봅니다. 그림자가 너무 선명하다는 듯이.{/if}
무두질 골목 막다른 곳, 문패 없는 가게. 유리창에 반쪽짜리 달이 그려져 있습니다. 전당포 〈반달〉.`,record:{text:`반달 전당포의 점원이 되었다`,importance:3},choices:[{text:`문을 열고 들어간다`,outcome:{text:`문종이 한 번 울렸습니다. 카운터 뒤에서 등이 굽은 노파가 안경 너머로 당신을 올려다봅니다. 손가락마다 반지 자국이 하얗게 남아 있습니다.

둘. 이름은 받지 않는다. 이름을 받은 가게는 사람을 잃는다.

"만지지는 말게." 노파가 뒤에서 말했습니다. "맡긴 이들이 아직 안에 있으니까." 어느 병 속에서 무언가 몸을 돌렸습니다.`,do:[H(`이성`,-1)]}}]}}]},{id:`ledger`,title:`찢긴 장부`,pool:`주요`,fixed:!0,chokepoint:!0,priority:5,when:`밤 >= 1`,text:`첫 밤. 노파가 잠든 뒤 당신은 장부를 펼쳤습니다. 선대 점원 이안의 필체는 마지막 쪽에 가까워질수록 흔들립니다. 맨 뒤 석 장은 칼로 도려낸 듯 찢겼고, 책등 안쪽에는 무언가 눌려 있습니다.`,record:{text:`찢긴 장부에서 전임자의 흔적을 찾았다`,importance:3},choices:[{text:`찢긴 자국을 감정한다`,check:{skill:`감정`,difficulty:2},success:{text:`눌린 글씨가 빛 아래서 살아났습니다. "마지막 저당물 — 이름 없음. 맡긴 이 — 오르다 마드." 그 아래 한 줄. "기한은 열두 번째 밤."
등골이 서늘해졌습니다. 이 장부에서 '맡긴 이'는 손님이 아니라 주인이었습니다.`,do:[H(`진실`,2),U(`단서:장부`)]},failure:{text:`글씨를 따라가는데, 눌린 자국이 움직였습니다. 아니, 움직인다고 믿고 싶지 않았습니다. 잉크가 거미 다리처럼 책장을 기어 올라왔습니다.`,do:[H(`이성`,-1),tc(`속삭임`)]}},{text:`책등 안쪽을 더듬는다`,outcome:{text:`가죽 안쪽에서 뼈로 깎은 열쇠 하나가 굴러 나왔습니다. 이빨 자국처럼 오톨도톨한 날. 이안이 목에 걸고 다니던 것이라는 걸, 어째서인지 알 수 있었습니다.`,do:[ec(`뼈열쇠`),H(`진실`,1),U(`단서:열쇠`)]}},{text:`못 본 척 덮고 장부 정리만 한다`,outcome:{text:`보지 않는 편이 안전한 것도 있습니다. 장부의 숫자만 가지런히 맞추자 노파가 아침에 은화 몇 닢을 던져 주었습니다.`,do:[H(`은화`,8)]}}]},{id:`inspector`,title:`등불세`,pool:`주요`,fixed:!0,priority:4,when:`밤 >= 3`,text:`낮은 종소리가 세 번. 성광회의 흰 사제복이 문턱을 넘었습니다. 은빛 인장 반지를 낀 세무 사제 베르나가 장부를 내밀었습니다.
"등불세입니다. 이 가게는 석 달째 밀렸군요. 은화 서른, 혹은 그림자 하나. 도시의 불은 공짜로 켜지지 않으니까요." 사제는 당신의 발밑을 한 번, 아주 오래 보았습니다.`,record:{text:`성광회의 등불세 징수를 맞았다`,importance:3},choices:[{text:`은화 서른을 낸다`,requires:`은화 >= 30`,outcome:{text:`은화가 쟁반 위에서 맑은 소리를 냈습니다. 베르나는 만족스러운 얼굴로 인장을 찍었습니다. "빛은 성실한 자를 기억합니다."`,do:[H(`은화`,-30),H(`교단`,1)]}},{text:`그림자 하나를 바친다`,requires:`그림자 >= 3`,outcome:{text:`바닥에 드리운 그림자가 사제의 은 가위 아래서 한 겹 벗겨졌습니다. 아프지 않았습니다. 그게 가장 무서웠습니다.`,do:[H(`그림자`,-1),H(`교단`,2),U(`바침`)]}},{text:`"규정 몇 조에 따른 세금입니까?"`,check:{skill:`언변`,difficulty:2},success:{text:`사제의 입꼬리가 한쪽만 올라갔습니다. "…이 가게의 점원은 글을 읽는군요. 이번 달은 유예합시다." 인장이 장부 모서리에만 찍혔습니다.`,do:[H(`교단`,-1),H(`진실`,1),U(`단서:세`)]},failure:{text:`"성광회의 규정을 묻는 것은 성광회를 묻는 것입니다." 사제가 짧게 말했습니다. 은화 열다섯이 쟁반으로 끌려갔고, 당신의 이름이 어딘가 적혔습니다.`,do:[H(`은화`,-15),H(`교단`,-1)]}},{text:`낙인을 받고 보호를 청한다`,requires:`item('낙인') = 0`,outcome:{text:`쇄골 아래 살갗이 은 도장 아래서 지글거렸습니다. 베르나가 낮게 성가를 읊었습니다. "이제 당신은 빛의 장부에 올랐습니다. 빛은 때로 놓지 않습니다."`,do:[ec(`낙인`,1,!0),H(`교단`,3),H(`체력`,-1)]}}]},{id:`rat_king`,title:`쥐왕의 부탁`,pool:`주요`,fixed:!0,priority:3,when:`밤 >= 4`,text:`선반 뒤 벽이 열렸습니다. 쥐굴 조합의 우두머리 '쥐왕' 하이가 젖은 외투를 털며 들어왔습니다. 몸집은 어린아이 같고 눈빛은 늙었습니다.
"점원 양반, 야경대가 압수한 시계가 이 가게 창고에 들어와 있을 거요. 그걸 나흘 안에 우리 손으로 돌려주쇼. 값은 쳐 드리지." 하이가 손가락 두 개를 폈습니다. "그리고 뼈 열쇠가 어디 맞는 자물쇠인지, 우린 알지."`,record:{text:`쥐굴의 우두머리가 가게를 찾아왔다`,importance:3},choices:[{text:`시계를 몰래 넘긴다`,outcome:{text:`진열장 뒤에서 시계를 꺼내 쥐왕의 소매에 밀어 넣었습니다. 하이가 이빨 빠진 웃음을 지었습니다. "하수로 지도도 한 장 얹어 드리지. 반달 아래, 지하로 통하는 길이오."`,do:[H(`쥐굴`,3),H(`교단`,-1),H(`은화`,25),U(`하수길`)]}},{text:`값을 올려 흥정한다`,check:{skill:`언변`,difficulty:2},success:{text:`하이가 눈을 가늘게 떴다가 낄낄 웃었습니다. "이 점원 물건이군." 은화 주머니가 두 배로 묵직해졌습니다.`,do:[H(`쥐굴`,1),H(`은화`,`30 + 언변 * 5`),U(`하수길`)]},failure:{text:`"탐욕은 쥐굴에서도 미움받소." 하이가 일어났습니다. 문 닫히는 소리와 함께 누군가 당신의 이름을 벽에 긁었습니다.`,do:[H(`쥐굴`,-1),tc(`추적`)]}},{text:`"가게의 규칙입니다. 맡긴 것은 넘기지 않습니다."`,outcome:{text:`하이는 한동안 말이 없었습니다. "규칙이라. 좋은 단어지. 오래 못 가는 단어이기도 하고." 쥐왕은 오지 않은 사람처럼 벽 속으로 사라졌습니다.`,do:[H(`쥐굴`,-2),H(`교단`,1),H(`진실`,1),U(`단서:규칙`)]}}]},{id:`masked_lady`,title:`가면 쓴 손님`,pool:`주요`,fixed:!0,priority:3,when:`밤 >= 5`,text:`비단 가면에 진주 눈물이 달린 여인이 장갑 낀 손으로 반지 하나를 올려놓았습니다. 달빛 같은 청보석이 박힌 반지. {tag('소문', '어디선가')}에서 본 적 있는 세공입니다.
"감정해 줘요. 그리고 이 반지에 새겨진 이름을 지워 줘요. 값은 후하게." 여인의 목소리는 웃는 것도 우는 것도 아니었습니다.`,record:{text:`가면 쓴 여인이 이름이 새겨진 반지를 맡기려 했다`,importance:3},choices:[{text:`반지를 감정한다`,check:{skill:`감정`,difficulty:2},success:{text:`청보석 뒷면에 아주 작은 문장이 있었습니다. 붉은 야회의 마크. 이 반지의 주인은 야회의 후작이었습니다. 시세는 {lookup('시세', '반지', '값')}은화, 하지만 이름이 지워진 반지는 그 열 배.
여인이 가면 아래에서 웃었습니다. "눈이 좋군요." 핏빛 봉랍이 찍힌 초대장이 카운터 위에 놓였습니다. "내일모레 밤, 야회에서 뵙죠."`,do:[ec(`초대장`,1,!0),H(`야회`,2),H(`진실`,1),U(`단서:반지`)]},failure:{text:`보석을 들여다보는 순간 보석이 당신을 들여다보았습니다. 눈을 뗄 때는 이미 이마에 식은땀이 흘렀습니다. 여인은 아무 말 없이 반지를 도로 가져갔습니다.`,do:[H(`이성`,-2),H(`야회`,-1)]}},{text:`이름 지우기를 거절한다 (규칙 2)`,outcome:{text:`"이름은 받지 않는 것이 이 가게의 규칙입니다." 여인은 가면 속에서 오래 숨을 골랐습니다. "그 규칙, 누가 정했는지 아세요?" 그리고 그녀는 대답을 기다리지 않고 나갔습니다.`,do:[H(`야회`,-1),H(`교단`,1),U(`단서:규칙`)]}},{text:`이름을 지우고 보수를 받는다`,outcome:{text:`지우개로 지울 수 있는 것이 아니었습니다. 당신은 자기 이름의 한 글자를 대신 내주었습니다. 그림자가 한 겹 가벼워졌습니다. 은화 주머니는 무거웠습니다.`,do:[H(`은화`,80),H(`그림자`,-1),H(`야회`,2),ec(`초대장`,1,!0),U(`이름팔림`)]}}]},{id:`cellar`,title:`지하 창고`,pool:`주요`,fixed:!0,priority:3,when:`밤 >= 6`,text:`카운터 뒤, 낡은 양탄자 아래에 철문이 있었습니다. 문 한가운데에 뼈 열쇠와 똑같은 모양의 구멍.
문틈에서 푸른 빛이 샙니다. 지하에서 올라오는 냉기가 발목을 휘감았습니다. 노파의 코고는 소리가 위층에서 규칙적으로 들립니다.`,record:{text:`전당포 지하에 내려갔다`,importance:4},choices:[{text:`뼈 열쇠로 문을 연다`,requires:`item('뼈열쇠') > 0`,outcome:{goto:`cellar_inside`,do:[H(`이성`,-1)]}},{text:`하수로 길로 돌아 내려간다`,requires:`has('하수길')`,outcome:{text:`쥐왕이 준 지도를 따라 하수구 철창을 넘었습니다. 진흙과 쥐 떼 사이를 지나 지하 창고 뒷문으로 올라왔습니다.`,do:[H(`체력`,-1)],goto:`cellar_inside`}},{text:`문을 억지로 비튼다`,check:{skill:`담력`,difficulty:3},success:{text:`경첩이 비명을 지르며 휘어졌습니다. 열린 틈으로 푸른 빛이 쏟아졌습니다.`,do:[H(`체력`,-1)],goto:`cellar_inside`},failure:{text:`쇠가 손바닥을 물었습니다. 뼈가 울리는 소리가 위층에서 났습니다. 노파의 코골이가 멎었습니다.`,do:[H(`체력`,-2),tc(`부상`),H(`진실`,0)],goto:`cellar_retreat`}},{text:`내려가지 않는다`,outcome:{text:`문은 내일도 거기 있을 것입니다. 하지만 당신은 오늘 밤 내내 문 아래서 누가 올라오는 소리를 들었습니다.`,do:[H(`이성`,-1),tc(`속삭임`)],goto:`cellar_retreat`}}]},{id:`cellar_retreat`,title:`물러난 뒤`,text:`당신은 문 앞에서 물러났습니다. 지하는 아직 기다립니다. 그리고 위층의 노파는 이제 당신이 무엇을 하려 했는지 알고 있을 것입니다.`,choices:[{text:`계단 아래를 잠시 바라본다`,outcome:{text:`푸른 빛이 한 번 깜빡였습니다. 문틈에서 아이 웃음소리 같은 것이 새어 나왔다가, 사라졌습니다.`,do:[H(`이성`,-1),U(`지하들킴`)]}}]},{id:`cellar_inside`,title:`그림자의 서가`,text:`선반이 끝없이 이어집니다. 칸칸이 유리병, 병마다 일렁이는 그림자. 이름표에는 번호와 날짜만 적혀 있습니다. 가장 오래된 병은 백오십 년 전 것입니다.

벽을 따라 구리 파이프가 올라갑니다. 천장 너머, 도시의 가스등으로 이어지는. 파이프 안에서 졸졸, 무언가 흐르는 소리.
"그래서 불이 안 꺼지는 거야." 어딘가에서 속삭이는 소리가 들렸습니다. "그림자는 오래 타거든."`,record:{text:`가스등이 사람의 그림자로 타오른다는 것을 알았다`,importance:5},choices:[{text:`병 하나를 열어 본다`,outcome:{text:`코르크를 뽑자 어린 목소리가 흘러나왔습니다. "엄마… 나 아직 여기 있어." 그림자가 병 안에서 작은 손을 들었습니다. 이름표에는 '열두 살, 폐병, 쥐굴 하수로 거주'.`,do:[H(`이성`,-2),H(`진실`,2),U(`단서:그림자병`),tc(`속삭임`)],choices:[{text:`병을 가방에 넣는다`,outcome:{text:`아무도 모르게 병을 품에 넣었습니다. 훔치는 것이 아닙니다. 되돌려 주기 전에 맡아 두는 것입니다.`,do:[ec(`그림자병`,1,!0),H(`교단`,-1)]}},{text:`병을 도로 닫고 나온다`,outcome:{text:`코르크를 눌러 닫았습니다. 안에서 누가 우는 것 같았지만, 지금은 아무것도 할 수 없었습니다.`}}]}},{text:`파이프를 따라 위로 올라간다`,check:{skill:`감정`,difficulty:2},success:{text:`파이프는 전당포 벽을 지나 골목의 가스등 기둥으로, 다시 도시 전체의 등으로 가지를 쳤습니다. 이 가게는 도시의 불의 뿌리였습니다.
가장 굵은 줄기는 광장 한복판, 대등불 쪽으로 곧장 뻗었습니다.`,do:[H(`진실`,2),U(`단서:뿌리`)]},failure:{text:`파이프를 짚은 손에서 누군가의 기억이 흘러들었습니다. 박수 소리, 아이 웃음, 이름을 부르는 목소리. 그리고 전부 거꾸로 빨려 나갔습니다.`,do:[H(`이성`,-2),tc(`그늘`)]}},{text:`서둘러 올라간다`,outcome:{text:`더 있으면 돌아오지 못할 것 같았습니다. 계단을 오르는 동안 등 뒤에서 병들이 일제히 몸을 돌리는 소리가 났습니다.`,do:[H(`이성`,-1)]}}]},{id:`masquerade`,title:`붉은 야회`,pool:`주요`,fixed:!0,priority:3,when:`밤 >= 7`,text:`지붕이 유리로 된 저택. 연기 천장이 가장 가까이 내려앉은 부촌의 맨 위, 붉은 야회가 열리는 곳입니다. 손님들은 모두 가면을 썼고, 아무도 잔을 비우지 않는데 잔은 늘 붉습니다.
악단이 느린 왈츠를 연주합니다. 박자마다 누군가 한 명씩 웃음을 멈춥니다.
{if item('초대장') > 0}손에 쥔 초대장이 땀에 젖었습니다.{else}초대장 없이 어떻게든 들어왔습니다. 하인의 시선이 등에 꽂힙니다.{/if}`,record:{text:`붉은 야회에 발을 들였다`,importance:4},choices:[{text:`주최자 세레나 백작과 춤춘다`,requires:`item('초대장') > 0 or 언변 >= 3`,outcome:{text:`세레나 백작이 장갑 낀 손을 내밀었습니다. 얼굴은 서른 살처럼 보이는데 손은 차갑고 가벼웠습니다.
"{$이름}{이라/라}고요? 반달 가게의 새 점원. 노파가 당신을 아주 오래 기다렸지." 백작이 귀에 속삭입니다. "내가 도울 수 있어요. 대등불을 켜 둔 건 성광회지만, 불을 먹는 건 우리거든."`,do:[U(`백작과만남`)],choices:[{text:`손을 잡는다`,outcome:{text:`손을 잡자 몸속으로 열기가 번졌습니다. 붉은 잔이 당신 앞에 놓였습니다. 한 모금, 그 정도는 괜찮겠지 싶었습니다.`,do:[H(`야회`,3),tc(`재열`),H(`그림자`,-1),U(`야회의잔`)]}},{text:`정중하게 정보를 캐낸다`,check:{skill:`언변`,difficulty:3},success:{text:`백작은 흥미로운 장난감을 본 얼굴로 입을 열었습니다. "열두 번째 밤, 대등불의 심지가 갈려. 그때 지하의 그림자 병들이 한꺼번에 빠져나가지. 막으려는 자와 먹으려는 자가 모일 거야."`,do:[H(`진실`,2),H(`야회`,1),U(`단서:열두번째밤`)]},failure:{text:`"재미없는 아이." 백작이 손을 놓았습니다. 어디선가 하인이 다가와 당신을 출구 쪽으로 이끌었습니다.`,do:[H(`야회`,-1)]}},{text:`거절하고 물러난다`,outcome:{text:`백작은 한 번도 웃지 않고 당신을 놓아주었습니다. 뒷모습에 닿는 시선이 쇠처럼 무거웠습니다.`,do:[H(`야회`,-2)]}}]}},{text:`야회 사람들 틈에서 귀를 연다`,check:{skill:`감정`,difficulty:2},success:{text:`가면 아래 목소리들이 겹쳐졌습니다. "…등불세는 사실 성광회 몫이 아니라던데." "…이백 년 전 계약이…" 몇 마디가 귀에 걸렸습니다.`,do:[H(`진실`,1),U(`단서:계약`)]},failure:{text:`누군가 팔을 잡았습니다. "당신, 그림자가 너무 진한데?" 웃음소리가 한꺼번에 당신을 향했습니다. 도망치듯 빠져나왔습니다.`,do:[H(`이성`,-1),H(`그림자`,0)]}},{text:`정원 쪽으로 빠져나간다`,outcome:{text:`정원에는 아무도 없었습니다. 장미는 피처럼 붉었고, 분수는 물 대신 재를 뿜었습니다. 돌아오는 길에 어깨 위로 박쥐 같은 것이 한 번 지나갔습니다.`,do:[H(`체력`,-1)]}}]},{id:`former_clerk`,title:`문 두드리는 소리`,pool:`주요`,fixed:!0,priority:3,when:`밤 >= 9`,text:`쾅, 쾅, 쾅.
달은 반쪽입니다. 규칙 셋. 무슨 소리가 나도 열지 않는다.
문 아래로 푸른 빛이 번졌습니다. 목소리는 낮고 갈라졌고, 어딘가 익숙했습니다. "열어 줘, 새 점원. 나야. 이안이야. 나, 아직 여기 있어."`,record:{text:`전임자가 문 앞에 돌아왔다`,importance:5},choices:[{text:`문을 연다`,outcome:{text:`문밖에는 그림자가 없는 남자가 서 있었습니다. 가스등 불빛을 그대로 받으면서도 발밑이 하얗게 비어 있었습니다. 얼굴만은 장부 속 필체처럼 지쳐 있었습니다.
"고맙다. 열두 번째 밤이 오기 전에 말해 줘야 했어." 이안이 문턱 안으로 들어서며 낮게 웃었습니다. "이 도시의 불은… 우리 거야."`,do:[H(`이성`,-1),U(`이안만남`)],choices:[{text:`모든 것을 말해 달라고 한다`,outcome:{text:`이안은 단숨에 이야기했습니다. 이백 년 전 계약. 불을 꺼뜨리지 않는 대가로 성광회가 매달 걷는 그림자. 전당포는 그 그림자를 보관하고 가스관에 흘려보내는 도시의 심장이라는 것. 그리고 오르다 마드가 이 도시에서 가장 오래된 '저당물'이라는 것.`,do:[H(`진실`,2),U(`단서:이안의말`)]}},{text:`"왜 돌아왔어요?"`,requires:`진실 >= 3`,requiresText:`충분한 단서가 있어야 물을 수 있다`,outcome:{text:`이안의 눈에서 처음으로 사람 같은 빛이 일었습니다. "자네가 나보다 먼저 알아냈군. 그럼 얘기가 빠르지. 부탁이 하나 있어. 열두 번째 밤, 광장에서 등불 아래 서 줘. 나는 못 서. 그림자가 없으니까."`,do:[H(`진실`,1),U(`이안의부탁`),U(`자비`)]}},{text:`일단 가게 안으로 들인다`,outcome:{text:`이안은 구석 의자에 앉아 말없이 병들을 바라보았습니다. 새벽까지 그는 한 번도 눈을 감지 않았습니다.`,do:[H(`이성`,1),U(`이안보호`)]}}]}},{text:`열지 않고 문틈으로 이야기한다`,outcome:{text:`"그럼 이것만 받아 줘." 문 아래로 접힌 종이 한 장이 밀려 들어왔습니다. 이안의 필체로, 지하 서가의 위치와 한 줄. "열두 번째 밤에 대등불을 끄지 마. 대신 병을 돌려줘."`,do:[H(`진실`,1),U(`이안의쪽지`)]}},{text:`귀를 막고 이불을 뒤집어쓴다`,outcome:{text:`노크는 날이 밝을 때까지 이어졌습니다. 문을 열지 않은 것이 옳았는지 그른지는 아무도 말해 주지 않았습니다.`,do:[H(`이성`,-2),tc(`속삭임`)]}}]},{id:`orda_truth`,title:`노파의 고백`,pool:`주요`,fixed:!0,priority:3,when:`밤 >= 10`,text:`노파가 처음으로 가게 문을 일찍 닫았습니다. 난롯불이 그녀의 안경에 작게 비쳤습니다. 손에는 이안의 장부 찢긴 쪽 세 장이 들려 있었습니다.
"{$이름}{아/야}. 오늘은 규칙을 어길 거야. 내가 말하는 건 맡긴 사람의 것이 아니라 내 것이니까."`,record:{text:`오르다 마드의 고백을 들었다`,importance:5},choices:[{text:`잠자코 듣는다`,outcome:{text:`"이백 년 전, 도시가 마지막 해를 잃던 해에 나는 스무 살이었어. 성광회가 제안했지. 등불을 영원히 켜 두는 대신, 도시 사람들의 그림자를 조금씩 맡기자고. 나는 그 보관인으로 서명했어. 대가로 내 이름을 맡겼고." 노파가 손가락의 반지 자국을 쓸었습니다. "그래서 나는 죽지 못해. 이 가게가 선 한, 도시의 불이 꺼지지 않는 한."`,do:[H(`진실`,2),U(`단서:오르다`)],choices:[{text:`"어떻게 하면 끝낼 수 있죠?"`,outcome:{text:`"나를 이어받거나, 불을 끄거나, 그림자를 돌려주거나." 노파가 손가락 세 개를 폈습니다. "셋 다 대가가 있어. 어느 것이 옳은지 나는 이백 년이 지나도 모르겠다."`,do:[H(`진실`,1)]}},{text:`"당신 자리를… 잇겠습니다."`,outcome:{text:`노파는 오래 침묵했습니다. 그러다 안경을 벗었습니다. 눈동자가 의외로 젊었습니다. "…네가 이렇게 말하는 날이 올 줄은 몰랐다. 거절해도 돼. 거절하는 편이 좋을 거다."`,do:[U(`후계제안`),H(`이성`,-1)]}},{text:`아무 말도 하지 못한다`,outcome:{text:`난롯불이 낮아졌습니다. 노파가 낮게 웃었습니다. "그래, 그게 정상이야."`,do:[H(`이성`,-1)]}}]}},{text:`"왜 하필 저한테 말하죠?"`,outcome:{text:`"네 그림자가 아직 짙으니까." 노파가 지팡이 끝으로 당신의 발밑을 가리켰습니다. "그리고 이안이 못 한 말을 네가 할 수 있을지 보고 싶었어."`,do:[H(`진실`,1),H(`이성`,1)]}}]},{id:`siege`,title:`세 개의 초인종`,pool:`주요`,fixed:!0,priority:4,when:`밤 >= 11`,text:`열한 번째 밤, 가게의 종이 한꺼번에 세 번 울렸습니다.
정문에는 성광회의 흰 사제들과 철제 가면의 호위. 뒷문에는 쥐굴 조합의 굶주린 얼굴들. 지붕 위에는 붉은 야회의 박쥐 같은 그림자들.
모두 대등불의 심지가 갈리는 내일 밤 전에, 이 가게의 지하를 원합니다. 노파는 계단 위에서 지팡이를 짚고 서 있습니다. "누구 편을 들지는 네가 정해, {$이름}{아/야}."`,record:{text:`세 세력이 한꺼번에 가게를 포위했다`,importance:5},choices:[{text:`성광회에 문을 연다`,requires:`교단 >= 1`,outcome:{text:`사제들이 지하로 내려가려 하자 노파가 가로막았습니다. 사제 베르나가 은빛 사슬을 감았습니다. 노파의 입에서 비명이 났습니다. 당신은 눈을 감았습니다.`,do:[H(`교단`,2),H(`쥐굴`,-3),H(`야회`,-2),H(`체력`,-2),U(`편:교단`)]}},{text:`쥐굴을 하수로로 들인다`,requires:`쥐굴 >= 1`,outcome:{text:`뒷문 빗장을 풀자 쥐굴 조합이 그림자처럼 스며들었습니다. 하이가 지하 문 앞에 서서 낮게 말했습니다. "우리 애들 병은 우리가 가져가오."`,do:[H(`쥐굴`,2),H(`교단`,-3),H(`체력`,-1),U(`편:쥐굴`)]}},{text:`야회를 지붕으로 들인다`,requires:`야회 >= 1`,outcome:{text:`지붕 창을 열자 붉은 안개가 방 안으로 내려앉았습니다. 세레나 백작이 가볍게 착지했습니다. "현명하군요. 내일 밤 불이 갈릴 때, 우리가 먼저 마실 거예요."`,do:[H(`야회`,2),H(`교단`,-2),H(`이성`,-2),U(`편:야회`)]}},{text:`누구에게도 문을 열지 않고 버틴다`,check:{skill:`담력`,difficulty:3,bonus:`item('은단검') > 0 ? 10 : 0`},success:{text:`당신은 계단 위에 서서 양쪽 문의 빗장을 지켰습니다. 한 시간. 두 시간. 새벽이 되자 세 쪽 모두 물러갔습니다. 서로를 믿지 못해서였습니다.`,do:[H(`체력`,-2),U(`편:없음`),ic(`세 세력을 홀로 막아섰다`,5),(e=>({do:`achieve`,id:e}))(`세력무관`)]},failure:{text:`빗장이 부서졌습니다. 세 세력이 한꺼번에 밀려 들어왔고, 당신은 계단 아래로 굴렀습니다. 누군가 어깨를 눌렀습니다. 한참 뒤에야 노파가 소리쳤습니다. "그만!"`,do:[H(`체력`,-4),tc(`부상`),U(`편:없음`)]}},{text:`지하로 내려가 병을 지킨다`,requires:`has('단서:그림자병')`,outcome:{text:`당신은 세 세력이 문을 두드리는 동안 지하로 뛰어내려가 서가 앞에 섰습니다. 병마다 푸른 빛이 맥박처럼 뛰었습니다. 위에서 노파의 목소리가 들렸습니다. "그 병들은 네 몫이다."`,do:[H(`이성`,-2),ec(`그림자병`,2,!0),U(`편:병`),U(`자비`)]}}]},{id:`ember_night`,title:`열두 번째 밤, 대등불`,pool:`주요`,fixed:!0,priority:10,when:`밤 >= 12`,text:`{image square}
재의 축제. 연기 천장 아래, 광장 한가운데 대등불이 서 있습니다. 쇠 기둥 끝 유리 심장에서 이백 년째 꺼지지 않은 불이 일렁입니다. 오늘 밤 심지가 갈립니다.
{if has('이안의부탁')}군중 사이에서 그림자 없는 남자가 손을 들어 보입니다.{/if}{if has('편:교단')}성광회 사제들이 은빛 성가대 줄을 서 있습니다.{elif has('편:쥐굴')}군중 가장자리에서 쥐굴의 눈들이 반짝입니다.{elif has('편:야회')}지붕 위에서 붉은 박쥐 같은 것들이 내려다봅니다.{/if}
광장의 모든 가스등이 일제히 깜빡입니다. 그림자 한 겹이 누구 발밑에서든 빠져나가려는 듯 가늘게 떨립니다.`,record:{text:`열두 번째 밤, 대등불 앞에 섰다`,importance:5},choices:[{text:`그림자 병을 풀어 주인에게 돌려준다`,requires:`item('그림자병') > 0 and has('단서:그림자병')`,outcome:{text:`품속의 병을 하나씩 열었습니다. 푸른 연기 같은 그림자들이 광장으로 퍼졌습니다. 군중 속에서 누군가 비명을 질렀고, 누군가 무릎을 꿇었습니다. 오래전 떠난 그림자가 발밑으로 돌아오는 감촉.`,do:[H(`그림자`,1),H(`이성`,-1)],choices:[{text:`대등불에 병을 모두 쏟는다`,outcome:{text:`대등불이 한 번 크게 일렁이더니 푸른빛으로 바뀌었습니다. 불은 꺼지지 않았지만, 더는 누구의 그림자도 먹지 않았습니다.`,do:[ac(`returned`)]}},{text:`대등불은 그대로 두고 물러난다`,outcome:{text:`병들을 돌려주는 동안에도 불은 타올랐습니다. 아침이 오기 전에 당신은 이미 도시의 적이 되어 있었습니다.`,do:[ac(`wanted`)]}}]}},{text:`대등불의 심지를 끊어 도시를 진짜 밤에 맡긴다`,requires:`진실 >= 5 and (item('뼈열쇠') > 0 or has('이안의쪽지'))`,outcome:{text:`뼈 열쇠가 대등불 기둥의 작은 구멍에 맞았습니다. 열쇠가 돌아가는 순간 도시의 모든 가스등이 한꺼번에 숨을 멈췄습니다. 광장이 어둠에 잠겼습니다. 아주 오랜만에, 처음으로, 사람들의 눈이 어둠을 보았습니다.
노파의 목소리가 어딘가에서 들렸습니다. "…고맙다."`,do:[ac(`darkness`)]}},{text:`대등불을 지킨다 — 누구와 함께?`,outcome:{text:`당신은 대등불 기둥 앞에 서서 팔을 벌렸습니다. 누가 오든 오늘 밤 불은 꺼지지 않을 것입니다. 하지만 이 불을 누가 지켜야 하는가?`,choices:[{text:`성광회와 함께`,requires:`교단 >= 2`,outcome:{text:`베르나 사제가 인장 반지를 들어 올렸습니다. 사제단이 당신 곁에 섰습니다. 군중은 성가를 부르기 시작했습니다. 이 불을 위해 그림자를 내는 것은 이제 시민의 의무가 됩니다.`,do:[ac(`order`)]}},{text:`붉은 야회와 함께`,requires:`야회 >= 3`,outcome:{text:`세레나 백작이 당신 옆으로 내려섰습니다. "밤은 우리 몫이지요." 대등불이 붉게 물들었습니다. 이 도시는 이제 낮이 아니라 밤에 속한 것입니다.`,do:[ac(`night_court`)]}},{text:`혼자서`,outcome:{text:`당신은 혼자 불을 지켰습니다. 한 시간은 그럭저럭, 두 시간째에 이성이 갈라졌습니다. 가스등마다 누군가 당신 이름을 불렀습니다.`,do:[H(`이성`,-4)]}}]}},{text:`오르다의 자리를 잇는다`,requires:`has('후계제안')`,outcome:{text:`노파가 군중 뒤에서 걸어 나왔습니다. 처음으로 허리를 펴고, 안경을 벗었습니다. "고맙다, 점원. 아니… 주인." 열쇠고리와 장부가 당신 손에 쥐어졌습니다. 이름을 맡기는 순간 당신의 그림자는 한 번 크게 일렁이다 가게 쪽으로 늘어졌습니다.`,do:[ac(`pawnbroker`)]}},{text:`재의 길로 도시를 떠난다`,outcome:{text:`축제의 환호가 터지는 순간 당신은 광장을 등졌습니다. 골목을 지나, 성벽의 쪽문을 지나, 연기 천장이 끝나는 곳을 향해. 뒤에서 대등불이 한 번 크게 타올랐고, 당신은 돌아보지 않았습니다.`,do:[ac(`ash_road`)]}}]},{id:`breakdown`,title:`벽 속의 목소리`,tone:`negative`,text:`더는 문장이 이어지지 않습니다. 단어들이 입속에서 재가 되어 흩어집니다. 벽 너머의 목소리가 이제는 벽 안쪽에서 들립니다. 아주 친절하게, 이름을 부르며.`,record:{text:`마음의 끝에서 벽 속의 목소리를 들었다`,importance:4},choices:[{text:`성수를 마신다`,requires:`item('성수병') > 0`,outcome:{text:`병을 따자 차가운 물이 목을 적셨습니다. 목소리가 한 걸음 물러났습니다. 한 걸음. 그 정도면 충분했습니다.`,do:[ec(`성수병`,-1,!0),$s(`이성`,4),nc(`속삭임`)]}},{text:`노파의 방문을 두드린다`,outcome:{text:`노파는 말없이 문을 열고 찻잔을 건넸습니다. 차는 쓰고 따뜻했습니다. "나도 처음엔 그랬어. 이백 년쯤 되면 익숙해져." 위로인지 경고인지 구분이 안 됐습니다.`,do:[$s(`이성`,3),H(`빚`,3)]}},{text:`목소리가 시키는 대로 한다`,outcome:{text:`목소리가 시킨 것은 아주 사소한 일이었습니다. 문을 열고, 한 걸음 나가고, 그림자를 한 번 놓아 주는 것.`,do:[ac(`whispered`)]}}]},{id:`seizure`,title:`압류`,tone:`negative`,text:`장부의 숫자가 더는 불어날 곳이 없습니다. 아침에 가게 문을 두드린 것은 철제 가면을 쓴 채권 추심인 둘이었습니다. 이자 장부의 마지막 줄에는 당신의 이름이 또박또박 적혀 있습니다.
"기한이 찼소. 담보는 본인이오."`,record:{text:`빚이 불어나 추심인이 찾아왔다`,importance:4},choices:[{text:`가진 것을 전부 내놓는다`,requires:`은화 >= 30`,outcome:{text:`은화 주머니가 비워졌고 장부의 숫자가 반으로 줄었습니다. 추심인은 "다음 번엔 없소"라는 말을 남겼습니다.`,do:[H(`은화`,-30),$s(`빚`,10)]}},{text:`그림자로 갚는다`,requires:`그림자 >= 2`,outcome:{text:`추심인의 갈고리가 당신 발밑을 훑었습니다. 그림자가 한 겹, 두 겹 떨어져 나가는 대신 빚이 지워졌습니다.`,do:[H(`그림자`,-2),$s(`빚`,0)]}},{text:`담보로 잡힌다`,outcome:{text:`당신은 장부에 서명했습니다. 가게 문이 닫히고, 철제 가면 사이로 낡은 복도가 이어졌습니다.`,do:[ac(`indenture`)]}}]},{id:`thin_shadow`,title:`얇아진 그림자`,tone:`negative`,text:`가스등 아래에서 당신은 발밑을 보았습니다. 그림자가 거의 보이지 않습니다. 지나가던 아이가 당신을 보고 얼어붙었다가 어머니 치마 뒤로 숨었습니다.`,choices:[{text:`그림자 병을 마신다`,requires:`item('그림자병') > 0`,outcome:{text:`병 속의 누군가가 한숨 쉬듯 당신에게 스몄습니다. 발밑이 조금 짙어졌습니다. 이 그림자가 원래 누구의 것이었는지는 생각하지 않기로 했습니다.`,do:[ec(`그림자병`,-1,!0),H(`그림자`,2),U(`빌린그림자`)]}},{text:`이대로 숨어 지낸다`,outcome:{text:`모자를 깊이 눌러쓰고 걸었습니다. 사람들은 당신과 마주치기 전에 길을 비켜 주었습니다. 외로웠지만 안전했습니다.`,do:[H(`이성`,-1)]}}]},{id:`bard`,title:`맹인 악사`,pool:`손님`,once:!0,weight:10,text:`낡은 류트를 멘 맹인 악사가 문을 밀었습니다. 손끝이 현처럼 거칠고, 눈동자는 연기 천장 같은 회색입니다.
"악기가 아니라 노래를 맡기고 싶소. 내 노래는 내가 부르면 사람들을 울리는데, 그 때문에 쫓겨나는 신세가 됐거든."`,choices:[{text:`노래를 사들인다`,requires:`은화 >= 15`,outcome:{text:`악사의 입에서 푸른 음표가 한 줄 흘러나와 병 속으로 들어갔습니다. 당신 마음속에서 오래 잠겨 있던 무언가가 한 번 위로 떠올랐습니다.`,do:[H(`은화`,-15),H(`이성`,2),U(`악사의노래`),ic(`맹인 악사의 노래를 맡아 두었다`,2)]}},{text:`노래를 들어 본다`,check:{skill:`담력`,difficulty:2},success:{text:`악사가 현을 한 번 튕기자 가사가 흘러나왔습니다. "등불 아래 아이들이 잠들면, 불은 아이들의 그림자를 조금 마신다네…" 노래는 거기서 끊겼습니다.`,do:[H(`진실`,1),U(`단서:노래`)]},failure:{text:`선율이 귓속으로 파고들었습니다. 한 소절이 끝나자 눈물이 멎지 않았습니다. 이유도 모른 채 울고 있었습니다.`,do:[H(`이성`,-1),tc(`속삭임`)]}},{text:`정중히 돌려보낸다`,outcome:{text:`악사는 고개를 숙이고 류트를 다시 멨습니다. 문을 나서며 낮게 흥얼거렸습니다. 곡조는 오래 골목에 남았습니다.`}}]},{id:`shadow_child`,title:`그림자를 맡기러 온 아이`,pool:`손님`,once:!0,weight:12,tone:`negative`,text:`카운터 높이에 겨우 이마가 닿는 아이가 은화 대신 자기 발밑을 가리켰습니다. "어, 어머니가 병원에 계세요. 이거면 되죠? 이거 맡기면 돈 주신다고 했어요."
아이의 그림자는 작고 선명했고, 가스등 아래서 아이보다 먼저 들어왔습니다.`,choices:[{text:`"가게 규칙입니다. 안 됩니다."`,outcome:{text:`아이의 눈이 한 번 크게 떠졌습니다. 당신은 은화 열 닢을 쥐여 주려다 가게의 규칙을 떠올렸습니다. 아이는 고개를 숙이고 나가 버렸습니다. 문종이 한 번 울렸습니다.`,do:[H(`교단`,1),U(`아이거절`)]}},{text:`돈을 쥐여 주고 그림자는 받지 않는다`,requires:`은화 >= 20`,outcome:{text:`"이건 맡기는 게 아니라 빌려주는 거야." 아이는 이해하지 못한 얼굴로 은화를 받았습니다. 그림자는 아이의 발밑에 그대로 있었습니다.`,do:[H(`은화`,-20),U(`자비`),ic(`그림자를 맡기러 온 아이에게 돈을 쥐여 보냈다`,3),H(`쥐굴`,1)]}},{text:`그림자를 맡아 준다`,outcome:{text:`아이의 발밑에서 작은 그림자 한 겹이 떨어져 병에 담겼습니다. 아이는 은화 스물다섯 닢을 쥐고 뛰어나갔습니다. 병 속의 그림자는 한동안 문 쪽을 바라보고 있었습니다.`,do:[H(`은화`,-25),ec(`그림자병`,1,!0),H(`이성`,-1)]}}]},{id:`watch_captain`,title:`야경대`,pool:`손님`,once:!0,weight:9,text:`철모에 재가 쌓인 야경대 반장 노르가 영장을 카운터에 던졌습니다. "이 골목 전당포 전부를 수색하고 있다. 쥐굴과 짜고 장물을 다루는 놈이 있다는 신고가 들어왔어."
그의 눈이 선반의 시계들 위에서 느릿하게 움직였습니다.`,choices:[{text:`순순히 협조한다`,outcome:{text:`장부를 건네자 노르가 한참 넘겨 보았습니다. "깨끗하군. 너무 깨끗해서 의심스럽지만." 그가 떠난 뒤 선반의 시계 하나가 사라진 것을 알아챘습니다.`,do:[H(`교단`,1),H(`쥐굴`,-1)]}},{text:`능청스럽게 둘러댄다`,check:{skill:`언변`,difficulty:2},success:{text:`"반장님, 이 시계는 이안이 맡긴 거라서요. 이안 모르시죠?" 노르의 얼굴이 굳었습니다. 그는 영장을 접고 헛기침을 하며 물러갔습니다.`,do:[H(`쥐굴`,1),H(`진실`,1),U(`단서:이안`)]},failure:{text:`"입이 많이 가볍군." 노르가 당신의 멱살을 잡았습니다. 갈비뼈에 철모 모서리가 박혔습니다.`,do:[H(`체력`,-2)]}},{text:`은화 열다섯을 슬쩍 얹는다`,requires:`은화 >= 15`,outcome:{text:`장부 사이에 은화가 한 줄로 미끄러졌습니다. 노르는 아무것도 못 본 사람처럼 장부를 덮었습니다. "점원, 오래 살겠군."`,do:[H(`은화`,-15),H(`쥐굴`,1)]}}]},{id:`dora_shop`,title:`행상 도라`,pool:`손님`,weight:12,cooldown:4,text:`손수레 가득 병과 헝겊을 실은 행상 도라가 문턱에 앉았습니다. 바퀴는 재에 덮여 회색인데 손수레에 걸린 램프만 유난히 맑게 빛납니다.
"필요한 거 골라, 점원 양반. 그림자는 안 받는다고 미리 말해 둘게. 이쪽은 정직한 장사야."`,choices:[{text:`성수병 (20은화)`,requires:`은화 >= 20`,outcome:{text:`병마개를 열어 확인했습니다. 쇳내와 박하 향. 틀림없는 성광회의 축성수입니다.`,do:[H(`은화`,-20),ec(`성수병`)],goto:`dora_shop`}},{text:`약초 붕대 (10은화)`,requires:`은화 >= 10`,outcome:{text:`쑥 냄새가 코끝을 스쳤습니다. 도라가 묶음을 건네며 윙크했습니다.`,do:[H(`은화`,-10),ec(`붕대`)],goto:`dora_shop`}},{text:`은 단검 (35은화)`,requires:`은화 >= 35 and item('은단검') = 0`,outcome:{text:`칼날이 가스등 불빛을 하얗게 갈랐습니다. 손잡이에는 'D'가 새겨져 있었습니다.`,do:[H(`은화`,-35),ec(`은단검`)],goto:`dora_shop`}},{text:`손등불 (30은화)`,requires:`은화 >= 30 and item('손등불') = 0`,outcome:{text:`손바닥만 한 램프에 작은 불꽃이 쪼그리고 앉아 있었습니다. 따뜻했습니다. 오랜만에 아주 오랜만에, 순수하게 따뜻한 것이었습니다.`,do:[H(`은화`,-30),ec(`손등불`)],goto:`dora_shop`}},{text:`"오늘은 됐습니다."`,outcome:{text:`도라가 손수레를 끌고 어둠 속으로 사라졌습니다. 바퀴 소리가 한동안 골목에 남았습니다.`}}]},{id:`priest_runaway`,title:`도망 사제`,pool:`손님`,once:!0,weight:9,when:`밤 >= 2`,tone:`negative`,text:`흰 사제복의 소매가 찢긴 젊은 사제 이르가 숨을 몰아쉬며 들어와 문을 닫았습니다. 쇄골 아래 낙인이 지워지려다 만 흉터처럼 번져 있습니다.
"숨겨 주세요. 사흘만… 성광회가 제 입을 막으려 합니다. 저는 지하 수도원에서 본 걸 말했을 뿐이에요."`,choices:[{text:`지하 창고에 숨겨 준다`,outcome:{text:`이르는 선반 뒤 비밀 칸에서 밤을 지새웠습니다. 새벽에 사제들이 가게를 뒤졌지만 끝내 찾지 못했습니다. 노파는 아침에 이상하게 웃고 있었습니다.`,do:[H(`교단`,-2),H(`쥐굴`,1),H(`진실`,1),U(`이르보호`)]}},{text:`성광회에 알린다`,outcome:{text:`문밖에 선 사제들이 이르의 팔을 잡았습니다. 이르는 당신을 바라보지 않았습니다. 은화 서른이 쟁반 위에 던져졌습니다.`,do:[H(`은화`,30),H(`교단`,2),H(`이성`,-1)]}},{text:`낙인을 지워 주려 해 본다`,check:{skill:`감정`,difficulty:3},success:{text:`당신은 칼끝으로 화인 주변을 조심스럽게 도려냈습니다. 이르는 이를 악물고 견뎠습니다. 다 끝나자 그는 울면서 웃었습니다. "오래 전부터… 가려웠어요."`,do:[H(`교단`,-1),H(`쥐굴`,1),U(`자비`),ic(`도망 사제의 낙인을 지워 주었다`,3)]},failure:{text:`손이 떨려 칼날이 깊이 들어갔습니다. 이르는 비명을 삼켰습니다. 피 냄새가 가게 안을 덮었습니다.`,do:[H(`이성`,-1),H(`쥐굴`,0)]}}]},{id:`widow`,title:`남편의 초상`,pool:`손님`,once:!0,weight:8,tone:`negative`,text:`검은 상복의 과부가 액자 하나를 카운터에 올려놓았습니다. 초상화 속 남자는 웃고 있었지만, 눈동자가 보는 방향이 매번 바뀌는 것 같았습니다.
"이걸 팔고 싶어요. 아니, 가져가 주세요. 어젯밤부터 이 사람이 제 침대 곁에서 말을 걸어요."`,choices:[{text:`초상화를 받는다`,outcome:{text:`액자를 선반 위에 올리자 가게 안이 조금 더 추워졌습니다. 과부는 안도의 눈물을 흘리며 나갔습니다. 초상 속 남자의 입꼬리가 아주 조금 올라갔습니다.`,do:[H(`은화`,15),tc(`속삭임`),H(`교단`,1)]}},{text:`초상 속 남자와 대화해 본다`,check:{skill:`담력`,difficulty:2},success:{text:`남자는 한참 만에 입을 열었습니다. "…돌아가고 싶어. 여긴 너무 밝아." 그가 눈을 한 번 감았다 떴을 때 액자는 그저 낡은 그림이었습니다.`,do:[H(`이성`,1),H(`진실`,1),U(`단서:망자`)]},failure:{text:`남자가 당신 이름을 불렀습니다. 한 번 두 번. 눈을 뜨자 액자가 방 반대편 벽에 걸려 있었습니다.`,do:[H(`이성`,-2),tc(`속삭임`)]}},{text:`"전당포가 받을 물건이 아닙니다."`,outcome:{text:`과부는 한참 서 있다가 액자를 가슴에 안고 돌아섰습니다. 문턱을 넘으며 중얼거렸습니다. "그럼 누가 받아 주죠."`,do:[H(`이성`,-1),U(`자비`)]}}]},{id:`pickpocket`,title:`쥐굴의 손`,pool:`손님`,once:!0,weight:9,text:`손님인 척 줄을 선 아이의 손이 슬쩍 당신의 주머니를 향했습니다. 능숙한 손놀림이었지만 한 가지 실수. 아이의 손목에 쥐굴 조합의 문신이 있었습니다.`,choices:[{text:`손목을 잡는다`,check:{skill:`담력`,difficulty:1},success:{text:`손목을 잡자 아이가 얼어붙었습니다. "…쥐굴 형들한테는 말하지 마세요." 당신은 은화 두 닢만 쥐여 보내고 손을 놓았습니다.`,do:[H(`쥐굴`,1),U(`자비`)]},failure:{text:`아이는 곡예사처럼 몸을 비틀며 빠져나갔고, 당신 주머니에서 은화 몇 닢이 함께 사라졌습니다.`,do:[H(`은화`,-10)]}},{text:`모르는 척 지켜본다`,outcome:{text:`아이는 은화 한 닢만 집어 갔습니다. 당신 눈을 바라보고 나서 목례를 하고 나갔습니다. 며칠 뒤 문턱에 말린 생선 한 마리가 놓여 있었습니다.`,do:[H(`은화`,-3),H(`쥐굴`,2)]}},{text:`야경대를 부른다`,outcome:{text:`호루라기 소리가 골목을 울렸습니다. 아이는 어둠 속으로 사라졌지만 이튿날 가게 문에는 쥐굴의 붉은 분필 표식이 그려져 있었습니다.`,do:[H(`쥐굴`,-2),H(`교단`,1),tc(`추적`)]}}]},{id:`ash_rain`,title:`재비`,pool:`사건`,weight:10,tone:`neutral`,text:`밤하늘이 갑자기 검은 비를 쏟았습니다. 재와 빗물이 섞여 진흙이 되고, 골목마다 가스등 불빛이 흙탕물에 번졌습니다. 이럴 때는 사람들이 문을 걸어 잠급니다.`,choices:[{text:`처마 아래서 기다린다`,outcome:{text:`한 시간, 두 시간. 비는 멎지 않았지만 그동안 숨은 고르게 돌아왔습니다.`,do:[H(`이성`,1)]}},{text:`비를 뚫고 달린다`,outcome:{text:`재가 입에 들어갔습니다. 쓴맛이 한참 혀에 남았습니다.`,do:[H(`체력`,-1),H(`은화`,8)]}},{text:`손등불을 꺼내 든다`,requires:`item('손등불') > 0`,outcome:{text:`작은 불꽃이 빗속에서도 흔들리지 않았습니다. 골목의 그늘들이 한 걸음씩 물러났습니다.`,do:[H(`이성`,2)]}}]},{id:`lamp_out`,title:`꺼진 가스등`,pool:`사건`,weight:11,tone:`negative`,group:`dark`,text:`골목 중간의 가스등이 꺼져 있습니다. 어둠 속에서 무언가 웅크린 형체가 이쪽을 향해 고개를 들었습니다. 눈은 없고 입만 있는 개. 이 도시 사람들은 그늘개라고 부릅니다.`,choices:[{text:`맞선다`,outcome:{do:[oc(`습격`,{위력:2})]}},{text:`돌아서 다른 길로 간다`,outcome:{text:`발걸음을 빨리했지만 등 뒤에서 발톱이 돌바닥을 긁는 소리가 한참 따라왔습니다.`,do:[H(`이성`,-1)]}},{text:`그림자를 한 겹 던져 준다`,requires:`그림자 >= 3`,outcome:{text:`개는 그림자를 한입에 삼키고 어둠 속으로 되돌아갔습니다. 당신의 발밑이 얇아졌습니다.`,do:[H(`그림자`,-1),U(`그늘개빚`)]}}]},{id:`rooftop_hunter`,title:`지붕 위의 사냥꾼`,pool:`사건`,weight:8,tone:`negative`,group:`dark`,text:`기와가 한 장 떨어졌습니다. 올려다보자 지붕 위, 가스등 불빛 건너편에 가죽 외투 차림의 사냥꾼이 쭈그리고 있었습니다. 손에는 은빛 갈고리, 눈에는 굶주림. 그림자 사냥꾼입니다.`,choices:[{text:`재빨리 골목으로 숨는다`,outcome:{text:`숨이 목구멍까지 차올랐습니다. 사냥꾼은 갈고리를 한 번 휘둘렀다가 그냥 걸음을 돌렸습니다. 오늘은 배가 불렀나 봅니다.`,do:[H(`체력`,-1)]}},{text:`은 단검을 뽑는다`,requires:`item('은단검') > 0`,outcome:{text:`은빛이 번쩍이자 사냥꾼의 눈이 가늘어졌습니다. 그는 낮게 혀를 차고 지붕 너머로 사라졌습니다.`,do:[H(`쥐굴`,1)]}},{text:`말을 걸어 본다`,check:{skill:`언변`,difficulty:3},success:{text:`사냥꾼은 갈고리를 내렸습니다. "…점원이라. 반달 가게? 거긴 건드리지 말라고 위에서 그러더군." 그는 가죽 외투를 여미며 어둠 속으로 사라졌습니다.`,do:[H(`진실`,1),U(`단서:사냥꾼`)]},failure:{text:`갈고리가 어깨를 스쳤습니다. 그림자가 한 겹 찢겨 나갔습니다. 사냥꾼은 낄낄거리며 지붕을 넘어 사라졌습니다.`,do:[H(`체력`,-1),H(`그림자`,-1)]}}]},{id:`whisper_wall`,title:`벽의 속삭임`,pool:`사건`,weight:10,tone:`negative`,text:`가게 벽 안쪽에서 낮게 말소리가 납니다. 처음엔 쥐 소리인 줄 알았습니다. 하지만 쥐는 이름을 부르지 않습니다. 당신 이름을, 정확한 억양으로.`,choices:[{text:`귀를 막고 노래를 부른다`,outcome:{text:`이안의 장부에서 본 자장가를 흥얼거렸습니다. 소리가 조금 물러났습니다. 가사가 어디서 왔는지는 몰랐습니다.`,do:[H(`이성`,-1)]}},{text:`벽에 귀를 댄다`,check:{skill:`감정`,difficulty:2},success:{text:`벽 속 목소리는 낮게 숫자를 세고 있었습니다. 칠, 팔, 구. 날짜입니다. 열둘에서 멈추고 한참 뒤 다시 하나부터.`,do:[H(`진실`,1),U(`단서:숫자`)]},failure:{text:`벽 속 입술이 귓바퀴에 닿는 것 같았습니다. 놀라 물러났을 때 손바닥에 푸른 얼룩이 남아 있었습니다.`,do:[H(`이성`,-2),tc(`속삭임`)]}},{text:`성수를 벽에 뿌린다`,requires:`item('성수병') > 0`,outcome:{text:`성수가 벽을 타고 흘렀습니다. 안쪽에서 짧은 비명이 한 번. 그리고 조용해졌습니다.`,do:[ec(`성수병`,-1,!0),H(`이성`,1),H(`교단`,0)]}}]},{id:`choir`,title:`길 잃은 성가대`,pool:`사건`,weight:8,tone:`positive`,text:`골목 끝에서 어린 성가대원들이 촛불을 들고 줄지어 걸어왔습니다. 입은 열려 있지만 소리는 노래가 아니라 한숨에 가깝습니다. 인솔자가 길을 잃은 듯 서성입니다.`,choices:[{text:`큰길까지 길을 안내해 준다`,outcome:{text:`아이들은 당신의 손등불을 따라 조용히 걸었습니다. 큰길에 닿자 한 아이가 당신을 올려다보며 "고맙습니다" 하고 웃었습니다. 그것만으로 가슴이 가벼워졌습니다.`,do:[H(`교단`,1),H(`이성`,1),U(`자비`)]}},{text:`못 본 척한다`,outcome:{text:`촛불 행렬이 골목 안쪽으로 천천히 사라졌습니다. 그날 밤 가게 어딘가에서 한숨 같은 성가가 한 번 울렸습니다.`}}]},{id:`sewer_thing`,title:`하수구의 것`,pool:`사건`,weight:8,tone:`negative`,group:`dark`,text:`뒷마당 하수구 뚜껑이 들썩입니다. 쇠창살 사이로 젖은 털과 물갈퀴 같은 손가락이 올라왔습니다. 어두운 구멍 안에서 낮은 목소리가 났습니다. "…빌려줘. 한 번만."`,choices:[{text:`쇠막대로 눌러 닫는다`,outcome:{do:[oc(`습격`,{위력:2})]}},{text:`"무엇을 빌려 달라는 거죠?"`,outcome:{text:`"빛." 목소리는 간절했습니다. "아주 조금만. 오래 못 봤어." 당신은 손등불을 열었다 닫았습니다. 하수구 안에서 고맙다는 소리가 들렸습니다.`,do:[H(`이성`,-1),U(`하수구의빛`),H(`쥐굴`,1)]}},{text:`그냥 지나친다`,outcome:{text:`뚜껑이 다시 닫히는 소리와 함께 한숨이 흘러나왔습니다. 문득 가게 안 물그릇이 조금 줄어 있었습니다.`}}]}],actions:[{id:`audit`,pool:`밤일과`,text:`장부를 정리한다`,check:{skill:`감정`,difficulty:2},success:{text:`숫자와 이름이 맞아떨어졌습니다. 오래 묻힌 선금 몇 줄이 살아났습니다.`,do:[H(`은화`,18)]},failure:{text:`숫자가 자꾸 어긋났습니다. 오늘은 눈이 피곤한 모양입니다.`,do:[H(`은화`,4),H(`이성`,-1)]}},{id:`patrol`,pool:`밤일과`,text:`골목을 순찰한다`,check:{skill:`담력`,difficulty:2},success:{text:`골목 끝까지 돌고 아무 일도 없었습니다. 길가의 취객이 던진 은화 몇 닢을 주웠습니다.`,do:[H(`은화`,12)]},failure:{text:`어두운 모퉁이에서 무언가 발목을 잡아챘습니다. 그늘이 다리에 감겼다 풀렸습니다.`,do:[H(`체력`,-1),tc(`그늘`)]}},{id:`chapel`,pool:`밤일과`,text:`성광회 예배당에 들른다 (헌금 5은화)`,when:`은화 >= 5`,outcome:{text:`촛불 아래서 짧은 기도문을 외웠습니다. 사제의 눈이 당신의 발밑을 스쳤다가 돌아갔습니다. 마음은 가라앉았습니다.`,do:[H(`은화`,-5),H(`교단`,1),H(`이성`,1)]}},{id:`ratbar`,pool:`밤일과`,text:`쥐굴 술집에서 귀를 연다`,check:{skill:`언변`,difficulty:2},success:{text:`탁한 술 한 잔에 이야기들이 흘러나왔습니다. 쥐굴 사람들은 이상하게 당신에게 마음을 열었습니다.`,do:[H(`쥐굴`,1),H(`은화`,-3),H(`진실`,0)]},failure:{text:`당신의 억양을 수상히 본 누군가 술잔을 던졌습니다. 이마에서 피가 흘렀습니다.`,do:[H(`체력`,-1),H(`쥐굴`,-1)]}},{id:`rest`,pool:`밤일과`,text:`붕대를 감고 쉰다`,outcome:{text:`이불 속에서 눈을 감았습니다. 이번 밤은 조용히 지나갔습니다.`,do:[H(`체력`,2),H(`이성`,1)]}},{id:`pawn_self`,pool:`밤일과`,text:`내 그림자를 저당 잡히고 돈을 받는다`,when:`그림자 >= 2`,outcome:{text:`카운터 건너편에서 노파가 계산기를 두드렸습니다. "한 겹에 은화 스물다섯. 다시 찾으러 오는 사람은 드물지." 가위질이 한 번, 소리 없이 끝났습니다.`,do:[oc(`그림자저당`,{수량:1})]}},{id:`borrow`,pool:`밤일과`,text:`노파에게 돈을 빌린다 (빚 +10)`,when:`빚 < 20`,outcome:{text:`"이자는 매 밤 하나." 노파가 장부에 한 줄을 적었습니다. 은화 서른 닢이 카운터 위에서 소리를 냈습니다.`,do:[H(`빚`,10),H(`은화`,30)]}},{id:`repay`,pool:`밤일과`,text:`빚을 갚는다`,when:`빚 > 0 and 은화 >= 5`,outcome:{text:`장부의 이름 옆 숫자를 한 줄씩 지웠습니다. 노파는 모른 척 찻잔만 만졌습니다.`,do:[oc(`빚갚기`)]}}],triggers:[{id:`visit`,name:`회차 기록`,on:`start`,do:[H(`방문횟수`,1),ec(`장부`,1,!0)]},{id:`nightfall`,name:`밤이 온다`,on:`turnStart`,do:[H(`밤`,1)]},{id:`breakdown_watch`,name:`이성이 바닥나면 위기`,on:`watch`,when:`이성 <= 0 and not $pending`,do:[{do:`goto`,event:`breakdown`}]},{id:`seizure_watch`,name:`빚이 한계에 이르면 압류`,on:`watch`,once:!0,when:`빚 >= 20 and not $pending`,do:[{do:`goto`,event:`seizure`}]},{id:`shadow_watch`,name:`그림자가 거의 사라지면`,on:`watch`,once:!0,when:`그림자 <= 1 and 그림자 > 0 and not $pending`,do:[{do:`goto`,event:`thin_shadow`}]},{id:`ash_cough`,name:`재가 폐에 쌓인다`,on:`turnEnd`,when:`밤 >= 9 and chance(20)`,do:[H(`체력`,-1),rc(`재 섞인 기침이 한참 멎지 않았습니다.`)]}],endings:[{id:`fall`,title:`재 속에 쓰러지다`,kind:`death`,when:`체력 <= 0`,priority:10,text:`{image lamp}
무두질 골목 가스등 아래서 당신은 쓰러졌습니다. 재가 눈처럼 쌓였고, 아무도 문을 열지 않았습니다. 노파는 이튿날 아침 당신의 이름을 장부에 한 번 쓰고 한 번 지웠습니다.`},{id:`hollow`,title:`그림자 없는 사람`,kind:`bad`,when:`그림자 <= 0`,priority:9,text:`당신의 발밑에서 마지막 한 겹이 떨어져 나갔습니다. 가스등 아래 서도 아무것도 비치지 않았습니다. 사람들은 이제 당신을 보면 길을 비키지 않고, 쳐다보지도 않습니다. 이안처럼. 이안과 같은 의자에서.`},{id:`whispered`,title:`대답하는 사람`,kind:`bad`,text:`벽 속의 목소리는 매일 밤 조금 더 다정해졌고, 당신은 어느 날 대답했습니다. 가게는 이제 낮에도 문을 열지 않습니다. 가끔 지나가던 이가 안에서 두 사람의 대화 소리를 듣는다고 합니다.`},{id:`indenture`,title:`장부 속의 이름`,kind:`bad`,text:`철제 가면 아래서 당신의 얼굴은 점점 잊혔습니다. 채권 추심 조합의 장부에는 당신 이름이 가장 깨끗한 필체로 적혀 있습니다. 갚을 때까지, 영원히.`},{id:`returned`,title:`돌아온 그림자`,kind:`good`,text:`{image square}
대등불은 푸른빛으로 타올랐습니다. 광장의 사람들은 하나둘 발밑을 보았고, 가스등 아래서 오랜만에 자기 그림자를 보았습니다. 성광회는 이 일을 오래도록 용서하지 않았지만 도시는 이날을 '제 그림자를 돌려받은 밤'이라 부르게 되었습니다.`},{id:`darkness`,title:`진짜 밤`,kind:`neutral`,text:`도시의 가스등이 모두 꺼졌습니다. 아주 오랜 시간 끝에 사람들은 처음으로 어둠에 눈을 적응시켰습니다. 며칠은 혼란이었고, 몇 달은 공포였으며, 몇 해 뒤에는 어둠 속에서 하나둘 새로운 불이 켜졌습니다. 이제는 아무의 그림자도 태우지 않는 작은 불들이.`},{id:`order`,title:`질서의 불`,kind:`neutral`,text:`대등불은 꺼지지 않았고 도시는 평온을 지켰습니다. 그림자를 바치는 일은 이제 '시민의 의무'라는 이름으로 불렸습니다. 당신은 성광회의 장부에 이름을 올렸고, 가끔 새벽에 자기 발밑을 확인했습니다. 아직은 있습니다. 아직은.`},{id:`night_court`,title:`붉은 도시`,kind:`bad`,text:`아슈렐은 낮이 아니라 밤의 도시가 되었습니다. 붉은 야회는 가스등 아래서 가장 풍요로웠고, 당신은 그들의 문 앞에서 가장 값비싼 손님이었습니다. 도시는 더 밝아졌고, 더 조용해졌습니다. 사람들이 이야기를 덜 하게 되었기 때문입니다.`},{id:`pawnbroker`,title:`반달의 주인`,kind:`neutral`,text:`당신은 이제 반달 전당포의 주인입니다. 노파는 마침내 눈을 감았고, 당신의 그림자는 선반 사이를 천천히 돌아다닙니다. 새 점원이 올 때까지, 혹은 불이 꺼질 때까지. 문패는 여전히 없지만, 유리창의 달은 언젠가부터 반쪽이 아닙니다.`},{id:`wanted`,title:`현상 수배`,kind:`bad`,text:`병은 모두 돌려주었지만 대등불은 그대로였습니다. 이튿날 도시의 모든 벽에 당신의 초상이 붙었습니다. 쥐굴 사람들만이 당신에게 은밀히 빵 조각과 하수로 지도를 건넸습니다. 당신은 한동안 도시 밑에서 살았습니다.`},{id:`ash_road`,title:`재의 길`,kind:`neutral`,text:`연기 천장이 끝나는 곳에서 당신은 처음으로 하늘 비슷한 것을 보았습니다. 희미한 푸른빛. 그것이 해인지 아닌지는 모릅니다. 돌아보니 아슈렐의 불은 아주 작은 점이었고, 발밑에는 아직 당신의 그림자가 따라오고 있었습니다.`},{id:`dawn`,title:`아직 오지 않은 새벽`,kind:`neutral`,text:`열두 밤이 지났지만 아무것도 정해지지 않은 채 아침 비슷한 것이 왔습니다. 노파는 변함없이 카운터 뒤에 앉아 있었고, 반쪽 달은 여전히 반쪽이었습니다.`}],epilogue:{header:`아슈렐, {밤}번째 밤. {$이름}의 이야기는 여기서 끝났습니다.`,paragraphs:[{id:`origin`,order:10,lines:[{when:`has('출신', '쥐굴')`,text:`쥐굴의 아이로 시작해 도시 위로 올라왔습니다. 하수로의 어둠은 마지막까지 당신의 눈이었습니다.`},{when:`has('출신', '몰락귀족')`,text:`재가 된 가문의 마지막 문장은, 어쩌면 이 전당포 장부에 이름이 올랐을 때 이미 완성되었는지도 모릅니다.`},{when:`has('출신', '수련사제')`,text:`낙인이 가려울 때마다 당신은 빛이 무엇을 요구하는지, 그 질문을 다시 떠올렸습니다.`},{when:`has('출신', '재너머')`,text:`해가 있다는 땅에서 온 사람. 당신이 이 도시에서 본 것은 훗날 먼 곳의 누군가에게 전해질 이야기가 되었습니다.`}]},{id:`shadow`,order:20,lines:[{when:`그림자 >= 4`,text:`당신의 그림자는 마지막까지 짙었습니다. 가스등 아래에서도 선명했습니다.`},{when:`그림자 >= 1 and 그림자 < 4`,text:`그림자는 얇아졌지만 아직 있었습니다. 아직은, 하고 당신은 속으로 덧붙였습니다.`},{when:`has('빌린그림자')`,text:`당신 발밑의 그림자 한 겹은 병 속에서 빌려 온 것입니다. 가끔 그것이 혼자 다른 방향으로 늘어졌습니다.`},{when:`has('이름팔림')`,text:`이름 한 글자를 팔아 얻은 은화는 어디에도 쓰이지 않았습니다. 장부 어딘가에 그 글자가 살아 있을 것입니다.`}]},{id:`allies`,order:30,lines:[{when:`교단 >= 3`,text:`성광회는 당신을 '빛의 벗'이라 불렀습니다. 그 호칭이 칭찬인지 목줄인지는 시간이 말해 줄 것입니다.`},{when:`쥐굴 >= 3`,text:`쥐굴 사람들은 당신 앞에서 모자를 벗었습니다. 하수로의 어둠 속에서 당신의 이름은 아이들의 자장가가 되었습니다.`},{when:`야회 >= 3`,text:`붉은 야회의 잔은 마지막까지 당신 앞에 놓였습니다. 한 번도 비우지 않았고, 한 번도 거절하지 않았습니다.`},{when:`has('이르보호')`,text:`도망 사제 이르는 먼 곳에서 소식을 전해 왔습니다. "낙인이 가렵지 않아요."`}]},{id:`truth`,order:40,lines:[{when:`진실 >= 6`,text:`당신은 도시의 불이 무엇으로 타오르는지, 누가 그것을 알면서도 눈감았는지 끝까지 알아냈습니다.`},{when:`진실 >= 3 and 진실 < 6`,text:`진실의 반쪽 정도는 알았습니다. 나머지 반쪽은 아직 병 속에서 일렁이고 있습니다.`},{when:`진실 < 3`,text:`당신은 많은 것을 알지 못한 채 열두 밤을 지났습니다. 어쩌면 그것이 가장 안전한 일이었을지도 모릅니다.`},{when:`has('이안의부탁') and 진실 >= 3`,text:`이안은 광장 가장자리에서 오래 손을 들고 있었습니다. 그림자 없는 남자의 미소는 아주 잠깐 사람처럼 보였습니다.`}]},{id:`debt`,order:50,lines:[{when:`빚 = 0 and 밤 >= 8`,text:`이자 장부의 숫자는 한 줄도 남지 않았습니다. 노파가 마지막 날 처음으로 칭찬 비슷한 말을 했습니다.`},{when:`빚 >= 10`,text:`장부의 빚은 끝내 갚지 못했고, 당신 이름은 그 아래 오랫동안 남았습니다.`}]}],footer:`{lookup('도시의기억', 도시점수, '문구')}`},achievements:[{id:`반달의점원`,title:`반달의 점원`,icon:`🌓`,description:`한 번이라도 이야기를 끝까지 마쳤다 — 새 출신이 열립니다`,when:`$엔딩 != ''`},{id:`그림자지킴이`,title:`제 그림자를 지킨 사람`,icon:`◐`,description:`그림자가 4 이상인 채로 끝을 맞았다`,when:`$엔딩 != '' and 그림자 >= 4`},{id:`돌려준밤`,title:`돌려준 밤`,icon:`🫙`,description:`잃어버린 그림자를 주인에게 돌려주었다`,when:`$엔딩 = 'returned'`},{id:`진실의끝`,title:`불의 뿌리`,icon:`🗝`,description:`도시의 불이 무엇으로 타는지 끝까지 알아냈다`,when:`진실 >= 7`},{id:`빚없는밤`,title:`빚 없는 밤`,icon:`✒`,description:`빚을 모두 갚은 채 열 번째 밤을 맞았다`,when:`밤 >= 10 and 빚 = 0`},{id:`속삭임을듣다`,title:`대답을 미룬 사람`,icon:`👂`,description:`벽 속 목소리의 부름을 받고도 버텨 냈다`,hidden:!0,when:`seen('breakdown') and 이성 >= 2 and $엔딩 = ''`},{id:`세력무관`,title:`누구의 편도 아닌`,icon:`⚖`,description:`세 세력 모두에게 문을 열지 않았다`,hidden:!0}],assets:[{id:`shop`,kind:`image`,src:Ys,alt:`반쪽 달이 걸린 전당포`},{id:`lamp`,kind:`image`,src:Xs,alt:`가스등`},{id:`cellar`,kind:`image`,src:Zs,alt:`그림자 병이 늘어선 서가`},{id:`square` N사의 금기는 단순합니다. 움직이는 그림을 만들지도, 보여 주지도, 보지도 말 것. 사진은 괜찮습니다.`,choices:[{text:`딱 한 번만 찍어 본다`,results:[{weight:80,text:`창밖 비둘기를 십 초 찍었습니다. 아무 일도 없었습니다. 다음 날 아랫동네에서 망치 소리가 오래 들렸다는 것만 빼면요.`,do:[K(`녹화`),W(`정신`,-1),q(`금기를 어기고 십 초를 녹화했다`,4)]},{weight:20,text:`셔터 소리 대신 현관 초인종이 울렸습니다.`,do:[uc(`taboo`)]}]},{text:`망치로 부숴 버린다`,outcome:{text:`산산조각 난 렌즈를 쓰레기 봉투 세 개에 나눠 담았습니다. 왠지 마음이 놓였습니다.`,do:[W(`정신`,1)]}},{text:`쿠키 거리 공방에 몰래 판다`,results:[{weight:75,text:`공방 주인은 아무것도 묻지 않고 지폐를 세어 주었습니다.`,do:[W(`돈`,20),W(`처세`,1)]},{weight:25,text:`사흘 뒤, 그 공방 간판이 사라졌습니다. 당신은 한동안 잠을 이루지 못했습니다.`,do:[W(`돈`,20),W(`정신`,-2)]}]}]}),J({id:`n_prosthetic`,ages:[6,14],once:!0,when:`${pc} and ${bc}`,title:`의체 아저씨`,text:`옆집 아저씨의 왼팔은 쇠였습니다. 아이들에게 사탕을 나눠 주던 그 팔이, 오늘은 떨리고 있었습니다. 골목 끝에서 망치를 든 사람들이 문을 하나씩 두드리고 있습니다.
"얘야. 너희 집 다락, 잠깐만 빌릴 수 있겠니."`,choices:[{text:`다락으로 숨겨 준다`,results:[{weight:60,text:`이단심문관들은 당신 집 문을 두드리지 않았습니다. 아저씨는 새벽에 떠나며 쇠 손으로 당신 머리를 쓰다듬었습니다.`,do:[W(`처세`,1),K(`은인`),q(`이단심문관에게서 이웃을 숨겨 주었다`,4)]},{weight:40,text:`문이 부서졌습니다. 아저씨는 끌려갔고, 당신은 망치 자루에 맞아 한 달을 앓았습니다.`,do:[W(`체력`,-3),W(`정신`,-1)]}]},{text:`고개를 젓는다`,outcome:{text:`그날 밤 골목에서 쇠가 부서지는 소리가 났습니다. 당신은 귀를 막고 잤습니다.`,do:[W(`정신`,-1)]}}]}),J({id:`t_watch`,ages:[6,8],fixed:!0,when:`${mc} and ${yc}`,title:`첫 회중시계`,text:`일곱 살 생일, 당신 몫의 회중시계를 받았습니다. 신분증이자 지갑이자 하루의 길이입니다. 바늘 옆 작은 창에 숫자가 떠 있습니다. 22시간.
아버지가 말했습니다. "시간은 쓰는 거란다. 버는 게 아니라."`,choices:[{text:`아껴서 공부에 쓴다`,outcome:{text:`잠을 줄이고 책을 읽었습니다. 흑백 글씨가 머리에 차곡차곡 쌓였습니다.`,do:[W(`지식`,1)]}},{text:`하루를 팔아 색을 산다`,outcome:{text:`하루 두 시간을 시간 은행에 넘기고, 목도리 하나의 색을 돌려받았습니다. 붉은색. 흑백 거리에서 당신만 따뜻해 보였습니다.`,do:[K(`색`),W(`정신`,2),W(`체력`,-1),q(`처음으로 색을 가졌다 — 붉은 목도리`,4)]}}]}),J({id:`t_factory`,ages:[9,12],fixed:!0,when:`${mc} and ${bc}`,title:`공장`,text:`나이가 차면 아이들은 공장으로 갑니다. 컨베이어 벨트의 톱니는 당신 손가락보다 빨리 돌고, 감독관의 시계는 당신 것보다 길게 돕니다.`,choices:[{text:`버틴다`,outcome:{text:`손에 굳은살이 박이고, 감독관 눈을 피하는 법을 배웠습니다.`,do:[W(`체력`,-1),W(`처세`,1),W(`돈`,5)]}},{text:`데드레빗츠를 따라 담을 넘는다`,results:[{weight:55,text:`자경단 아이들은 당신을 '꼬마 토끼'라 불렀습니다. 주먹 쓰는 법을 배웠습니다.`,do:[W(`전투`,1),K(`자경단`)]},{weight:45,text:`담은 생각보다 높았습니다. 다리를 절며 공장으로 돌아갔습니다.`,do:[W(`체력`,-2)]}]}]}),J({id:`t_time_tax`,ages:[10,40],cooldown:6,when:mc,weight:12,title:`시간세`,text:`실크햇을 쓴 징수원이 문을 두드립니다. 뒷골목 사람들은 그들을 '시곗줄'이라고 부릅니다. "체납 시간 회수 나왔습니다. 시계 꺼내시죠."`,choices:[{text:`순순히 시간을 낸다`,outcome:{text:`그 주의 하루는 열한 시간이었습니다. 잠을 자면 이틀이 지나 있었습니다.`,do:[W(`정신`,-1),W(`체력`,-1)]}},{text:`시계를 숨긴다`,check:{chance:`30 + 처세 * 10`},success:{text:`바닥 틈에 숨긴 시계를 그는 찾지 못했습니다. "다음 달에 다시 오죠."`,do:[W(`처세`,1)]},failure:{text:`시간 저울 교수대 앞에 섰습니다. 저울 접시가 기울 때마다 몸에서 무언가 빠져나갔습니다.`,do:[W(`체력`,-3),q(`시간 저울 교수대에 올랐다`,3)]}}]}),J({id:`h_restack`,ages:[5,12],fixed:!0,when:hc,title:`재적일`,text:`종이 울리고, 노래가 시작됩니다. 한 달에 한 번, 홍원의 건물들이 레일을 타고 자리를 바꾸는 날. 노동의 값만큼 방이 넓어지거나 좁아집니다. 사람들은 이불을 개어 두고 벽을 붙잡습니다.`,choices:[{text:`어머니 손을 꼭 잡는다`,results:[{weight:40,text:`방이 한 뼘 넓어졌습니다. 그날 저녁 식구들은 아무 말 없이 웃었습니다.`,do:[W(`정신`,1)]},{weight:40,text:`벽이 다가와 멈췄습니다. 이제 이불을 펴면 문이 열리지 않습니다.`,do:[W(`정신`,-1)]},{weight:20,text:`바닥이 기울었습니다. 손이 미끄러졌고, 당신은 난간 끝에 매달렸습니다. 아래로는 레일과 어둠뿐입니다.`,choices:[{text:`손을 놓지 않는다`,check:{chance:`50 + 전투 * 10`},success:{text:`손가락이 하얘질 때까지 버텼습니다. 노래가 끝나자 누군가 당신을 끌어올렸습니다.`,do:[W(`전투`,1),q(`재적일에 떨어질 뻔했다`,3)]},failure:{text:`한 층 아래 지붕에 떨어졌습니다. 뼈가 두 군데 부러졌지만, 살았습니다.`,do:[W(`체력`,-3)]}},{text:`목청껏 소리친다`,outcome:{text:`옆 칸 할아버지가 지팡이를 내밀었습니다. "오늘은 몇 명이 떨어지려나 했더니, 하나 줄었구먼."`,do:[W(`처세`,1),W(`정신`,-1)]}}]}]}]}),J({id:`h_pill`,ages:[3,15],once:!0,when:hc,title:`환`,text:`열이 사흘째 내리지 않습니다. 할머니가 서랍 깊은 곳에서 검은 환 한 알을 꺼냈습니다. 홍원의 약은 무엇이든 고칩니다. 다만 무엇으로 고칠지는 약이 정합니다.`,choices:[{text:`환을 삼킨다`,results:[{weight:80,text:`다음 날 아침, 열은 거짓말처럼 사라졌습니다.`,do:[W(`체력`,2)]},{weight:20,text:`열은 내렸습니다. 대신 팔꿈치 안쪽에 작은 잎사귀 하나가 돋았습니다. 뽑으면 아픕니다.`,do:[W(`체력`,2),W(`정신`,-1),K(`잎사귀`),q(`환을 먹고 팔에 잎사귀가 돋았다`,3)]}]},{text:`그냥 버틴다`,outcome:{text:`열흘을 앓고 일어났습니다. 조금 말랐습니다.`,do:[W(`체력`,-1)]}}]}),J({id:`h_clan`,ages:[10,16],once:!0,when:`${hc} and ${yc}`,title:`설가의 시동`,text:`4대 가문 중 설가(薛家)의 집사가 찾아왔습니다. 도련님의 시동을 구한다고 합니다. 가문의 그늘은 넓고 서늘합니다. 들어가면 나오기 어렵다는 것도 모두 압니다.`,choices:[{text:`들어간다`,outcome:{text:`비단옷의 무게와 머리 숙이는 각도를 배웠습니다.`,do:[W(`처세`,2),W(`정신`,-1),K(`가문`,`설가`),q(`설가의 시동이 되었다`,3)]}},{text:`정중히 거절한다`,outcome:{text:`집사는 웃으며 돌아갔고, 그 웃음은 오래 잊히지 않았습니다.`,do:[W(`정신`,-1)]}}]}),J({id:`first_night`,ages:[5,12],once:!0,fixed:!0,when:bc,title:`첫 번째 밤`,text:`오전 3시 13분. 뒷골목의 밤이 시작됩니다. 80분 동안은 무엇이든 허락됩니다. 거주구역의 벽 안쪽만 빼고요. 아버지가 불을 끄며 말했습니다. "창문 쪽은 보지 마라."`,choices:[{text:`이불 속에서 숨을 죽인다`,outcome:{text:`멀리서 무언가 질질 끌리는 소리가 났고, 4시 34분에 멎었습니다.`,do:[W(`정신`,-1)]}},{text:`커튼 틈으로 내다본다`,results:[{weight:70,text:`방호복 같은 것을 입은 키 큰 사람들이 갈고리로 무언가를 녹이고 있었습니다. 그중 하나가 고개를 들어 창을 보았습니다. 다정하게, 마치 이웃을 보듯이.`,do:[W(`정신`,-2),K(`청소부목격`),q(`처음으로 청소부를 보았다`,4)]},{weight:30,text:`아무것도 없는 골목이었습니다. 정말 아무것도. 어제까지 있던 노점도, 쓰레기도.`,do:[W(`지식`,1),W(`정신`,-1)]}]}]}),J({id:`hamham`,ages:[4,12],once:!0,title:`햄햄팡팡`,text:`생일이라고 햄햄팡팡 샌드위치를 하나 사 주셨습니다. 뒷골목마다 있는 가게지만, 오늘 것은 특별히 치즈가 두 장입니다.`,choices:[{text:`천천히 먹는다`,outcome:{text:`마지막 한 입까지 따뜻했습니다.`,do:[W(`정신`,1)]}}]}),J({id:`combat_class`,ages:[8,14],once:!0,title:`전투 실기`,text:`학교 전투 기술 수업. 교관은 의체 손목을 돌리며 말했습니다. "도시에서 살아남는 법은 두 가지다. 강하거나, 강한 사람을 살 돈이 있거나."`,choices:[{text:`열심히 배운다`,outcome:{text:`목검 쥔 손에 물집이 잡혔습니다.`,do:[W(`전투`,1)]}},{text:`땡땡이치고 매점에 간다`,outcome:{text:`매점 아주머니와 친해졌습니다. 소문이 제일 빨리 도는 곳이었습니다.`,do:[W(`처세`,1)]}}]}),J({id:`cat_fixer`,ages:[6,14],once:!0,title:`9급 해결사`,text:`골목에서 해결사 한 사람이 쓰레기통을 뒤지고 있었습니다. 낡은 코트에 9급 면허증. 고양이를 찾는 중이랍니다. 밤이 되기 전에.`,choices:[{text:`같이 찾아 준다`,outcome:{text:`고양이는 굴뚝 위에 있었습니다. 해결사는 의뢰비에서 동전 하나를 떼어 당신 손에 쥐여 주었습니다. "너, 눈썰미 있다."`,do:[W(`처세`,1),K(`동경`),W(`돈`,1)]}},{text:`멀찍이서 구경만 한다`,outcome:{text:`해결사는 해가 질 무렵 고양이를 안고 뛰어갔습니다. 어딘가 멋져 보였습니다.`,do:[K(`동경`)]}}]}),J({id:`kyungkyung`,ages:[6,12],once:!0,title:`댄싱큥큥`,text:`친구가 이상한 음료를 내밀었습니다. 흔들면 젤리가 되는 댄싱큥큥. 원료가 무엇인지는 아무도 모릅니다. 아니, 다들 알지만 말하지 않습니다.`,choices:[{text:`흔들어 마신다`,results:[{weight:80,text:`달고, 쫀득하고, 이상하게 신났습니다.`,do:[W(`정신`,1)]},{weight:20,text:`밤새 배가 아팠습니다. 꿈속에서 무언가 꿈틀거렸습니다.`,do:[W(`체력`,-1)]}]},{text:`사양한다`,outcome:{text:`친구는 두 병을 다 마시고 춤을 췄습니다.`,do:[]}}]}),J({id:`s_school`,ages:[7,11],fixed:!0,when:`${gc} and ${yc}`,title:`서당의 회초리`,text:`둥지 서당의 훈장은 회초리보다 목소리가 더 무서운 사람이었습니다. 오늘 외울 것은 「왕을 섬기는 열두 마디」. 한 글자라도 틀리면 손바닥을 내밀어야 합니다.`,choices:[{text:`밤새 소리 내어 외운다`,outcome:{text:`새벽닭이 울 때쯤 열두 마디가 입에 붙었습니다. 훈장이 처음으로 고개를 끄덕였습니다.`,do:[W(`지식`,1),W(`정신`,-1)]}},{text:`모르는 구절은 슬쩍 바꿔 외운다`,check:{chance:`40 + 처세 * 12`},success:{text:`훈장은 끝까지 눈치채지 못했습니다. 말을 그럴듯하게 바꾸는 법을 배웠습니다.`,do:[W(`처세`,1)]},failure:{text:`“그 구절은 어느 책에 있느냐.” 손바닥이 붉어질 때까지 회초리가 내려왔습니다.`,do:[W(`체력`,-1),W(`정신`,-1)]}}]}),J({id:`s_rice`,ages:[5,12],once:!0,weight:15,when:gc,title:`줄어든 쌀`,text:`올해는 쌀 배급이 절반으로 줄었습니다. 쌀을 쥔 큰 가문이 곳간 문을 걸어 잠갔다는 소문입니다. 쌀독 바닥이 보입니다.`,choices:[{text:`새벽부터 배급 줄에 선다`,results:[{weight:60,text:`한 되를 받아 왔습니다. 그날 저녁 죽은 평소보다 훨씬 걸쭉했습니다.`,do:[W(`돈`,3),W(`정신`,1)]},{weight:40,text:`줄이 끊기기 직전, 어른들 틈에서 떠밀려 넘어졌습니다. 빈손으로 돌아왔습니다.`,do:[W(`체력`,-2)]}]},{text:`죽을 묽게 쑤어 나눠 먹는다`,outcome:{text:`식구들이 말없이 숟가락을 들었습니다. 배는 고팠지만 아무도 투덜대지 않았습니다.`,do:[W(`체력`,-1),W(`정신`,1)]}}]}),J({id:`s_chuno`,ages:[8,13],once:!0,when:`${gc} and ${bc}`,title:`추노꾼`,text:`새벽에 옆집 아저씨가 짐을 싸서 달아났습니다. 해가 뜨기도 전에 말 탄 추노꾼 둘이 골목을 훑기 시작했습니다. 그들이 당신 앞에서 말을 세웠습니다.
“얘야, 이 집 사람 어디로 갔는지 아느냐.”`,choices:[{text:`아무것도 모른다고 한다`,check:{chance:`40 + 처세 * 12`},success:{text:`추노꾼은 한참 당신을 내려다보다 말 머리를 돌렸습니다. 등줄기가 한참 젖어 있었습니다.`,do:[W(`처세`,1)]},failure:{text:`“거짓말은 노비의 버릇이다.” 채찍이 한 번 허공을 갈랐고, 당신은 그 소리만으로도 주저앉았습니다.`,do:[W(`정신`,-2),W(`체력`,-1)]}},{text:`반대쪽 골목을 가리킨다`,results:[{weight:70,text:`말발굽 소리가 멀어졌습니다. 아저씨는 영영 돌아오지 않았지만, 어딘가에서 살아 있을 겁니다.`,do:[W(`처세`,1),K(`은인`),q(`추노꾼에게서 이웃을 숨겨 주었다`,4)]},{weight:30,text:`추노꾼이 당신 어깨를 붙잡았습니다. “네 눈이 먼저 그쪽을 보더구나.”`,do:[W(`체력`,-2),W(`정신`,-2)]}]}]}),J({id:`s_lake`,ages:[6,12],once:!0,when:`${gc} and ${bc}`,title:`대호수의 새벽`,text:`아버지가 처음으로 배에 태워 주었습니다. 호수는 끝이 보이지 않았고, 멀리 성벽 위로 둥지의 기와지붕이 해처럼 반짝였습니다. 그물이 묵직하게 당겨집니다.`,choices:[{text:`아버지와 함께 그물을 당긴다`,outcome:{text:`손바닥이 벗겨졌지만 은빛 물고기가 배 바닥에서 팔딱였습니다. 아버지가 처음으로 큰 소리로 웃었습니다.`,do:[W(`체력`,-1),W(`전투`,1),W(`돈`,3)]}},{text:`뱃전에 앉아 성벽만 바라본다`,outcome:{text:`저 안쪽에는 쌀밥을 배불리 먹는 아이가 있을까요. 그날 이후로 성벽이 자꾸 눈에 밟혔습니다.`,do:[W(`지식`,1),W(`정신`,-1)]}}]}),J({id:`s_nobi`,ages:[10,14],once:!0,weight:10,when:gc,title:`노비 문서`,text:`이웃집 어른이 하루아침에 노비가 되었습니다. 이유는 ‘나라에 도움이 되지 않는 발명’. 그가 만든 것은 물레방아의 작은 톱니 하나였습니다. 그는 끌려가며 당신 손에 톱니를 쥐여 주었습니다.`,choices:[{text:`톱니를 몰래 간직한다`,outcome:{text:`톱니는 손바닥만큼 따뜻했습니다. 가끔 꺼내 보면 이유 없이 마음이 놓였습니다.`,do:[W(`지식`,1),K(`톱니`),q(`이웃이 남긴 톱니를 간직했다`,3)]}},{text:`아무에게도 말하지 않고 강에 버린다`,outcome:{text:`물소리는 작았습니다. 그 뒤로 오래도록 강가에 가지 않았습니다.`,do:[W(`정신`,-1)]}}]}),J({id:`k_checkpoint`,ages:[6,12],fixed:!0,when:`${_c} and ${yc}`,title:`검문소 앞의 줄`,text:`검문소 앞에서 줄을 서는 것은 11구 아이들의 첫 번째 사회 수업입니다. 앞 사람이 서류를 내밀다 비자 만료를 들켰고, 코드 퍼플이 울렸습니다. 방패를 든 적출직들이 달려옵니다.`,choices:[{text:`바닥에 납작 엎드린다`,outcome:{text:`방패가 지나가는 소리를 귀 옆에서 들었습니다. 아무 일도 없었다는 듯이 줄은 다시 이어졌습니다.`,do:[W(`정신`,-1),W(`처세`,1)]}},{text:`고개를 들고 구경한다`,results:[{weight:80,text:`연예인 구경하듯 사진 찍는 사람들 틈에서, 당신도 한참 쳐다보았습니다. 생각보다 별일 아니었습니다.`,do:[W(`정신`,-1)]},{weight:20,text:`방패 모서리가 어깨를 스쳤습니다. 아프다기보다 어이가 없었습니다.`,do:[W(`체력`,-2),W(`정신`,-1)]}]}]}),J({id:`k_chicken`,ages:[4,12],once:!0,when:_c,title:`보살 치킨`,text:`생일 선물은 보살 치킨 한 마리였습니다. 다리가 여섯, 날개가 여덟. 11구 아이들에게는 이것이 평범한 닭입니다. 접시 위에서 닭이 당신을 빤히 보는 것 같았습니다.`,choices:[{text:`제일 큰 다리부터 뜯는다`,outcome:{text:`기름이 줄줄 흘렀습니다. 다리가 여섯 개라서 아무도 싸우지 않았습니다.`,do:[W(`체력`,1),W(`정신`,1)]}},{text:`닭의 눈을 한참 들여다본다`,outcome:{text:`눈이 마주쳤습니다. 닭이 생각하는 걸까요. 그 뒤로 한동안 닭고기가 잘 넘어가지 않았습니다.`,do:[W(`지식`,1),W(`정신`,-1)]}}]}),J({id:`k_hero`,ages:[7,14],once:!0,when:`${_c} and ${yc}`,title:`지크프리트 사인회`,text:`둥지 광장에서 전속 해결사의 사인회가 열렸습니다. 아이들이 줄을 서고, 부모들이 사진 허가증을 흔듭니다. 모두가 그를 영웅이라 부릅니다. 그의 팔에 난 흉터는 분장처럼 보였습니다.`,choices:[{text:`줄을 서서 사인을 받는다`,outcome:{text:`“꼭 살아남아라, 꼬마야.” 영웅은 웃으며 말했습니다. 그 웃음이 사진기 앞에서와 똑같다는 걸 눈치채지 못했습니다.`,do:[K(`동경`),W(`정신`,1),q(`둥지의 해결사에게 사인을 받았다`,3)]}},{text:`인파 뒤에서 흉터만 쳐다본다`,outcome:{text:`그 흉터는 진짜였을까요. 어른이 되어서도 가끔 떠올랐습니다.`,do:[K(`동경`),W(`지식`,1)]}}]}),J({id:`k_oak`,ages:[5,12],fixed:!0,when:`${_c} and ${bc}`,title:`달의 마지막 날`,text:`떡갈나무 마을에서는 달의 마지막 날마다 광장에서 케이크를 나눕니다. 이번에는 한 아이가 광장 한가운데 의자에 앉아 웃고 있었습니다. 마을 사람들이 한 명씩 다가가 그 아이의 손을 잡아 줍니다. 모두 눈을 감은 채로.`,choices:[{text:`줄을 서서 손을 잡는다`,outcome:{text:`손이 차가웠습니다. 그 아이는 계속 웃고 있었습니다. 집에 돌아와서 이유 없이 오래 씻었습니다.`,do:[W(`정신`,-2),K(`떡갈나무`),q(`마을 의식에 참여했다`,4)]}},{text:`케이크만 먹고 돌아온다`,outcome:{text:`케이크는 달았습니다. 다음 날 그 아이의 의자는 광장에 없었습니다.`,do:[W(`정신`,-1),W(`처세`,1)]}},{text:`숨어서 끝까지 지켜본다`,results:[{weight:55,text:`의식이 끝나자 아이는 조용히 어딘가로 안내되었습니다. 어디로 가는지 보려는 순간 누군가 당신 어깨에 손을 올렸습니다. “집에 가자, 얘야.”`,do:[W(`지식`,1),W(`정신`,-2)]},{weight:45,text:`아무것도 보지 못했습니다. 눈을 뜨니 이불 속이었습니다. 이상하게도 케이크 맛이 입에 남아 있었습니다.`,do:[W(`정신`,-1)]}]}]}),J({id:`d_ordinary`,ages:[4,10],once:!0,when:vc,title:`평범한 하루`,text:`아침에 일어나 밥을 먹고, 학교에 갔다가, 저녁에 돌아왔습니다. 아무 일도 없었습니다. 4구에서는 가끔 그런 날이 하루 종일 이어집니다. 어쩐지 놀라운 일 같았습니다.`,choices:[{text:`이런 날이 오래 가길 바란다`,outcome:{text:`잠들기 전에 오래 기도했습니다. 누구에게 하는 기도인지는 몰랐습니다.`,do:[W(`정신`,2)]}},{text:`심심하다고 투덜댄다`,outcome:{text:`어머니가 웃으며 말했습니다. “그런 말은 평생 하고 살았으면 좋겠구나.”`,do:[W(`지식`,1)]}}]}),J({id:`d_forest`,ages:[6,12],once:!0,when:`${vc} and ${bc}`,title:`검은 숲 가장자리`,text:`도시 끝, 검은 숲 가장자리에 아이들이 모였습니다. 숲 안쪽으로 나뭇가지를 던져 넣는 내기를 합니다. 아무도 숲 안에서 무엇이 가지를 받는지 모릅니다. 당신 차례입니다.`,choices:[{text:`있는 힘껏 던진다`,results:[{weight:70,text:`가지는 어둠 속으로 사라졌고, 아무 소리도 나지 않았습니다. 아이들이 환호했습니다.`,do:[W(`처세`,1),W(`정신`,1)]},{weight:30,text:`조금 뒤, 던진 가지가 젖은 채로 발치에 떨어졌습니다. 아무도 웃지 않았습니다.`,do:[W(`정신`,-2),K(`숲`),q(`검은 숲이 던진 가지를 되돌려 보냈다`,3)]}]},{text:`내기를 말리고 아이들을 데려온다`,outcome:{text:`아이들은 투덜댔지만 숲은 조용했습니다. 돌아오는 길에 아무도 뒤를 돌아보지 않았습니다.`,do:[W(`정신`,1),W(`처세`,1)]}}]}),J({id:`d_job`,ages:[7,12],once:!0,when:`${vc} and ${yc}`,title:`아버지의 직장`,text:`학교 숙제는 ‘부모님이 하시는 일 쓰기’였습니다. 아버지는 D사에 다닌다고만 했고, 어머니는 웃으며 화제를 돌렸습니다. 공책 한 줄이 비어 있습니다.`,choices:[{text:`상상해서 그럴듯하게 채운다`,outcome:{text:`선생님은 만점을 주었습니다. 반 친구들도 대부분 비슷하게 썼습니다.`,do:[W(`처세`,1)]}},{text:`아버지를 몰래 따라가 본다`,results:[{weight:60,text:`평범한 사무실이었습니다. 다만 퇴근 시간이 되자 모든 직원이 똑같은 서랍을 동시에 열었습니다.`,do:[W(`지식`,1),W(`정신`,-1)]},{weight:40,text:`경비원이 당신을 붙잡았습니다. 아버지는 한참 뒤에 나타나 아무 말 없이 손을 잡고 돌아왔습니다.`,do:[W(`체력`,-1),W(`정신`,-1)]}]}]}),J({id:`g_tour`,ages:[8,12],once:!0,title:`날개 견학`,text:`학교 소풍은 가까운 날개의 견학이었습니다. 안내하는 직원은 처음부터 끝까지 웃고 있었습니다. 마지막에 그가 말했습니다. “여러분도 언젠가 우리 날개의 깃털이 될 거예요.”`,choices:[{text:`열심히 받아 적는다`,outcome:{text:`공책 한 권이 가득 찼습니다. 직원의 웃음이 한 번도 흔들리지 않았다는 것도 적어 두었습니다.`,do:[W(`지식`,1)]}},{text:`기념품 가게에서 뒷골목 친구 선물을 산다`,requires:`돈 >= 3`,requiresText:`돈이 조금 필요합니다`,outcome:{text:`작은 열쇠고리를 샀습니다. 친구는 그걸 평생 가지고 다녔습니다.`,do:[W(`돈`,-3),W(`처세`,1),W(`정신`,1)]}}]}),J({id:`g_friend`,ages:[5,11],once:!0,title:`첫 친구`,text:`같은 골목에 사는 아이와 눈이 마주쳤습니다. 서로 신발이 짝짝이였다는 이유로 웃음이 터졌습니다. 그날 둘만의 아지트가 생겼습니다. 낡은 지붕 위, 비밀 한 칸.`,choices:[{text:`비밀을 하나씩 나눈다`,outcome:{text:`서로의 가장 부끄러운 비밀을 교환했습니다. 어른이 되어서도 그 비밀만은 지켜졌습니다.`,do:[K(`소꿉친구`),W(`정신`,2),q(`평생 가는 친구를 만났다`,3)]}},{text:`아지트에서 같이 노는 것으로 만족한다`,outcome:{text:`해가 질 때까지 지붕 위에서 도시를 내려다보았습니다.`,do:[W(`정신`,1),W(`처세`,1)]}}]}),J({id:`g_lost`,ages:[4,10],once:!0,title:`손을 놓친 시장`,text:`시장 한복판에서 어머니의 손을 놓쳤습니다. 다리들이 숲처럼 빽빽하게 지나갑니다. 아는 얼굴이 하나도 없습니다.`,choices:[{text:`제자리에서 기다린다`,results:[{weight:70,text:`어머니가 땀범벅이 되어 뛰어왔습니다. 이후로 손을 놓지 않았습니다.`,do:[W(`정신`,1)]},{weight:30,text:`해가 질 때까지 아무도 오지 않았습니다. 그날 처음으로 혼자서 집에 가는 길을 외웠습니다.`,do:[W(`정신`,-2),W(`처세`,1)]}]},{text:`낯선 길로 나서 본다`,check:{chance:`35 + 처세 * 12`},success:{text:`지름길을 찾았습니다. 집에는 당신이 먼저 도착했습니다.`,do:[W(`처세`,1),W(`지식`,1)]},failure:{text:`같은 골목을 세 바퀴 돌았습니다. 낯선 아저씨가 집까지 데려다주었습니다.`,do:[W(`체력`,-1),W(`정신`,-1)]}}]})],t=[J({id:`exam`,ages:[18,18],fixed:!0,priority:50,title:`시험의 날`,text:`{if has('구역', '둥지')}둥지 대학 입학시험 날입니다. 날개에 들어가는 문은 이 시험 하나뿐입니다. 시험장 앞에는 부모들이 줄지어 서서 손을 모으고 있습니다.{else}둥지 대학 입학시험 날입니다. 뒷골목 입시촌에서 몇 년을 버틴 사람들이 버스를 기다립니다. 붙으면 둥지로, 떨어지면 다시 골목으로.{/if}`,choices:[{text:`시험을 본다`,check:{chance:`has('구역', '둥지') ? 25 + 지식 * 15 : 10 + 지식 * 13`},success:{text:`합격자 명단에 이름이 있었습니다. 둥지 대학의 하얀 정문이 열렸습니다.`,do:[K(`대학`),W(`정신`,1),q(`둥지 대학에 합격했다`,4)]},failure:{text:`명단을 세 번 읽었습니다. 이름은 없었습니다.`,do:[W(`정신`,-1)]}},{text:`시험 대신 일자리를 구한다`,outcome:{text:`그날 당신은 시장에서 짐을 날랐습니다. 저녁에 받은 일당이 손바닥에서 따뜻했습니다.`,do:[W(`돈`,10),W(`처세`,1)]}}]}),J({id:`augment`,ages:[14,18],once:!0,when:bc,title:`첫 시술`,text:`골목 시술소 간판이 깜빡입니다. "근력 강화 1단계 — 학생 할인." 주인은 손을 닦으며 웃습니다. "다들 열네 살쯤 받아. 안 받으면 맞고 다니지."`,choices:[{text:`시술을 받는다`,results:[{weight:75,text:`사흘 앓고 나니 철문이 가볍게 열렸습니다.`,do:[W(`전투`,1)]},{weight:25,text:`싸구려였습니다. 팔은 강해졌지만 밤마다 근육이 떨립니다.`,do:[W(`전투`,1),W(`체력`,-2)]}]},{text:`돌아선다`,outcome:{text:`당신은 다른 방법을 찾기로 했습니다.`,do:[W(`지식`,1)]}}]}),J({id:`index_note`,ages:[13,30],once:!0,when:bc,title:`쪽지`,text:`문틈에 흰 쪽지가 끼어 있었습니다. 검지의 인장. 이 구역은 검지의 보호 아래 있고, 보호의 값은 돈이 아니라 지령입니다.
「옆집 생일 케이크에 바늘 세 개를 넣을 것.」`,choices:[{text:`지령을 따른다`,outcome:{text:`옆집 아이는 다치지 않았습니다. 바늘은 케이크 맨 아래에 있었으니까요. 당신은 그 뒤로 생일 케이크를 먹지 못했습니다.`,do:[W(`정신`,-2),K(`지령수행`),q(`검지의 지령을 처음 수행했다`,3)]}},{text:`쪽지를 태운다`,results:[{weight:65,text:`아무 일도 없었습니다. 그 '아무 일도'가 더 무서웠습니다.`,do:[W(`정신`,-1)]},{weight:35,text:`사흘 뒤 흰 망토를 두른 사람들이 찾아왔습니다. 말은 없었고, 매는 길었습니다.`,do:[W(`체력`,-3)]}]}]}),J({id:`first_love`,ages:[15,26],once:!0,title:`첫사랑`,text:`자꾸 같은 사람과 눈이 마주칩니다. 국숫집 창가, 공중전화 앞, 퇴근길 버스. 오늘은 그 사람이 먼저 웃었습니다.`,choices:[{text:`말을 건다`,check:{chance:`35 + 처세 * 12`},success:{text:`"저, 매일 여기서 봐서요." 그 사람이 대답했습니다. "알아요. 저도 매일 봤어요."`,do:[K(`연인`),W(`정신`,2),q(`첫사랑과 이어졌다`,4)]},failure:{text:`목소리가 갈라졌습니다. 그 사람은 정중하게 웃고 버스에 올랐습니다.`,do:[W(`정신`,-1)]}},{text:`마음에 묻어 둔다`,outcome:{text:`그 사람은 어느 날부터 보이지 않았습니다.`,do:[K(`묻어둔사랑`)]}}]}),J({id:`office_raid`,ages:[13,40],once:!0,when:bc,title:`사무소 깨기`,text:`골목 끝 영세 사무소에 조직원 열댓이 몰려갔습니다. 사무소 깨기. 시덥잖은 이유로, 또는 아무 이유도 없이. 안에서 해결사 둘이 의자를 들고 버티고 있습니다.`,choices:[{text:`쇠파이프를 들고 거든다`,check:{chance:`25 + 전투 * 12`},success:{text:`조직원들이 물러갔습니다. 사무소 대표가 당신 어깨를 쳤습니다. "자네, 면허 딸 생각 없나?"`,do:[W(`전투`,1),K(`동경`),W(`실적`,1)]},failure:{text:`두 번째 각목에 쓰러졌습니다. 깨어나 보니 사무소 간판이 바닥에 있었습니다.`,do:[W(`체력`,-3)]}},{text:`못 본 척 지나간다`,outcome:{text:`다음 날 그 사무소는 없었습니다.`,do:[W(`정신`,-1)]}}]}),J({id:`y_parttime`,ages:[13,18],once:!0,weight:14,title:`첫 아르바이트`,text:`동네 가게 문 앞에 구인 쪽지가 붙어 있습니다. 일당은 적고, 시간은 길고, 사장님은 이름을 묻지 않습니다. 그래도 처음으로 내 손으로 버는 돈입니다.`,choices:[{text:`국숫집 설거지를 맡는다`,outcome:{text:`손이 퉁퉁 불었습니다. 일당을 받아 든 저녁, 국수 한 그릇을 사 먹었습니다.`,do:[W(`돈`,8),W(`체력`,-1),W(`정신`,1)]}},{text:`공방 배달을 맡는다`,results:[{weight:70,text:`골목마다 심부름을 다니며 길을 외웠습니다. 배달료에 팁까지 받았습니다.`,do:[W(`돈`,10),W(`처세`,1)]},{weight:30,text:`짐을 하나 놓쳤습니다. 사장님은 조용히 일당에서 깎았습니다.`,do:[W(`돈`,3),W(`정신`,-1)]}]}]}),J({id:`y_counsel`,ages:[16,18],once:!0,weight:16,title:`진로 상담`,text:`담임이 책상 위에 종이 세 장을 펼쳤습니다. 둥지 대학 안내서, 하나 협회 시험 공고, 그리고 가게 일자리 목록. “어느 쪽이든 쉽지는 않다. 하지만 아무것도 안 고르는 쪽이 제일 어렵단다.”`,choices:[{text:`해결사 시험 공고에 손을 얹는다`,outcome:{text:`담임은 한숨을 쉬고 연습용 문제집을 건넸습니다. “살아 있어라. 그것만 약속해.”`,do:[K(`동경`),W(`전투`,1)]}},{text:`둥지 대학 안내서를 집어 든다`,outcome:{text:`종이가 생각보다 두꺼웠습니다. 그 두께만큼 마음이 무거웠습니다.`,do:[W(`지식`,1),W(`정신`,-1)]}},{text:`“아직 모르겠어요”라고 솔직히 말한다`,outcome:{text:`담임이 처음으로 웃었습니다. “그렇게 말하는 애들이 제일 오래 간다.”`,do:[W(`정신`,1)]}}]}),J({id:`y_s_exam`,ages:[14,18],once:!0,when:`${gc} and ${yc}`,title:`초시`,text:`S사의 공채는 과거시험입니다. 어사화를 꽂으려면 먼저 초시를 넘어야 합니다. 서당 선배들이 시험장 앞마당에서 초조하게 붓을 닦고 있습니다.`,choices:[{text:`초시에 응시한다`,check:{chance:`30 + 지식 * 12`},success:{text:`합격 방이 붙은 날, 어머니가 처음으로 울었습니다. 이름 석 자가 방 한가운데 있었습니다.`,do:[K(`초시급제`),W(`정신`,2),W(`지식`,1),q(`초시에 급제했다`,4)]},failure:{text:`답안지를 낼 때 손이 떨렸습니다. 방에서 이름을 찾지 못했습니다. 내년에 또 볼 수 있다고 스스로를 달랬습니다.`,do:[W(`정신`,-1)]}},{text:`시험 대신 서책 필사를 한다`,outcome:{text:`필사한 책값으로 용돈을 벌었습니다. 글씨가 눈에 띄게 늘었습니다.`,do:[W(`돈`,10),W(`지식`,1)]}}]}),J({id:`y_k_poster`,ages:[15,18],once:!0,when:_c,title:`적출직 모집 포스터`,text:`지하철 벽에 포스터가 붙었습니다. 「시험관에서 편안히 잠들다 필요할 때 깨어납니다. 꿈도 걱정도 없습니다.」 상담 전화번호 옆에서 모델이 평온하게 웃고 있습니다.`,choices:[{text:`상담 번호로 전화해 본다`,outcome:{text:`상담원은 놀랄 만큼 친절했습니다. 통화 끝에 이유 없이 눈물이 났습니다.`,do:[W(`지식`,1),W(`정신`,-1),K(`적출직상담`)]}},{text:`포스터를 뜯어 접어 둔다`,outcome:{text:`낙서 하나 없이 깨끗한 벽에 당신이 만든 흔적이 남았습니다. 그것만으로도 조금 숨이 트였습니다.`,do:[W(`정신`,1)]}}]}),J({id:`y_d_forest`,ages:[14,18],once:!0,when:`${vc} and ${bc}`,title:`숲의 벌목 일`,text:`검은 숲 가장자리에서 벌목 일손을 구합니다. 일당은 후하고, 안쪽으로는 들어가지 않는 조건입니다. 감독이 말했습니다. “그쪽에서 이름이 불려도 대답하지 마라.”`,choices:[{text:`일당을 받으러 간다`,results:[{weight:80,text:`바깥쪽 나무만 베는 평범한 일이었습니다. 두둑한 일당이 주머니에 들어왔습니다.`,do:[W(`돈`,15),W(`체력`,-1)]},{weight:20,text:`해 질 무렵, 숲 안쪽에서 누군가 당신 이름을 불렀습니다. 대답하지 않았습니다. 목소리는 어머니 같았습니다.`,do:[W(`돈`,15),W(`정신`,-2),K(`숲`)]}]},{text:`숲 근처에는 가지 않는다`,outcome:{text:`대신 읍내 국숫집에서 일했습니다. 일당은 적었지만 저녁에는 집에 있었습니다.`,do:[W(`돈`,5),W(`정신`,1)]}}]}),J({id:`y_t_invent`,ages:[14,18],once:!0,when:mc,title:`발명 경시대회`,text:`T사의 연례 발명 경시대회 공고가 붙었습니다. 출전하려면 자격증이 필요합니다. 그리고 무허가 기술 개발은 압송 뒤 행방불명입니다. 당신 서랍에는 아직 허가받지 않은 설계도가 한 장 있습니다.`,choices:[{text:`자격증을 따서 정식으로 출품한다`,check:{chance:`30 + 지식 * 12`},success:{text:`작은 상을 받았습니다. 시계탑 아래에서 상장이 반짝였습니다.`,do:[W(`지식`,1),W(`돈`,10),q(`발명 경시대회에서 입상했다`,3)]},failure:{text:`심사위원이 설계도를 한 번 보고는 말했습니다. “기초가 부족하군.” 자격증만 남았습니다.`,do:[W(`정신`,-1)]}},{text:`설계도를 서랍 깊숙이 숨겨 둔다`,results:[{weight:70,text:`밤마다 몰래 꺼내 보며 고쳤습니다. 아무도 몰랐고, 당신만의 작은 시간이 생겼습니다.`,do:[W(`지식`,1),W(`정신`,1)]},{weight:30,text:`가택 수색이 있었습니다. 설계도는 압수당했고, 간신히 이웃 핑계로 넘어갔습니다.`,do:[W(`체력`,-1),W(`정신`,-2)]}]}]})],n=[J({id:`career`,ages:[19,19],fixed:!0,priority:90,title:`갈림길`,text:`열아홉. 도시는 당신에게 이름을 묻지 않습니다. 무엇이 될 건지만 묻습니다.
{if has('대학')}둥지 대학의 졸업장이 서랍에 있습니다.{/if}{if has('동경')} 어릴 적 본 해결사의 코트가 아직 눈에 선합니다.{/if}`,choices:[{text:`하나 협회의 해결사 시험을 본다`,check:{chance:`40 + 전투 * 10`},success:{text:`9급 해결사 면허. 손바닥만 한 카드 한 장이 생각보다 무거웠습니다. FIN 번호를 세 번 외웠습니다.`,do:[...fc(`해결사`),G(`해결사등급`,9),q(`9급 해결사 면허를 땄다`,5)]},failure:{text:`실기에서 떨어졌습니다. 감독관이 말했습니다. "내년에 또 오게. 살아 있으면."`,do:[...fc(`뒷골목 소시민`),K(`낙방`),W(`정신`,-1)]}},{text:`{tag("출신")} 공채에 지원한다`,requires:`has('대학')`,requiresText:`둥지 대학 졸업이 필요합니다`,check:{chance:`45 + 지식 * 10`},success:{text:`{tag("출신")} 1등급 직원. 입사 서류 맨 뒤 장에 아주 작은 글씨로 적힌 조항이 있었지만, 다들 그냥 서명한다고 했습니다.`,do:[...fc(`날개`),{do:`tag`,key:`회사`,value:`tag('출신')`},G(`직원등급`,1),K(`구역`,`둥지`),q(`{tag("출신")}에 입사했다`,5)]},failure:{text:`최종 면접에서 떨어졌습니다. 면접관은 끝까지 당신 이름을 부르지 않았습니다.`,do:[...fc(`뒷골목 소시민`),W(`정신`,-1)]}},{text:`손가락의 문을 두드린다`,outcome:{text:`뒷골목의 모든 조직 위에 다섯 손가락이 있습니다. 어느 문을 두드리느냐에 따라 남은 인생의 규칙이 정해집니다.`,choices:[{text:`엄지 — 예(禮)와 상납금`,requires:`돈 >= 20`,requiresText:`입단 예물 20만 안이 필요합니다`,outcome:{text:`적갈색 코트를 받았습니다. 첫 번째 규칙: 허락 없이 말하지 말 것. 두 번째 규칙: 상급자의 이름을 부르지 말 것.`,do:[...fc(`손가락`),W(`돈`,-20),K(`손가락`,`엄지`),G(`조직계급`,1),q(`엄지의 솔다토가 되었다`,5)]}},{text:`검지 — 신(信)과 지령`,outcome:{text:`흰 망토의 짧은 자락을 받았습니다. 지령을 잘 따를수록 길어진다고 합니다.`,do:[...fc(`손가락`),K(`손가락`,`검지`),G(`조직계급`,1),W(`정신`,-1),q(`검지의 수행자가 되었다`,5)]}},{text:`중지 — 의(義)와 앙갚음`,outcome:{text:`들어가는 건 쉬웠습니다. 큰 형님이 당신 어깨에 팔을 둘렀습니다. "이제 네 원한은 우리 원한이고, 우리 원한은 네 원한이다." 나가는 문은 없다고 했습니다.`,do:[...fc(`손가락`),K(`손가락`,`중지`),G(`조직계급`,1),W(`전투`,1),q(`중지의 제자가 되었다`,5)]}},{text:`약지 — 지(智)와 작품`,check:{chance:`30 + 지식 * 12`},success:{text:`당신의 첫 작품을 본 도슨트가 고개를 끄덕였습니다. "보이는구나." 흰 제복이 주어졌습니다.`,do:[...fc(`손가락`),K(`손가락`,`약지`),G(`조직계급`,1),q(`약지의 스튜던트가 되었다`,5)]},failure:{text:`"보이지 않는 예술은 의미가 없다." 당신의 작품은 심사장 바닥에 엎어졌습니다. 다행히 아직은 첫 번째 낙제입니다.`,do:[...fc(`뒷골목 소시민`),W(`정신`,-2)]}},{text:`문 앞에서 돌아선다`,outcome:{text:`손잡이는 생각보다 차가웠습니다.`,do:[...fc(`뒷골목 소시민`)]}}]}},{text:`평범하게 산다 — 가게 일을 시작한다`,outcome:{text:`국숫집 주방에 들어갔습니다. 칼질은 해결사보다 서툴지만, 밤에는 거주구역 안에서 잡니다.`,do:[...fc(`뒷골목 소시민`),W(`정신`,1)]}}]}),J({id:`retake`,ages:[20,30],once:!0,when:`has('낙방') and ${Tc}`,weight:30,title:`재응시`,text:`하나 협회 시험 공고가 붙었습니다. 작년에 떨어진 그 시험입니다. 그 사이 당신은 조금 더 단단해졌을까요.`,choices:[{text:`다시 본다`,check:{chance:`45 + 전투 * 10`},success:{text:`이번엔 면허를 손에 쥐었습니다.`,do:[...fc(`해결사`),G(`해결사등급`,9),q(`재수 끝에 9급 해결사가 되었다`,5)]},failure:{text:`또 떨어졌습니다. 감독관이 당신을 기억했습니다. "아직 살아 있었군."`,do:[W(`정신`,-1)]}},{text:`지금 삶에 만족한다`,outcome:{text:`국수 국물 냄새가 나쁘지 않았습니다.`,do:[W(`정신`,1)]}}]})],r=[J({id:`f_cat`,ages:[19,35],once:!0,when:`${xc} and 해결사등급 >= 8`,weight:40,title:`첫 의뢰`,text:`첫 의뢰는 고양이 찾기였습니다. 기한은 오늘 밤 3시 13분 전까지. 의뢰인은 고양이 사진 한 장과 꼬깃꼬깃한 지폐를 내밀었습니다.`,choices:[{text:`밤이 오기 전에 찾는다`,results:[{weight:80,text:`고양이는 햄햄팡팡 뒷문 상자 속에 있었습니다. 첫 보고서를 하나 협회에 올렸습니다.`,do:[W(`돈`,5),W(`실적`,1)]},{weight:20,text:`고양이는 3시 12분에야 나타났습니다. 둘이 같이 거주구역 문틈으로 굴러 들어갔습니다.`,do:[W(`체력`,-2),W(`실적`,1),K(`밤생존`)]}]}]}),J({id:`f_raid`,ages:[20,50],cooldown:5,when:`${xc} and 해결사등급 >= 5`,title:`사무소 깨기`,text:`사무소 문이 발로 차여 열렸습니다. 조직원 스무 명. 이유는 묻지 마십시오. 저등급 사무소에게 이유 같은 건 사치니까요.`,choices:[{text:`맞선다`,check:{chance:`30 + 전투 * 10`},success:{text:`마지막 하나가 계단을 굴러 내려갔습니다. 협회에 올린 보고서가 꽤 두꺼웠습니다.`,do:[W(`실적`,2),W(`전투`,1)]},failure:{text:`사무소는 지켰지만, 당신 갈비뼈 몇 대는 지키지 못했습니다.`,do:[W(`체력`,-3)]}},{text:`창문으로 빠져나간다`,outcome:{text:`다음 날 사무소 간판은 바닥에 있었습니다. 새 사무소를 구해야 합니다.`,do:[W(`정신`,-1),W(`돈`,-10)]}}]}),J({id:`f_night_guard`,ages:[22,55],cooldown:4,when:`${xc} and 해결사등급 <= 6`,title:`밤의 경호`,text:`둥지 상인 하나가 뒷골목에 발이 묶였습니다. 3시 13분부터 4시 34분까지, 80분 경호. 보수는 당신의 반년 치 수입입니다. 3급 이상을 구하라는 게 상식이지만, 상인에게는 시간이 없습니다.`,choices:[{text:`받는다`,check:{chance:`15 + 전투 * 10 + (7 - 해결사등급) * 6`},success:{text:`20분 청소, 10분 휴식, 세 번. 세 번째 파도가 지나갔을 때 하늘이 희미하게 밝아 왔습니다.`,do:[W(`돈`,150),W(`실적`,3),K(`밤생존`),q(`뒷골목의 밤 80분을 버텨 냈다`,5)]},failure:{text:`두 번째 파도에서 상인을 놓쳤습니다. 갈고리가 당신 쪽으로 돌았습니다.`,choices:[{text:`거주구역까지 달린다`,check:{chance:`40 + 전투 * 8`},success:{text:`문이 닫히기 직전에 몸을 던졌습니다. 살았습니다. 의뢰는 실패했습니다.`,do:[W(`체력`,-4),W(`정신`,-2)]},failure:{text:`청소부가 다정하게 말했습니다. "늦었네요, 이웃."`,do:[uc(`sweepers`)]}},{text:`죽은 척 엎드린다`,results:[{weight:50,text:`그들은 쓰레기와 사람을 구분할 줄 압니다. 오늘은 당신을 쓰레기로 봐 주었습니다.`,do:[W(`정신`,-2)]},{weight:50,text:`갈고리 끝이 차갑지 않았습니다. 이상하게도.`,do:[uc(`sweepers`)]}]}]}},{text:`거절한다`,outcome:{text:`상인은 다른 해결사를 찾아 떠났습니다. 다음 날 그 상인의 이름은 신문에 없었습니다. 아무 데에도.`,do:[W(`정신`,-1)]}}]}),J({id:`f_scam`,ages:[20,50],once:!0,when:xc,title:`계약 사기`,text:`의뢰를 끝냈더니 의뢰인이 사라졌습니다. 계약서는 공증 사무소를 거치지 않은 종이 한 장. 이 도시에서 공증 없는 계약은 계약이 아닙니다.`,choices:[{text:`외우피 협회에 신고한다`,check:{chance:`35 + 처세 * 12`},success:{text:`협회가 의뢰인을 찾아냈습니다. 수수료를 떼고도 돈이 들어왔습니다.`,do:[W(`돈`,30),W(`처세`,1)]},failure:{text:`"공증 없는 계약은 저희 소관이 아닙니다." 서류가 돌려보내졌습니다.`,do:[W(`정신`,-1)]}},{text:`직접 받아 낸다`,check:{chance:`35 + 전투 * 10`},success:{text:`의뢰인은 문을 열자마자 돈봉투를 내밀었습니다. 벌점 하나와 함께였지만요.`,do:[W(`돈`,40)]},failure:{text:`의뢰인에게는 경호원이 있었습니다.`,do:[W(`체력`,-3)]}},{text:`수업료라고 생각한다`,outcome:{text:`다음부터는 반드시 공증을 받기로 했습니다.`,do:[W(`지식`,1),W(`돈`,-10)]}}]}),J({id:`f_scout`,ages:[25,50],once:!0,when:`${xc} and 해결사등급 <= 5`,title:`협회의 제안`,text:`츠바이 협회 6과 부장이 사무소를 찾아왔습니다. "당신의 방패가 되어 줄 사람을 찾고 있습니다." 협회원은 안정적인 봉급을 받습니다. 대신 협회의 명령은 거절할 수 없습니다. 전멸이 뻔한 의뢰라도.`,choices:[{text:`협회에 들어간다`,outcome:{text:`흰 제복의 단추를 끝까지 잠갔습니다.`,do:[K(`협회`,`츠바이`),W(`실적`,2),W(`돈`,50),q(`츠바이 협회 6과에 들어갔다`,4)]}},{text:`독립을 지킨다`,outcome:{text:`부장은 명함을 두고 갔습니다. "마음이 바뀌면."`,do:[W(`정신`,1)]}}]}),J({id:`f_legend`,ages:[28,60],cooldown:6,when:`${xc} and 해결사등급 <= 3`,title:`도시 질병`,text:`하나 협회가 새 재해 등급을 붙였습니다. 도시 질병. 둥지 해결사들과 손가락들이 관심을 보이는 급입니다. 당신에게도 의뢰가 왔습니다.`,choices:[{text:`토벌에 나선다`,check:{chance:`20 + 전투 * 12 + (4 - 해결사등급) * 8`},success:{text:`그것이 쓰러졌을 때, 옆에 있던 동료들이 당신을 다른 눈으로 보았습니다.`,do:[W(`돈`,300),W(`실적`,4),q(`도시 질병급 재해를 토벌했다`,5)]},failure:{text:`동료 셋을 잃고 돌아왔습니다. 당신도 반쯤은 돌아오지 못했습니다.`,do:[W(`체력`,-4),W(`정신`,-2)]}},{text:`이번엔 넘긴다`,outcome:{text:`다른 사무소가 갔고, 아무도 돌아오지 않았습니다.`,do:[W(`정신`,-1)]}}]})],i=[J({id:`w_70h`,ages:[20,50],cooldown:5,when:Sc,title:`주 70시간`,text:`이번 분기 목표가 또 올라갔습니다. 둥지는 안전하고, 월급은 꼬박꼬박 나오고, 퇴근은 없습니다. 창밖으로 뒷골목의 밤이 TV처럼 켜져 있습니다.`,choices:[{text:`버틴다`,outcome:{text:`분기 평가에서 '성실' 도장을 받았습니다.`,do:[W(`정신`,-2),W(`실적`,1),W(`돈`,30)]}},{text:`아프다고 하루 쉰다`,results:[{weight:55,text:`오랜만에 햇빛을 봤습니다. 둥지의 햇빛도 햇빛이었습니다.`,do:[W(`정신`,2)]},{weight:45,text:`인사 기록에 줄이 하나 그어졌습니다.`,do:[W(`정신`,1),W(`실적`,-1)]}]}]}),J({id:`w_clause`,ages:[22,50],once:!0,when:Sc,title:`희생 조항`,text:`서류 정리를 하다 입사 계약서 사본을 다시 읽었습니다. 마지막 장, 깨알 같은 글씨. 「회사는 필요한 경우 직원을 희생할 수 있으며…」`,choices:[{text:`서랍에 다시 넣는다`,outcome:{text:`모두가 아는 조항이었습니다. 아무도 읽지 않을 뿐.`,do:[W(`정신`,-1)]}},{text:`인사팀에 묻는다`,results:[{weight:70,text:`인사팀은 친절하게 기억 처리 상담 일정을 잡아 주었습니다. 당신은 정중히 사양했습니다.`,do:[W(`정신`,-2),W(`지식`,1)]},{weight:30,text:`다음 주, 당신의 출입증이 작동하지 않았습니다.`,do:[...fc(`뒷골목 소시민`),cc(`회사`),K(`구역`,`뒷골목`),W(`정신`,-2),q(`{tag("출신")}에서 해고되었다`,4)]}]}]}),J({id:`w_n_inquisition`,ages:[20,55],cooldown:6,when:`${Sc} and has('회사', 'N사')`,title:`심문 동원`,text:`이단심문 부서에서 인원을 차출했습니다. 오늘 밤, 14구 공방 거리의 '의체 시술소 정리'. 지급품은 작은 망치 하나입니다.`,choices:[{text:`망치를 든다`,outcome:{text:`쇠가 깨지는 소리와 사람이 깨지는 소리는 다릅니다. 당신은 그 차이를 배웠습니다.`,do:[W(`실적`,2),W(`정신`,-2),K(`심문`),q(`이단심문에 동원되었다`,4)]}},{text:`빠질 핑계를 댄다`,results:[{weight:60,text:`팀장은 당신을 오래 보았지만, 아무 말 하지 않았습니다.`,do:[W(`정신`,-1)]},{weight:40,text:`인사 평가에 '신념 부족'이 찍혔습니다.`,do:[W(`직원등급`,-1)]}]}]}),J({id:`w_t_collect`,ages:[20,55],cooldown:4,when:`${Sc} and has('회사', 'T사')`,title:`시간 징수`,text:`징수직 발령. 징수곡괭이와 체납자 명단이 지급되었습니다. 명단 맨 위의 주소는 당신이 자란 골목과 두 블록 떨어져 있습니다.`,choices:[{text:`명단대로 징수한다`,outcome:{text:`시간 저울은 정확했습니다. 당신 모자가 한 칸 높아졌습니다.`,do:[W(`실적`,1),W(`돈`,40),W(`정신`,-2)]}},{text:`한 집은 못 본 척한다`,results:[{weight:70,text:`그 집 아이가 다음 날 당신에게 고개를 숙였습니다. 당신은 모자를 더 깊이 눌러썼습니다.`,do:[W(`정신`,1)]},{weight:30,text:`감사직의 커스토디안 헬멧이 당신 책상 앞에 섰습니다.`,do:[W(`직원등급`,-1),W(`정신`,-1)]}]}]}),J({id:`w_h_insurance`,ages:[20,55],cooldown:5,when:`${Sc} and has('회사', 'H사')`,title:`생명 보험`,text:`이번 달 영업 목표: 생명 보험 부활 특약 서른 건. 뇌만 상하지 않으면 돌아올 수 있습니다. 기억이 조금 바래고 몸이 조금 달라질 뿐.`,choices:[{text:`테두리 사람들에게 판다`,outcome:{text:`목표를 채웠습니다. 계약자 중 몇은 갱신비를 감당하지 못할 겁니다. 그건 다음 분기의 문제입니다.`,do:[W(`실적`,1),W(`돈`,40),W(`정신`,-1)]}},{text:`나도 하나 든다`,r 결사') ? 25 + 전투 * 10 : 35 + 처세 * 10`},success:{text:`{if has('직업', '해결사')}그것이 멈췄을 때, 비늘 사이로 생선 장수의 얼굴이 잠깐 보였습니다. 협회가 넉넉하게 값을 쳐 주었습니다.{else}골목의 아이들을 모두 빼냈습니다. 누군가 당신에게 고맙다고 했습니다.{/if}`,do:[W(`실적`,2),W(`돈`,30),W(`정신`,-1)]},failure:{text:`그것이 당신을 보았습니다. 아니, 당신의 무언가를 보았습니다.`,do:[W(`체력`,-3),W(`정신`,-2)]}},{text:`달아난다`,outcome:{text:`등 뒤로 생선 장수의 목소리가 들렸습니다. 사람의 말이었는지는 모르겠습니다.`,do:[W(`정신`,-2)]}}]}),J({id:`warp`,ages:[25,65],once:!0,when:`돈 >= 50`,weight:10,title:`W사 워프 열차`,text:`휴가입니다. W사 워프 열차를 타면 23구에서 1구까지 눈 깜짝할 새라고 합니다. 일반석 표값이 요즘 많이 내렸다는 소문입니다. 실종 사건 이후로요.`,choices:[{text:`일반석을 끊는다`,results:[{weight:85,text:`눈을 감았다 뜨니 도착이었습니다. 처음 보는 구의 바다가 파랬습니다.`,do:[W(`돈`,-50),W(`정신`,3),q(`워프 열차를 타고 여행했다`,3)]},{weight:15,text:`도착했습니다. 정리 요원이 담요를 덮어 주었습니다. 그런데 왜, 수천 년쯤 지난 기분이 드는 걸까요.`,do:[W(`돈`,-50),W(`정신`,-2),K(`열차`),q(`워프 열차 안에서 아주 긴 꿈을 꾸었다`,4)]}]},{text:`그냥 동네에서 쉰다`,outcome:{text:`국숫집 창가에서 하루를 보냈습니다. 나쁘지 않았습니다.`,do:[W(`정신`,1)]}}]}),J({id:`prosthesis`,ages:[22,65],once:!0,when:`체력 <= 4`,weight:25,title:`의체 상담`,text:`몸이 예전 같지 않습니다. 슈바르츠 인더스트리 대리점 직원이 카탈로그를 펼쳤습니다. "팔 하나면 반년 할부, 다리 하나면 일 년." 뇌만 빼면 전부 소모품인 도시입니다.`,choices:[{text:`의체로 바꾼다`,requires:`돈 >= 80`,requiresText:`80만 안이 필요합니다`,outcome:{text:`새 팔은 아프지 않았습니다. 아픔이 없다는 게 이렇게 이상할 줄은 몰랐습니다.{if has('출신', 'N사')}

nd not has('직업', '은퇴') and not has('직업', '뒷골목 소시민')`,title:`은퇴`,text:`{if has('직업', '해결사')}면허를 반납할 때가 되었는지도 모릅니다. {해결사등급}급 해결사의 무릎은 계단 하나에도 소리를 냅니다.{elif has('직업', '날개')}인사팀이 퇴직 면담을 잡았습니다. 퇴직금, 그리고 기억 처리 동의서. 둥지의 마지막 서류입니다.{elif has('손가락', '중지')}중지에는 은퇴가 없습니다. 큰 형님이 당신 잔에 술을 따랐습니다. "이제 좀 쉬어. 대신 장부는 끝까지 같이 보는 거다."{else}손가락에도 끝은 있습니다. 대개는 좋지 않은 쪽으로. 그래도 당신은 물러날 자리를 청해 보기로 했습니다.{/if}`,choices:[{text:`물러난다`,requires:`not has('손가락', '중지')`,requiresText:`중지는 탈퇴가 없습니다`,outcome:{text:`{if has('직업', '날개')}동의서에 서명했습니다. 몇 해 치 기억이 하얗게 비었습니다. 비어 있다는 것만은 기억합니다.{else}코트를 벗어 옷걸이에 걸었습니다. 생각보다 가벼웠습니다.{/if}`,do:[{do:`tag`,key:`전직`,value:`tag('직업')`},K(`직업`,`은퇴`),W(`정신`,2),q(`일에서 물러났다`,4)]}},{text:`아직은 계속한다`,outcome:{text:`몸은 늙어도 이름은 아직 쓸모가 있었습니다.`,do:[W(`정신`,-1)]}}]}),J({id:`old_home`,ages:[55,90],once:!0,title:`옛 동네`,text:`{if has('출신', 'N사')}14구 쿠키 거리에 다시 와 보았습니다. 버터 냄새는 그대로인데 공방 간판은 다 바뀌었습니다.{elif has('출신', 'T사')}20구의 시계탑은 그대로 열두 개입니다. 당신 회중시계의 하루는 어릴 때보다 조금 길어졌습니다.{elif has('출신', 'S사')}19구의 성벽은 여전히 마천루보다 높았습니다. 대호수 가에 앉은 노인이 당신의 사투리를 듣고 말했습니다. ‘오랜만이로구먼, 아직 살아 있었나.’{elif has('출신', 'K사')}11구는 하나도 변하지 않았습니다. 검문소 줄도, 에메랄드빛 조명도, 보살 치킨 냄새도. 너무 변하지 않아서 오히려 낯설었습니다.{elif has('출신', 'D사')}4구는 그대로 평범했습니다. 도시 끝의 검은 숲은 어릴 때와 같은 거리에서 조용히 서 있었습니다. 다가가지도, 멀어지지도 않으면서.{else}홍원은 그사이 몇 백 번의 재적일을 지났습니다. 당신이 태어난 방이 어디로 갔는지는 아무도 모릅니다.{/if}`,choices:[{text:`천천히 걷는다`,outcome:{text:`아무도 당신을 알아보지 못했고, 그게 조금 다행이었습니다.`,do:[W(`정신`,2)]}}]}),J({id:`junior`,ages:[55,85],once:!0,title:`후배`,text:`{if tag('전직') == '해결사' or has('직업', '해결사')}9급 면허를 갓 딴 아이가 사무소 문을 두드렸습니다. 예전의 당신처럼 코트가 컸습니다.{else}골목 아이 하나가 당신 이야기를 듣고 싶어 합니다. 이 도시에서 오래 산 사람은 드무니까요.{/if}`,choices:[{text:`아는 것을 다 알려 준다`,outcome:{text:`아이는 밤이 되기 전에 돌아갔습니다. 그것만 가르쳐도 반은 가르친 겁니다.`,do:[W(`정신`,2),K(`후배`),q(`후배에게 살아남는 법을 가르쳤다`,3)]}},{text:`"도시는 배워서 사는 게 아니다"`,outcome:{text:`아이는 고개를 갸웃했습니다. 당신도 그 말이 맞는지 모르겠습니다.`,do:[W(`정신`,1)]}}]}),J({id:`o_funeral`,ages:[56,100],once:!0,weight:22,title:`오랜 친구의 부고`,text:`부고는 짧았습니다. 어릴 적 같은 골목에서 뛰어놀던 이름 하나가 줄 끝에 적혀 있었습니다. 3시 10분 전에 집에 들어가지 못했다고 합니다. 이 도시에서는 드물지 않은 일입니다.`,choices:[{text:`직접 장례에 간다`,outcome:{text:`낡은 사진 속 얼굴들이 하나둘 줄어 있었습니다. 남은 사람들끼리 말없이 국수를 나눠 먹었습니다.`,do:[W(`정신`,-1),W(`처세`,1),q(`오랜 친구를 떠나보냈다`,3)]}},{text:`조의금과 편지만 보낸다`,outcome:{text:`편지는 세 번을 고쳐 썼는데도 짧았습니다. 그래도 마음은 전해졌을 거라고 믿기로 했습니다.`,do:[W(`돈`,-10),W(`정신`,-1)]}}]}),J({id:`o_grandchild`,ages:[58,100],once:!0,weight:30,when:`has('자녀')`,title:`손주`,text:`아이의 아이가 문턱을 넘어 뛰어 들어옵니다. 작고 시끄럽고 따뜻한 것이 한 번 더 생겼습니다. 손주는 당신을 올려다보며 묻습니다. “할머니, 할아버지, 도시는 원래 이랬어?”`,choices:[{text:`옛이야기를 들려준다`,outcome:{text:`이야기 중간쯤 손주가 잠들었습니다. 이불을 덮어 주며 아직 오지 않은 밤들을 생각했습니다.`,do:[W(`정신`,2),q(`손주에게 옛이야기를 들려주었다`,3)]}},{text:`주머니에서 용돈을 꺼내 쥐여 준다`,requires:`돈 >= 10`,requiresText:`용돈이 조금 필요합니다`,outcome:{text:`손주는 눈을 반짝이며 사탕을 사러 뛰어갔습니다. 당신도 오랜만에 웃었습니다.`,do:[W(`돈`,-10),W(`정신`,2)]}}]}),J({id:`o_body`,ages:[58,100],cooldown:6,weight:20,when:`체력 <= 5`,title:`무릎이 먼저 안다`,text:`계단 앞에서 무릎이 먼저 멈췄습니다. 비가 오기 하루 전이면 어김없이 신호를 보냅니다. 병원 대기실의 의자는 딱딱하고, 접수대의 번호표는 길었습니다.`,choices:[{text:`재활 치료를 받는다`,requires:`돈 >= 30`,requiresText:`치료비 30만 안이 필요합니다`,outcome:{text:`한 달을 꼬박 다녔습니다. 걸음이 한결 가벼워졌고, 의사가 이름을 기억해 주었습니다.`,do:[W(`돈`,-30),W(`체력`,2)]}},{text:`참고 천천히 걷는다`,outcome:{text:`지팡이를 하나 샀습니다. 예전보다 먼 곳은 가지 못하지만 가까운 곳은 오래 볼 수 있게 되었습니다.`,do:[W(`정신`,-1)]}}]}),J({id:`o_memoir`,ages:[60,100],once:!0,weight:18,title:`구술 기록 요청`,text:`도시사 편찬소 직원이 찾아왔습니다. 평범한 사람들의 인생을 기록하고 있다고 합니다. {if has('출신', 'N사')}녹음기를 꺼내려다 당신 눈치를 보더니 공책만 펼쳤습니다. 녹화는 N사의 금기니까요.{else}직원은 녹음기를 탁자 위에 올려 두고 공손하게 기다렸습니다.{/if}`,choices:[{text:`처음부터 천천히 이야기한다`,outcome:{text:`세 시간 만에 이야기가 끝났습니다. 기록을 받아 든 직원이 말했습니다. “생각보다 단단한 삶이네요.”`,do:[K(`회고`),W(`정신`,2),q(`자기 인생을 구술로 남겼다`,4)]}},{text:`“별로 할 얘기가 없다”며 손을 젓는다`,outcome:{text:`직원은 아쉬워하며 돌아갔습니다. 그날 밤, 하지 못한 이야기들이 천장에 오래 맺혀 있었습니다.`,do:[W(`정신`,-1)]}}]}),J({id:`o_old_night`,ages:[60,100],cooldown:8,weight:8,title:`3시 10분의 노인`,text:`밤이 되면 젊을 때보다 문이 더 무겁게 느껴집니다. 시계가 3시 10분을 가리킵니다. 오늘따라 골목 끝에서 젖은 발소리가 가까이 들립니다.`,choices:[{text:`서둘러 문을 걸고 이불을 덮는다`,outcome:{text:`발소리는 문 앞에서 한참 서성이다 멀어졌습니다. 아침이 오기까지 오래 걸렸 _nest`,title:`T사 둥지 — 20구`,summary:`시간은 화폐, 색은 사치. 흑백의 거리에서 회중시계를 받는다.`,do:[K(`출신`,`T사`),K(`구역`,`둥지`),G(`지식`,2),G(`처세`,1),G(`돈`,40)]},{id:`t_back`,title:`T사 뒷골목 — 20구`,summary:`공장 매연과 시간 강탈 갱단. 하루가 열 시간인 사람들.`,do:[K(`출신`,`T사`),K(`구역`,`뒷골목`),G(`전투`,1),G(`처세`,2),G(`돈`,5)]},{id:`h_nest`,title:`H사 홍원 — 8구 안쪽`,summary:`네 가문과 환. 한 달에 한 번, 방이 움직인다.`,do:[K(`출신`,`H사`),K(`구역`,`둥지`),G(`지식`,1),G(`처세`,2),G(`돈`,40),dc(`환`)]},{id:`h_back`,title:`H사 홍원 — 8구 테두리`,summary:`햇빛 없는 천장 아래. 재적일마다 누군가 떨어진다.`,do:[K(`출신`,`H사`),K(`구역`,`뒷골목`),G(`전투`,2),G(`처세`,1),G(`돈`,5)]},{id:`s_nest`,title:`S사 둥지 — 19구`,summary:`기와집과 성벽. 과거시험과 쌀 배급, 그리고 노비 문서.`,do:[K(`출신`,`S사`),K(`구역`,`둥지`),G(`지식`,2),G(`처세`,1),G(`돈`,40)]},{id:`s_back`,title:`S사 뒷골목 — 19구 대호수 가`,summary:`성벽 바깥의 어촌. 그물 냄새와 추노꾼의 그림자.`,do:[K(`출신`,`S사`),K(`구역`,`뒷골목`),G(`전투`,1),G(`처세`,1),G(`돈`,5)]},{id:`k_nest`,title:`K사 둥지 — 11구`,summary:`에메랄드빛 평화. 치안은 완벽하고, 꿈은 없다. 주 70시간.`,do:[K(`출신`,`K사`),K(`구역`,`둥지`),G(`체력`,8),G(`지식`,1),G(`처세`,1),G(`돈`,40)]},{id:`k_back`,title:`K사 뒷골목 — 11구 떡갈나무 마을`,summary:`동화 같은 마을, 다정한 이웃들. 달이 바뀔 때마다 조용해지는 사람이 있다.`,do:[K(`출신`,`K사`),K(`구역`,`뒷골목`),G(`처세`,2),G(`정신`,6),G(`돈`,5)]},{id:`d_nest`,title:`D사 둥지 — 4구`,summary:`무슨 회사인지 아무도 모르는 회사의 둥지. 평범해서 더 이상하다.`,do:[K(`출신`,`D사`),K(`구역`,`둥지`),G(`지식`,1),G(`처세`,1),G(`돈`,40)]},{id:`d_back`,title:`D사 뒷골목 — 4구 빈민가`,summary:`평범한 가난. 도시 끝에는 검은 숲이 있다.`,do:[K(`출신`,`D사`),K(`구역`,`뒷골목`),G(`전투`,1),G(`지식`,1),G(`돈`,5)]}]},events:[...e,...t,...n,...r,...i,...a,...o],actions:s,triggers:[{id:`death`,name:`쓰러짐 (생명 보험 확인)`,on:`watch`,when:`체력 <= 0`,do:[{do:`if`,cond:`has('보험')`,then:[cc(`보험`),G(`체력`,4),W(`정신`,-2),K(`부활`),{do:`text`,text:`어둠 속에서 종소리가 들렸습니다. 눈을 뜨니 홍원의 하얀 침대였습니다. 생명 보험 부활 특약. 무언가를 잊은 것 같은데, 무엇인지 기억나지 않습니다.`},q(`죽었다가 H사 생명 보험으로 되살아났다`,5)],else:[uc(`death`)]}]},{id:`twist`,name:`정신 0 → 뒤틀림`,on:`watch`,when:`정신 <= 0`,do:[uc(`distortion`)]},{id:`omen`,name:`뒤틀림의 징조`,on:`watch`,when:`정신 <= 2 and not has('징조')`,do:[K(`징조`),lc(`머릿속 어딘가에서 무언가 비틀리는 소리가 납니다.`)]},{id:`omen_clear`,name:`징조가 가라앉음`,on:` 로 끝냅니다.`]]},{tip:`바로 위아래 "조건" 블록의 조건이 같으면 "위와 같은 조건 · 합치기" 버튼이 나옵니다. 위 블록이 조건에 쓰인 값을 바꾸면 합친 뒤 결과가 달라질 수 있으니 확인하고 누르세요.`}]},{id:`conditions`,group:`블록과 조건`,title:`조건`,summary:`"언제"를 정하는 칸. 이벤트 등장, 선택 가능 여부, 조건 블록, 자동 규칙, 엔딩, 도전과제에 모두 같은 방식으로 씁니다.`,parts:[{title:`만드는 법`,steps:[`빈 조건 칸을 누르고 종류를 고릅니다(변수 비교, 태그가 있음, 아이템을 가지고 있음 …).`,`나타난 칸에서 대상과 값을 고칩니다. 예: [체력] [≥] [3].`,`조건을 더 붙이려면 조건 끝의 ＋를 누릅니다. 사이의 "그리고/또는"을 바꿀 수 있습니다.`]},{title:`조건 종류`,items:[[(0,O.jsx)(X,{children:`변수 비교`}),`체력 ≥ 3, 돈 = 0처럼 값을 비교합니다. 오른쪽에 다른 변수나 수식도 쓸 수 있습니다.`],[(0,O.jsx)(X,{children:`나이 비교`}),`현재 나이를 비교합니다(인생형).`],[(0,O.jsx)(X,{children:`태그가 있음`}),`그 태그가 붙어 있나. "= 값"을 붙이면 값까지 같아야 합니다.`],[(0,O.jsx)(X,{children:`아이템을 가지고 있음`}),`1개 이상 있나.`],[(0,O.jsx)(X,{children:`상태에 걸려 있음`}),`그 상태에 걸려 있나.`],[(0,O.jsx)(X,{children:`이벤트를 겪었음`}),`그 이벤트를 본 적 있나.`],[(0,O.jsx)(X,{children:`확률`}),`정한 %의 확률로 맞습니다. 확인할 때마다 새로 굴립니다.`],[(0,O.jsx)(X,{children:`도전과제를 달성함`}),`이전 판까지 포함해 달성했나.`],[(0,O.jsx)(X,{children:`참 / 거짓`}),`항상 맞음 / 절대 안 맞음. 잠시 꺼 둘 때 씁니다.`],[(0,O.jsx)(X,{children:`수식 직접 쓰기`}),`블록으로 안 되는 복잡한 조건을 글로 씁니다(→ 수식과 함수).`]]},{title:`조건 블록의 작은 버튼`,items:[[(0,O.jsx)(X,{children:`＋`}),`조건을 하나 더 잇습니다.`],[(0,O.jsx)(X,{children:`¬`}),`반대로 만듭니다("~이 아님").`],[(0,O.jsx)(X,{children:`✕`}),`그 조건을 뺍니다.`],[(0,O.jsx)(X,{children:`ƒ / ◇`}),`조건 칸 오른쪽. 수식으로 보기 ↔ 블록으로 보기. 어느 쪽에서 고쳐도 같은 조건입니다.`]]},{note:`조건 칸이 비어 있으면 "항상"으로 봅니다. 단, 자동 규칙의 "항상 감시"는 조건이 꼭 있어야 합니다.`}]},{id:`grouping`,group:`블록과 조건`,title:`묶어 보기`,summary:`목록을 비슷한 조건끼리 모아 보여 주는 기능입니다. 보기만 바뀌고 실제 순서는 그대로입니다.`,parts:[{items:[[(0,O.jsx)(X,{children:`조건별`}),`조건에 처음 나오는 대상(변수·태그·아이템…)이 같은 것끼리 묶습니다. 예: 체력에 관한 규칙은 "체력" 아래로.`],[(0,O.jsx)(X,{children:`시점 › 조건`}),`자동 규칙을 "언제"로 먼저 나누고 그 안에서 조건별로 묶습니다.`],[(0,O.jsx)(X,{children:`단계 › 조건`}),`이벤트를 단계(나이 범위)로 나누고 그 안에서 조건별로.`],[(0,O.jsx)(X,{children:`순서대로`}),`묶지 않고 실제 순서대로. 순서를 바꾸려면 이 보기로 돌아옵니다.`]]},{tip:`묶음 제목을 누르면 접고 펼칩니다. 항목이 7개 이상일 때 나타납니다.`}]},{id:`variables`,group:`규칙`,title:`변수`,screen:`variables`,summary:`체력·돈·호감도처럼 게임 동안 바뀌는 값입니다.`,parts:[{items:[[(0,O.jsx)(X,{children:`이름`}),(0,O.jsxs)(O.Fragment,{children:[`조건과 수식에서 부르는 이름. 예: `,(0,O.jsx)(Y,{children:`체력 >= 3`}),`. 바꾸면 쓰던 곳도 함께 바뀝니다.`]})],[(0,O.jsx)(X,{children:`종류`}),`수치(숫자), 문자(글자), 참/거짓 중 하나.`],[(0,O.jsx)(X,{children:`시작값`}),`게임을 시작할 때의 값.`],[(0,O.jsx)(X,{children:`최솟값 / 최댓값`}),`이 범위를 벗어나지 않게 자동으로 맞춥니다. 최댓값에 다른 변수(최대체력)를 써도 됩니다.`],[(0,O.jsx)(X,{children:`상태창 표시`}),`플레이 화면 위 상태창에 숨김 / 숫자 / 막대 / 글자로 보여 줍니다. 막대는 최댓값이 있어야 합니다.`],[(0,O.jsx)(X,{children:`화면에 보일 이름`}),`ID와 다른 이름을 보여 주고 싶을 때.`],[(0,O.jsx)(X,{children:`값이 바뀌면 알림`}),`결과 화면에 "체력 -1" 같은 알림을 자동으로 띄웁니다.`]]},{title:`세부 설정`,items:[[(0,O.jsx)(X,{children:`계산으로 정해지는 변수`}),`다른 값으로 매번 계산됩니다(예: 전투력 = 힘 + 민첩). 블록으로 직접 바꿀 수 없습니다.`],[(0,O.jsx)(X,{children:`다음 판에도 유지`}),`게임을 새로 시작해도 값이 남습니다. 누적 플레이 수, 해금 같은 데 씁니다.`],[(0,O.jsx)(X,{children:`무작위 시작값`}),`최소·최대 두 칸을 채우면 시작할 때마다 그 사이에서 뽑은 값으로 시작합니다. 예: 3부터 8 사이.`],[(0,O.jsx)(X,{children:`구간별 문구`}),`상태창에 값을 말로 보여 줍니다. 「값이 ○ 이하이면 문구」를 작은 값부터 차례로 적으면 처음 맞는 문구가 보입니다. 예: 그림자 0 이하 ‘없음’, 2 이하 ‘희미함’. 상태창 표시를 「글자」로 하면 값 대신 이 문구만 나옵니다(숫자·막대는 옆에 덧붙음). 비워 둔 문구는 그 구간에서 아무것도 보이지 않습니다.`],[(0,O.jsx)(X,{children:`그룹`}),`여러 변수를 같은 이름으로 묶어 두면, 그중 가장 높은 것을 조건에서 찾을 수 있습니다.`]]}]},{id:`tags`,group:`규칙`,title:`태그`,summary:`미리 만들어 두지 않아도 되는 가벼운 표시. "부상", "직업=어부"처럼 붙였다 뗐다 합니다.`,parts:[{what:`변수는 변수 화면에서 미리 만들어야 하지만, 태그는 블록에서 이름을 적는 순간 생깁니다. "이런 일이 있었다"는 기록이 많을 때 편합니다.`},{items:[[(0,O.jsx)(X,{children:`붙이기`}),`표시만 붙입니다. 예: "첫사랑".`],[(0,O.jsx)(X,{children:`값 넣기`}),`값을 함께 넣습니다. 예: 직업 = 어부.`],[(0,O.jsx)(X,{children:`숫자 더하기`}),`숫자를 쌓습니다. 예: 명성 +1.`],[(0,O.jsx)(X,{children:`떼기`}),`태그를 없앱니다. "(으)로 시작하는 것 모두 떼기"로 "기록:"으로 시작하는 태그를 한꺼번에 뗄 수 있습니다.`]]},{example:(0,O.jsxs)(O.Fragment,{children:[`조건 "태그가 있음 [직업] = [어부]" → 직업이 어부일 때만. 본문에서 `,(0,O.jsx)(Y,{children:`{tag('직업')}`}),`로 값을 넣을 수 있습니다.`]})}]},{id:`inventory`,group:`규칙`,title:`인벤토리 (아이템 · 상태 · 기타)`,screen:`inventory`,summary:`플레이어가 가지거나 걸리는 모든 것을 한 목록에서 만들고, 종류와 "가지고 있는 동안의 효과"를 정합니다.`,parts:[{what:`＋ 요소로 하나 만든 뒤 설정 맨 위의 「종류」에서 아이템·상태·기타 중에 고릅니다. 종류는 나중에 바꿀 수 있습니다. 목록은 종류별로 묶여 보입니다.`},{title:`종류`,items:[[(0,O.jsx)(X,{children:`아이템`}),`개수가 있는 소지품. 소지품 창에 보이고, 플레이어가 직접 쓰게 할 수 있습니다(사용 조건·1개 소모·사용 효과).`],[(0,O.jsx)(X,{children:`상태`}),`부상·감기·축복처럼 한동안 이어지는 효과. 성격(이로움/해로움), 지속 턴, 최대 중첩이 있고, 지속 턴이 다 되면 저절로 풀립니다.`],[(0,O.jsx)(X,{children:`기타`}),`화면에 드러나지 않는 표식. 소지품 창에 보이지 않고, 가지고 있는 동안의 효과만 조용히 적용합니다. 호감·칭호처럼 "있기만 해도 효과가 있는 것"에 씁니다.`]]},{title:`가지고 있는 동안의 효과 (모든 종류 공통)`,items:[[(0,O.jsx)(X,{children:`시간이 흐를 때마다 (상태)`}),`상태 전용(「세부 설정」 안). 시간 단위(년·월·일)가 하나 지날 때마다 실행할 블록. 턴 끝 효과와 달리 한 턴에 시간이 여러 단위 흐르면 그만큼 여러 번 실행됩니다. 아이템·기타로 바꾸면 없어집니다.`],[(0,O.jsx)(X,{children:`변수 보정`}),`가지고 있는 동안 변수를 읽을 때만 더해지는 값. 예: 부적을 가지면 행운 +1. 원래 값은 그대로이고, 잃으면 사라집니다. 상태는 겹친 수만큼 곱해집니다.`],[(0,O.jsx)(X,{children:`매 턴 끝에`}),`가지고 있는(걸려 있는) 동안 턴이 끝날 때마다 실행할 블록. 예: 중독이면 체력 -1, 금화 주머니가 있으면 이자 +5. 아이템은 개수와 상관없이 한 번 실행됩니다.`],[(0,O.jsx)(X,{children:`처음 가지게 될 때 / 걸릴 때`}),`없던 것이 처음 생기는 순간 한 번 실행할 블록(「세부 설정」 안). 이미 가진 것을 더 얻을 때는 실행되지 않습니다.`],[(0,O.jsx)(X,{children:`모두 잃을 때 / 풀릴 때`}),`하나도 없게 되는 순간(상태는 지속 턴이 다 되어 풀리는 순간) 한 번 실행할 블록.`]]},{title:`종류별 칸`,items:[[(0,O.jsx)(X,{children:`최대 소지 수`}),`아이템·기타: 이보다 많이 가질 수 없습니다.`],[(0,O.jsx)(X,{children:`지속 턴 / 최대 중첩 / 성격`}),`상태 전용.`],[(0,O.jsx)(X,{children:`플레이어가 직접 사용할 수 있음`}),`아이템 전용. 켜면 소지품 창에 「사용」 버튼이 생깁니다.`],[(0,O.jsx)(X,{children:`소지품 창에 숨김 / 상태창에 숨김`}),`효과는 그대로 두고 화면에서만 감춥니다. 「기타」는 처음부터 숨겨져 있습니다.`]]},{title:`종류를 바꾸면`,items:[[(0,O.jsx)(X,{children:`아이템 ↔ 기타`}),`표시만 바뀝니다. 설정은 그대로 남습니다.`],[(0,O.jsx)(X,{children:`아이템/기타 ↔ 상태`}),`다른 목록으로 옮겨 담습니다. 이름·설명·변수 보정·매 턴 끝 효과는 가져가고, 「처음 가질 때」는 「걸릴 때」로, 「모두 잃을 때」는 「풀릴 때」로 옮겨집니다. 지속 턴·최대 중첩·사용 설정처럼 그 종류에만 있는 값은 없어집니다.`]]},{title:`플레이 화면에서는`,items:[[(0,O.jsx)(X,{children:`인벤토리 창`}),`플레이 화면 위쪽 버튼 하나로 열립니다. 창 안에서 「아이템」 쪽과 「상태」 쪽을 넘겨 보며 각각 확인합니다(‹ › 또는 탭). 둘 중 하나만 있는 작품에서는 쪽 나눔 없이 그 쪽만 보입니다. 「기타」와 숨김 요소는 나오지 않습니다. 이름은 진행 방식 › 플레이 화면 용어에서 바꿉니다.`]]},{note:`아이템과 상태는 조건·블록에서 쓰는 방식이 다릅니다("가지고 있음" ↔ "걸려 있음"). 아이템↔상태로 바꾸면 그것을 쓰던 블록·조건을 다시 골라야 하고, 「검사」가 빠진 곳을 찾아 줍니다.`}]},{id:`
